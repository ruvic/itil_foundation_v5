function startExam(el, minutes, base, name){
  const items = base.map(x => ({ ...x, order: shuffle([0, 1, 2, 3]), sel: null, flag: false }));
  let i = 0; let left = minutes * 60; const started = Date.now();
  const render = () => {
    const it = items[i];
    el.innerHTML = `<div class="wrap"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div><div class="eyebrow">${esc(name)} · en cours</div><h2 style="margin:0">Question ${i + 1} / ${items.length}</h2></div><div class="row">${minutes ? `<span class="timer" id="timer">${fmtT(left)}</span>` : ''}<button class="btn small" id="finish">Terminer</button></div></div>
    <div class="qnav">${items.map((x, k) => `<button data-j="${k}" class="${k === i ? 'cur' : ''} ${x.sel !== null ? 'ans' : ''} ${x.flag ? 'flag' : ''}" title="Question ${k + 1}">${k + 1}</button>`).join('')}</div>
    <div class="card q"><div class="qt">${esc(it.q.text)}</div><div class="choices">${it.order.map((ci, k) => `<button class="choice ${it.sel === k ? 'sel' : ''}" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(it.q.choices[ci])}</span></button>`).join('')}</div></div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn" id="prev" ${i === 0 ? 'disabled' : ''}>← Précédente</button><button class="btn ${it.flag ? 'primary' : ''}" id="flag">${it.flag ? '⚑ Marquée' : '⚐ Marquer pour y revenir'}</button><button class="btn primary" id="next" ${i === items.length - 1 ? 'disabled' : ''}>Suivante →</button></div>
    <p class="muted" style="font-size:.82rem;margin-top:10px">${items.filter(x => x.sel !== null).length} répondue${items.filter(x => x.sel !== null).length > 1 ? 's' : ''} · ${items.filter(x => x.flag).length} marquée${items.filter(x => x.flag).length > 1 ? 's' : ''}</p></div>`;
    el.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => { it.sel = +b.dataset.k; render(); }));
    el.querySelectorAll('.qnav button').forEach(b => b.addEventListener('click', () => { i = +b.dataset.j; render(); }));
    $('#prev').addEventListener('click', () => { i--; render(); }); $('#next').addEventListener('click', () => { i++; render(); });
    $('#flag').addEventListener('click', () => { it.flag = !it.flag; render(); });
    $('#finish').addEventListener('click', () => { const un = items.filter(x => x.sel === null).length; if (un) { if (!confirmBox(el, `${un} question${un > 1 ? 's' : ''} sans réponse. Terminer quand même ?`, finish, render)) return; } else finish(); });
  };
  const fmtT = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  if (minutes) { examTimer = setInterval(() => { left--; const t = $('#timer'); if (t) { t.textContent = fmtT(left); t.classList.toggle('low', left < 300); } if (left <= 0) { clearInterval(examTimer); finish(); } }, 1000); }
  const finish = () => {
    clearInterval(examTimer);
    const byPart = {}; let score = 0; const failed = [];
    items.forEach(x => { const ok = x.sel !== null && x.order[x.sel] === x.q.answer; const b = byPart[x.part] || (byPart[x.part] = { ok: 0, n: 0 }); b.n++; if (ok) { b.ok++; score++; } else failed.push(x.q.id); recordAnswer(x.q.id, ok); });
    const rec = { name, date: today(), score, total: items.length, byPart, failed, duration: minutes || 0, elapsed: Math.round((Date.now() - started) / 60000) };
    S.exams.push(rec); save();
    const p = pct(score, items.length);
    el.innerHTML = `<div class="wrap"><div class="eyebrow">${esc(name)}</div><h1>Résultat</h1>
    <div class="card" style="text-align:center"><div class="score-big" style="color:${p >= 65 ? 'var(--ok)' : 'var(--bad)'}">${p} %</div><p style="font-size:1.1rem"><b>${p >= 65 ? 'RÉUSSI' : 'ÉCHEC'}</b> · ${score} / ${items.length} bonnes réponses (seuil 26) · ${rec.elapsed} min</p></div>
    <h3 style="margin-top:20px">Résultat par domaine</h3><div class="result-grid">${Object.entries(byPart).map(([k, v]) => `<div class="card"><div class="eyebrow">${esc(k)}</div><b style="font-family:var(--font-head);font-size:1.3rem">${v.ok}/${v.n}</b><div class="bar" style="margin-top:6px"><i class="${pct(v.ok, v.n) >= 65 ? 'ok' : 'warn'}" style="width:${pct(v.ok, v.n)}%"></i></div></div>`).join('')}</div>
    <div class="row"><a class="btn primary" href="#examen" id="back">Retour aux examens blancs</a>${failed.length ? '<button class="btn" id="retry">Refaire les questions ratées</button>' : ''}</div>
    <h3 style="margin-top:24px">Correction détaillée</h3>${items.map((x, k) => { const ok = x.sel !== null && x.order[x.sel] === x.q.answer; return `<div class="card q"><div class="eyebrow">Question ${k + 1} · ${esc(x.part)} <span class="pill ${ok ? 'ok' : 'bad'}">${ok ? 'Juste' : x.sel === null ? 'Sans réponse' : 'Faux'}</span></div><div class="qt">${esc(x.q.text)}</div><div class="choices">${x.order.map((ci, j) => `<div class="choice ${ci === x.q.answer ? 'good' : (j === x.sel ? 'wrong' : '')}"><span class="k">${'ABCD'[j]}</span><span>${esc(x.q.choices[ci])}</span></div>`).join('')}</div><div class="explain">${esc(x.q.explain)} <a href="#sec-${x.q.sec}">Relire la section</a></div></div>`; }).join('')}</div>`;
    const r = $('#retry'); if (r) r.addEventListener('click', () => { const qs = failed.map(findQ).filter(Boolean); runQuiz(el, { title: 'Questions ratées à l\'examen blanc', sub: 'Rattrapage', questions: qs, backHash: 'examen', backLabel: 'Examen blanc' }); });
  };
  render();
}
/* boîte de confirmation intégrée (confirm() indisponible) */
function confirmBox(el, msg, yes, no){
  const d = document.createElement('div'); d.className = 'card'; d.style.cssText = 'position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;max-width:360px;width:90%';
  d.innerHTML = `<p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cno">Continuer l'examen</button><button class="btn primary" id="cyes">Terminer</button></div>`;
  document.body.appendChild(d);
  d.querySelector('#cno').addEventListener('click', () => { d.remove(); no && no(); });
  d.querySelector('#cyes').addEventListener('click', () => { d.remove(); yes(); });
  return false;
}

/* ---------- GLOSSAIRE ---------- */
function renderGlossary(el){
  const entries = GLOSSARY.slice().sort((a, b) => a[0].localeCompare(b[0], 'fr'));
  const letters = [...new Set(entries.map(e => e[0][0].toUpperCase()))];
  let q = '', letter = '';
  const draw = () => { const list = entries.filter(e => (!letter || e[0][0].toUpperCase() === letter) && (!q || (e[0] + ' ' + e[1] + ' ' + e[2]).toLowerCase().includes(q))); $('#glist').innerHTML = list.length ? `<dl class="glist">${list.map(e => `<dt>${esc(e[0])} <small>${esc(e[1])}</small></dt><dd>${esc(e[2])} <a href="#sec-${e[3]}" style="font-size:.82rem">→ ${esc(SEC_BY_ID[e[3]].title)}</a></dd>`).join('')}</dl>` : '<p class="muted">Aucun terme ne correspond.</p>'; document.querySelectorAll('.alpha button').forEach(b => b.classList.toggle('on', b.dataset.l === letter)); };
  el.innerHTML = `<div class="wrap"><div class="eyebrow">Glossaire</div><h1>Glossaire FR / EN</h1><p class="muted">${entries.length} termes, chacun relié à sa section du cours.</p><input class="search" id="gs" type="search" placeholder="Rechercher un terme, une définition…" aria-label="Rechercher"><div class="alpha"><button data-l="">Tous</button>${letters.map(l => `<button data-l="${l}">${l}</button>`).join('')}</div><div id="glist"></div></div>`;
  $('#gs').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); draw(); });
  el.querySelectorAll('.alpha button').forEach(b => b.addEventListener('click', () => { letter = b.dataset.l; draw(); }));
  draw();
}

function renderPlanner(el){

  if (days !== null && days > 0) {
    const studyDays = Math.max(1, days - 2);
    const perDay = Math.ceil(remaining.length / studyDays);
    const dayPlans = []; let k = 0; const start = new Date(today());
    for (let dd = 0; dd < studyDays && k < remaining.length; dd++) { const date = new Date(start); date.setDate(start.getDate() + dd); dayPlans.push({ date, secs: remaining.slice(k, k + perDay) }); k += perDay; }

  } else if (days !== null) plan = `<div class="card"><p>La date d'examen est passée ou aujourd'hui. Concentrez-vous sur les synthèses et un dernier examen blanc.</p></div>`;
  el.innerHTML = `<div class="wrap"><div class="eyebrow">Planificateur</div><h1>Planifier mes révisions</h1>
  <div class="card"><label>Date de l'examen <input type="date" id="exd" value="${esc(d)}" min="${today()}"></label> <button class="btn primary" id="saveD">Enregistrer</button>${d ? ` <button class="btn ghost" id="clrD">Effacer</button>` : ''}${days !== null ? `<p style="margin:10px 0 0"><span class="pill ${days < 7 ? 'bad' : days < 21 ? 'warn' : 'acc'}">${days > 0 ? 'J-' + days : days === 0 ? 'C\'est aujourd\'hui' : 'Date passée'}</span></p>` : ''}</div>

}


/* ---------- FLASHCARDS DU FORMATEUR ---------- */
const TSTATUS = { review: 'À revoir', progress: 'En cours', ok: 'Maîtrisée' };
function tkey(d, c){ return d.id + ':' + c[0]; }
function tstat(d, c){ return S.trainer[tkey(d, c)] || 'review'; }
function deckStats(d){ const r = { review: 0, progress: 0, ok: 0 }; d.cards.forEach(c => r[tstat(d, c)]++); return r; }
function renderTrainer(el){
  const tot = TRAINER_DECKS.reduce((a, d) => a + d.cards.length, 0);
  const all = { review: 0, progress: 0, ok: 0 }; TRAINER_DECKS.forEach(d => { const st = deckStats(d); for (const k in st) all[k] += st[k]; });
  el.innerHTML = `<div class="wrap"><div class="eyebrow">Flashcards du formateur</div><h1>Flashcards AFConsulting</h1>
  <p class="muted">Les ${TRAINER_DECKS.length} jeux de cartes fournis par le formateur (${tot} cartes), avec une réponse modèle rédigée pour chaque question. Comme dans les fichiers Excel, marquez chaque carte <span class="pill bad">À revoir</span> <span class="pill warn">En cours</span> ou <span class="pill ok">Maîtrisée</span> ; avant l'examen, tout doit être maîtrisé.</p>
  <div class="grid c3" style="margin-bottom:18px">
    <div class="card stat"><small>Maîtrisées</small><b style="color:var(--ok)">${all.ok}</b><div class="bar"><i class="ok" style="width:${pct(all.ok, tot)}%"></i></div><small>${pct(all.ok, tot)} % des ${tot} cartes</small></div>
    <div class="card stat"><small>En cours</small><b style="color:var(--warn)">${all.progress}</b></div>
    <div class="card stat"><small>À revoir</small><b style="color:var(--bad)">${all.review}</b><a class="btn small" href="#tcards-all-review" style="margin-top:6px;align-self:flex-start">Réviser toutes les cartes à revoir</a></div>
  </div>
  <ul class="list">${TRAINER_DECKS.map((d, i) => { const st = deckStats(d); const n = d.cards.length; return `<li class="item" style="flex-wrap:wrap"><span class="num">${i + 1}</span><span class="t">${esc(d.title)}<small>${n} cartes · ${esc(d.file)}</small></span><span style="width:120px;flex:none"><span class="bar" style="display:flex;overflow:hidden"><i class="ok" style="width:${pct(st.ok, n)}%;border-radius:0"></i><i class="warn" style="width:${pct(st.progress, n)}%;border-radius:0"></i></span></span><span class="pill ${st.ok === n ? 'ok' : st.ok ? 'warn' : ''}">${st.ok}/${n}</span><span class="row" style="gap:6px;flex-basis:100%;justify-content:flex-end"><a class="btn small" href="#tdeck-${d.id}">Parcourir avec les réponses</a><a class="btn primary small" href="#tcards-${d.id}">Réviser en cartes</a></span></li>`; }).join('')}</ul>
  <p class="muted" style="font-size:.82rem;margin-top:14px">Les questions et thématiques sont celles des fichiers du formateur. Les réponses ont été rédigées comme réponses modèles à partir du support de cours et du référentiel ITIL ; certaines cartes (VSM, pensée complexe, SRE, CALMS, SIAM, Shadow AI) vont au-delà du support écrit.</p></div>`;
}
function renderTrainerDeck(el, id){
  const d = TRAINER_DECKS.find(x => x.id === id); if (!d) return renderTrainer(el);
  let filter = '', q = '', open = {};
  const draw = () => {
    const st = deckStats(d);
    const list = d.cards.filter(c => (!filter || tstat(d, c) === filter) && (!q || (c[1] + ' ' + c[2] + ' ' + c[3]).toLowerCase().includes(q)));
    $('#tlist').innerHTML = list.length ? list.map((c, k) => { const s_ = tstat(d, c); const key = tkey(d, c); return `<div class="card q" data-key="${esc(key)}"><div class="eyebrow">${esc(c[0])} · ${esc(c[1])} <span class="pill ${s_ === 'ok' ? 'ok' : s_ === 'progress' ? 'warn' : 'bad'}">${TSTATUS[s_]}</span></div><div class="qt">${esc(c[2])}</div>
      ${open[key] ? `<div class="explain ok"><b>Réponse :</b> ${esc(c[3])}</div>` : ''}
      <div class="row" style="margin-top:10px;justify-content:space-between"><button class="btn small" data-toggle="${esc(key)}">${open[key] ? 'Masquer la réponse' : 'Voir la réponse'}</button><span class="row" style="gap:4px">${Object.entries(TSTATUS).map(([v, l]) => `<button class="btn small ${s_ === v ? (v === 'ok' ? 'on' : v === 'progress' ? 'on rev' : 'on bad') : ''}" data-st="${v}" data-key="${esc(key)}">${l}</button>`).join('')}</span></div></div>`; }).join('') : '<p class="muted">Aucune carte ne correspond.</p>';
    $('#tstats').innerHTML = `<span class="pill ok">${st.ok} maîtrisées</span> <span class="pill warn">${st.progress} en cours</span> <span class="pill bad">${st.review} à revoir</span>`;
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('primary', b.dataset.filter === filter));
    el.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => { open[b.dataset.toggle] = !open[b.dataset.toggle]; draw(); }));
    el.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => { S.trainer[b.dataset.key] = b.dataset.st; save(); draw(); }));
  };
  el.innerHTML = `<div class="wrap"><div class="crumbs"><a href="#formateur">Flashcards du formateur</a></div><h1>${esc(d.title)}</h1><p class="muted">${d.cards.length} cartes · <span id="tstats"></span></p>
  <div class="row" style="margin-bottom:10px"><input class="search" id="ts" type="search" placeholder="Rechercher dans ce jeu…" aria-label="Rechercher" style="flex:1;min-width:180px"><button class="btn small" data-filter="">Toutes</button><button class="btn small" data-filter="review">À revoir</button><button class="btn small" data-filter="progress">En cours</button><button class="btn small" data-filter="ok">Maîtrisées</button><button class="btn small" id="openall">Tout afficher</button><a class="btn primary small" href="#tcards-${d.id}">Mode cartes</a></div>
  <div id="tlist"></div></div>`;
  $('#ts').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); draw(); });
  el.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { filter = b.dataset.filter; draw(); }));
  $('#openall').addEventListener('click', () => { const allOpen = d.cards.every(c => open[tkey(d, c)]); d.cards.forEach(c => open[tkey(d, c)] = !allOpen); $('#openall').textContent = allOpen ? 'Tout afficher' : 'Tout masquer'; draw(); });
  draw();
}
function renderTrainerCards(el, arg){
  let decks, title, back = 'formateur', onlyReview = false;
  if (arg === 'all-review') { decks = TRAINER_DECKS; title = 'Toutes les cartes à revoir'; onlyReview = true; }
  else { const parts = arg.split('-'); const d = TRAINER_DECKS.find(x => x.id === parts[0]); if (!d) return renderTrainer(el); decks = [d]; title = d.title; back = 'tdeck-' + d.id; onlyReview = parts[1] === 'review'; }
  let deck = []; decks.forEach(d => d.cards.forEach(c => { if (!onlyReview || tstat(d, c) !== 'ok') deck.push({ d, c }); }));
  deck = shuffle(deck); let i = 0, flipped = false; const counts = { review: 0, progress: 0, ok: 0 };
  const render = () => {
    if (!deck.length || i >= deck.length) { el.innerHTML = `<div class="wrap"><div class="crumbs"><a href="#${back}">← Retour</a></div><h2>${esc(title)}</h2><div class="card" style="text-align:center"><p>${deck.length ? `Session terminée : ${counts.ok} maîtrisée${counts.ok > 1 ? 's' : ''}, ${counts.progress} en cours, ${counts.review} à revoir.` : 'Aucune carte à revoir dans cette sélection. Bravo !'}</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Rejouer</button><a class="btn" href="#${back}">Retour</a></div></div></div>`; $('#again').addEventListener('click', () => renderTrainerCards(el, arg)); return; }
    const { d, c } = deck[i]; const s_ = tstat(d, c);
    el.innerHTML = `<div class="wrap"><div class="crumbs"><a href="#${back}">← Retour</a></div><div class="eyebrow">${esc(title)} · ${esc(c[0])} · ${esc(c[1])} <span class="pill ${s_ === 'ok' ? 'ok' : s_ === 'progress' ? 'warn' : 'bad'}">${TSTATUS[s_]}</span></div><h2>Carte ${i + 1} / ${deck.length}</h2><div class="bar" style="margin-bottom:14px"><i style="width:${pct(i, deck.length)}%"></i></div>
    <div class="fc ${flipped ? 'flip' : ''}" id="fc" role="button" tabindex="0" aria-label="Retourner la carte"><div class="inner"><div class="face front"><div class="txt" style="font-size:1.05rem">${esc(c[2])}</div></div><div class="face back"><div class="txt" style="font-size:.95rem;text-align:left">${esc(c[3])}</div></div></div></div>
    <p class="muted" style="text-align:center;margin-top:10px">${flipped ? 'Évaluez votre maîtrise de cette carte' : 'Répondez mentalement en un paragraphe, puis retournez la carte'}</p>
    <div class="row" style="justify-content:center">${flipped ? `<button class="btn" data-g="review" style="border-color:var(--bad);color:var(--bad)">À revoir</button><button class="btn" data-g="progress" style="border-color:var(--warn);color:var(--warn)">En cours</button><button class="btn primary" data-g="ok">Maîtrisée</button>` : `<button class="btn primary" id="flip">Voir la réponse</button>`}</div></div>`;
    const fc = $('#fc'); const flip = () => { flipped = !flipped; render(); };
    fc.addEventListener('click', flip); fc.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    const fb = $('#flip'); if (fb) fb.addEventListener('click', flip);
    el.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => { S.trainer[tkey(d, c)] = b.dataset.g; counts[b.dataset.g]++; save(); i++; flipped = false; render(); }));
  };
  render();
}

/* ---------- démarrage ---------- */
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { if (location.hash === '#' + b.dataset.view) route(); else location.hash = '#' + b.dataset.view; }));
$('.menu-btn').addEventListener('click', () => $('.side').classList.toggle('open'));
const moreBtn = $('#more-btn'), moreMenu = $('#more-menu');
moreBtn.addEventListener('click', () => { moreMenu.hidden = !moreMenu.hidden; moreBtn.setAttribute('aria-expanded', String(!moreMenu.hidden)); });
window.addEventListener('hashchange', () => { moreMenu.hidden = true; moreBtn.setAttribute('aria-expanded', 'false'); const v = topViewOf((location.hash || '#home').slice(1).replace(/-.*$/, '')); moreBtn.classList.toggle('more-on', ['formateur','glossaire','syntheses','planning','reglages'].includes(v)); });
document.addEventListener('click', e => { if (!e.target.closest('#more-menu') && !e.target.closest('#more-btn')) { moreMenu.hidden = true; moreBtn.setAttribute('aria-expanded', 'false'); } });
$('.side').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) location.hash = '#' + b.dataset.go; });
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (a && a.getAttribute('href') === location.hash) { e.preventDefault(); route(); } });
document.addEventListener('click', e => { if (window.innerWidth <= 860 && !e.target.closest('.side') && !e.target.closest('.menu-btn')) $('.side').classList.remove('open'); });
route();
window.dispatchEvent(new Event('hashchange'));
})();

</script>

<script>
window.__installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installPrompt = e; const b = document.getElementById('install'); if (b) b.hidden = false; });
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').then(reg => { reg.addEventListener('updatefound', () => { const nw = reg.installing; nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = 'Nouvelle version disponible. <button class="btn small" style="margin-left:8px">Recharger</button>'; t.querySelector('button').onclick = () => location.reload(); document.body.appendChild(t); } }); }); }).catch(() => {}); }); }
</script>
