  /* ---------- B2 CONCEPTS CLÉS ---------- */
  { id: 'B2', title: 'Partie 2 : Concepts clés de la gestion des produits et services numériques', weight: '30 % de l\'examen',
    sections: [
    { id: 'B2-1', title: 'Vocabulaire fondamental : valeur, output, outcome', html: `
<dl>
<dt>Valeur (Value)</dt><dd>L'importance, l'utilité ou les bénéfices <b>perçus</b> d'un produit ou d'un service. La valeur n'est pas fixe : elle dépend entièrement de la <b>perception du client</b>.</dd>
<dt>Co-création de valeur (Value Co-creation)</dt><dd>La valeur n'est pas livrée « prête à l'emploi » : elle est générée <b>conjointement</b> par une collaboration active et continue entre le fournisseur et le consommateur.</dd>
<dt>Output (Livrable)</dt><dd>Résultat tangible ou intangible d'une activité ou d'un processus (ex. : installation d'un logiciel, déploiement d'un serveur).</dd>
<dt>Outcome (Résultat attendu)</dt><dd>Résultat pour une partie prenante, rendu possible par les livrables (ex. : augmentation des ventes grâce au logiciel installé).</dd>
</dl>
<p class="rule">Règle d'examen : ne confondez jamais <b>Output</b> (livrable) et <b>Outcome</b> (résultat pour la partie prenante).</p>`,
      retenir: ['Valeur = perçue, dépend du client, co-créée.', 'Output = livrable ; Outcome = résultat obtenu grâce au livrable.'] },
    { id: 'B2-2', title: 'L\'anatomie d\'une offre : les 4 caractéristiques de qualité', html: `
<p>La valeur d'un produit numérique se mesure à travers <b>quatre piliers indissociables</b> (les deux derniers renforcés ou nouveaux en V5) :</p>
<table><thead><tr><th>Pilier</th><th>Définition</th></tr></thead><tbody>
<tr><td><b>Utilité (Utility)</b></td><td>Ce que fait le produit (<i>fit for purpose</i>). La fonctionnalité offerte pour répondre à un besoin (ex. : application pour réserver une voiture).</td></tr>
<tr><td><b>Garantie (Warranty)</b></td><td>La manière dont le service fonctionne (<i>fit for use</i>). Assurance que les niveaux de performance seront tenus : disponibilité, sécurité, continuité, capacité.</td></tr>
<tr><td><b>Expérience (Experience / DX)</b></td><td>La réponse émotionnelle, cognitive et pratique de l'utilisateur face à la technologie. Le service doit être aussi agréable et fluide qu'il est fonctionnel.</td></tr>
<tr><td><b>Durabilité (Sustainability)</b></td><td>Assurance que le produit respecte et continuera de respecter les exigences environnementales, sociales et économiques de long terme.</td></tr>
</tbody></table>`,
      retenir: ['Utilité = fit for purpose ; Garantie = fit for use (dispo, sécurité, continuité, capacité).', 'ITIL 5 ajoute Expérience et Durabilité.'] },
    { id: 'B2-3', title: 'Les rôles de l\'écosystème numérique et l\'architecture du modèle opérationnel', html: `
<h4>Rôles</h4>
<dl>
<dt>Fournisseur de services (Service Provider)</dt><dd>L'organisation qui conçoit, livre, gère et supporte le produit ou service numérique.</dd>
<dt>Fournisseur de produit (Product Vendor)</dt><dd><i>Nouveauté ITIL 5.</i> Tiers externe qui fournit des briques logicielles, des API ou des solutions sur étagère intégrées dans vos produits.</dd>
<dt>Consommateur (Service Consumer)</dt><dd>Terme générique regroupant : le <b>Client (Customer)</b> qui définit les exigences et prend la responsabilité des budgets ; l'<b>Utilisateur (User)</b> qui interagit quotidiennement avec le service ; le <b>Sponsor</b> qui autorise le budget.</dd>
</dl>
<h4>Architecture du modèle opérationnel</h4>
<dl>
<dt>Value System (Système de valeur)</dt><dd>Anciennement SVS en ITIL 4. Modèle décrivant comment toutes les composantes d'une organisation collaborent pour transformer opportunités et demande en valeur tangible. Le mot « Service » a été retiré pour englober les produits numériques.</dd>
<dt>Value Chain (Chaîne de valeur)</dt><dd>Cœur opérationnel du système de valeur : <b>8 activités interconnectées</b> formant le cycle de vie du produit (de la découverte au support).</dd>
<dt>Flux de valeur (Value Stream)</dt><dd>Combinaison spécifique d'activités de la chaîne de valeur et de processus traçant un chemin précis pour répondre à une demande client (ex. : « Résoudre un incident majeur »).</dd>
<dt>Pratique de management (Management Practice)</dt><dd>Ensemble de ressources organisationnelles (personnes, outils, processus) conçues pour accomplir un objectif spécifique (ex. : gestion des incidents). ITIL 5 en compte <b>34</b>.</dd>
</dl>`,
      retenir: ['Consommateur = Client (exigences, budget) + Utilisateur (usage) + Sponsor (autorise le budget).', 'Product Vendor = nouveauté ITIL 5.', 'Value System ⊃ Value Chain (8 activités) ; Value Stream = chemin pour une demande précise ; 34 pratiques.'] },
    { id: 'B2-4', title: 'Les relations de service', html: `
<p>Coopération continue entre deux ou plusieurs organisations pour co-créer de la valeur. Une relation n'est <b>pas une rue à sens unique</b> : les rôles sont fluides, dynamiques et interconnectés. Trois piliers :</p>
<h4>1. Les rôles</h4>
<p>Une même entité peut changer de rôle selon le contexte : <b>Fournisseur de services</b> (création, livraison, support), <b>Consommateur de services</b> (achat, financement, utilisation), <b>Fournisseur de produits numériques</b> (Digital Product Vendor, nouveauté accentuée en V5 : développe, maintient et améliore briques logicielles, plateformes ou API).</p>
<h4>2. Le modèle d'interaction en trois volets</h4>
<div class="flow3"><div>Offre de service<br><small>(Service Provision)<br>par le Provider</small></div><div>Gestion de la relation<br><small>(Service Relationship Management)<br>activités jointes</small></div><div>Consommation de service<br><small>(Service Consumption)<br>par le Consumer</small></div></div>
<ul>
<li><b>Offre de service</b> : activités du fournisseur pour rendre ses produits disponibles, gérer les infrastructures et assurer le support.</li>
<li><b>Consommation de service</b> : activités du consommateur pour utiliser le service, gérer ses utilisateurs et fournir du feedback.</li>
<li><b>Gestion de la relation</b> : activités conjointes en partenariat pour assurer un alignement continu et une communication fluide.</li>
</ul>
<h4>3. Les trois niveaux de relations (nouveauté V5)</h4>
<table><thead><tr><th>Niveau</th><th>Description</th></tr></thead><tbody>
<tr><td><b>Basique (Basic)</b></td><td>Services très standardisés et répétitifs ; le fournisseur définit la structure ; interaction transactionnelle (ex. : souscrire à un outil SaaS grand public).</td></tr>
<tr><td><b>Coopérative (Cooperative)</b></td><td>Niveau d'interaction plus élevé ; les parties s'ajustent et coordonnent de manière flexible, sans fusionner leurs processus décisionnels.</td></tr>
<tr><td><b>Collaborative (Collaborative)</b></td><td>Véritable partenariat stratégique à long terme ; risques partagés, co-conception active, gouvernance partagée.</td></tr>
</tbody></table>`,
      retenir: ['3 volets : Provision (fournisseur) / Relationship Management (joint) / Consumption (consommateur).', '3 niveaux : Basique (transactionnel) → Coopérative (ajustement) → Collaborative (partenariat, risques partagés).'] },
    { id: 'B2-5', title: 'L\'Expérience Numérique (Digital Experience, DX)', html: `
<p>Évolution philosophique et opérationnelle majeure : la performance IT ne se mesure plus uniquement par des indicateurs techniques froids ; <b>la valeur réelle d'un service numérique est déterminée par la qualité de l'expérience vécue par l'humain</b>.</p>
<h4>1. Définition</h4>
<p>L'expérience est la <b>réponse humaine (émotions, perceptions, comportements et confiance)</b> face aux interactions avec un produit ou service numérique. Deux dimensions :</p>
<ul>
<li><b>Expérience Client (CX, Customer Experience)</b> : parcours global, facilité d'usage, valeur perçue par les clients externes et utilisateurs finaux.</li>
<li><b>Expérience Collaborateur (EX / DEX, Employee Digital Experience)</b> : fluidité des outils internes. Une mauvaise expérience collaborateur détruit l'efficacité opérationnelle.</li>
</ul>
<h4>2. Des SLA aux XLA</h4>
<ul>
<li><b>SLA traditionnel</b> : « l'effet Pastèque » : voyant au vert (réseau disponible à 99,9 %) alors que l'utilisateur vit une expérience frustrante (lenteur applicative). <b>Vert à l'extérieur, rouge à l'intérieur.</b></li>
<li><b>XLA (Experience Level Agreement)</b> : complète le SLA en mesurant des <b>critères subjectifs et ressentis</b> : données de satisfaction, parcours cartographiés (<i>Journey Mapping</i>), retours émotionnels.</li>
</ul>
<h4>3. Pourquoi la DX est cruciale à l'ère de l'IA</h4>
<p>Risque d'automatisation à outrance (chatbots rigides). La gouvernance de la DX sert de garde-fou : <b>la confiance est préservée</b> (sécurité face aux décisions guidées par l'IA) et <b>le design est centré sur l'humain</b> (<i>Human-Centered Design</i>).</p>`,
      retenir: ['DX = réponse humaine (émotions, perceptions, comportements, confiance).', 'CX (clients) et EX/DEX (collaborateurs).', 'Effet Pastèque : SLA vert mais expérience rouge → XLA.'] },
    { id: 'B2-6', title: 'Le parcours de service (Service Journey)', html: `
<p>Parcours complet, de bout en bout, qu'un consommateur emprunte avec un fournisseur pour co-créer de la valeur. Force à adopter une <b>perspective extérieure (Outside-In)</b> : voir le service à travers les yeux de l'utilisateur.</p>
<h4>Les 7 phases</h4>
<ol class="steps">
<li><b>Exploration (Explore)</b> : le consommateur identifie un besoin et explore les solutions du marché.</li>
<li><b>Engagement (Engage)</b> : premières interactions, confiance mutuelle.</li>
<li><b>Alignement (Offer)</b> : le fournisseur clarifie et aligne son offre.</li>
<li><b>Négociation (Agree)</b> : accord sur modalités, coûts, responsabilités, indicateurs (SLA/XLA).</li>
<li><b>Intégration (Onboard)</b> : prise en charge (comptes, formation, accès).</li>
<li><b>Co-création (Co-create)</b> : phase opérationnelle où la valeur est générée au quotidien.</li>
<li><b>Réalisation (Realize)</b> : évaluation continue des résultats (Outcomes).</li>
</ol>
<h4>Les outils du parcours</h4>
<ul>
<li><b>Points de contact (Touchpoints)</b> : chaque moment ou canal où le consommateur entre en contact avec le fournisseur (recherche sur le portail, chatbot, e-mail, appel au support).</li>
<li><b>Cartographie du parcours (Service Journey Mapping)</b> : représentation visuelle de l'expérience au fil du temps ; suit la courbe émotionnelle (satisfaction vs frustration) à chaque touchpoint pour localiser les irritants.</li>
</ul>
<p>À l'ère de l'IA, le Service Journey sert à décider à quel <i>touchpoint</i> l'IA intervient et à quel moment le parcours bascule vers un conseiller humain.</p>`,
      retenir: ['7 phases : Explore, Engage, Offer, Agree, Onboard, Co-create, Realize.', 'Perspective Outside-In ; touchpoints et journey mapping.'] },
    { id: 'B2-7', title: 'Le modèle de cycle de vie PSLM et ses 8 activités', html: `
<p>Le <b>Product and Service Lifecycle Management (PSLM)</b> remplace la chaîne de valeur à 6 activités d'ITIL 4 par <b>8 activités interconnectées</b>, conçues comme un système <b>circulaire et non linéaire</b> : des « stepping stones » modulaires que l'organisation combine pour créer des flux de valeur.</p>
<table><thead><tr><th>#</th><th>Activité</th><th>But</th><th>Focus</th></tr></thead><tbody>
<tr><td>1</td><td><b>Découvrir (Discover)</b></td><td>Explorer, identifier et prioriser opportunités, besoins et demandes.</td><td>Stratégie produit et roadmap ; comprendre le contexte avant d'engager des ressources.</td></tr>
<tr><td>2</td><td><b>Concevoir (Design)</b></td><td>Créer plans, architectures et spécifications.</td><td>Intègre dès le départ utilité, garantie, durabilité et DX.</td></tr>
<tr><td>3</td><td><b>Acquérir (Acquire)</b></td><td>Se procurer, louer ou allouer ressources et composants.</td><td>Serveurs cloud, licences, API de tiers.</td></tr>
<tr><td>4</td><td><b>Construire (Build)</b></td><td>Développer, assembler, configurer et tester.</td><td>DevOps, CI/CD, automatisation ; produit validé avant la production.</td></tr>
<tr><td>5</td><td><b>Transitionner (Transition)</b></td><td>Déployer vers l'environnement réel avec un minimum de perturbations.</td><td>Versions, conduite du changement, intégration des fournisseurs.</td></tr>
<tr><td>6</td><td><b>Exploiter / Opérer (Operate)</b></td><td>Assurer stabilité, performance et fiabilité au quotidien.</td><td>Surveillance continue, sécurité, maintenance (AIOps).</td></tr>
<tr><td>7</td><td><b>Livrer (Deliver)</b></td><td>Fournir les services aux utilisateurs finaux, concrétiser la promesse de valeur.</td><td>Demandes de services, pilotage de la satisfaction via les XLA.</td></tr>
<tr><td>8</td><td><b>Supporter (Support)</b></td><td>Restaurer le fonctionnement normal en cas d'anomalie.</td><td>Incidents, problèmes, écoute des retours. Les apprentissages alimentent une nouvelle Découverte.</td></tr>
</tbody></table>
<h4>Ce qui change par rapport à ITIL 4</h4>
<ol>
<li><b>Granularité</b> (6 → 8) : ITIL 4 regroupait de grands blocs (Obtain/Build, Design &amp; Transition) ; ITIL 5 les sépare.</li>
<li><b>Apparition de « Discover »</b> : absente de la V4, garantit qu'aucun produit n'est conçu sans validation préalable de la valeur.</li>
<li><b>Orientation Produit End-to-End</b> : de l'idéation au support quotidien.</li>
</ol>
<h4>Exemple : déploiement d'un outil de traduction IA dans une application bancaire</h4>
<p>Discover (valider le besoin des clients voyageant) → Design (UX/UI et architecture IA) → Acquire (achat de tokens d'API) → Build (code et tests automatiques) → Transition (mise en production un mardi soir sans coupure) → Operate (AIOps surveille les temps de réponse) → Deliver (les clients utilisent l'outil, mesure de satisfaction) → Support (le helpdesk résout un bug d'affichage).</p>
<h4>Les 3 spécificités à retenir</h4>
<ul>
<li><b>La boucle infinie (Feedback Loop)</b> : après Support, données et feedbacks sont réinjectés dans Découverte et Conception (V2, V3 du produit).</li>
<li><b>L'expérience au cœur du cycle (Experience Lens)</b> : l'expérience se façonne à chaque étape, pas seulement à la livraison.</li>
<li><b>L'unification Produit + Service</b> : une chaîne de valeur unique et intégrée pour les équipes Produit, Agile ou DevOps.</li>
</ul>`,
      retenir: ['8 activités : Découvrir, Concevoir, Acquérir, Construire, Transitionner, Exploiter, Livrer, Supporter.', 'Circulaire (feedback loop Support → Discover) ; Discover est nouvelle en V5.'] }
    ] },
  /* ---------- B3 DIMENSIONS ---------- */
  { id: 'B3', title: 'Partie 3 : Les Quatre Dimensions de la gestion des services', weight: '5 % de l\'examen',
    sections: [
    { id: 'B3-0', title: 'Vue d\'ensemble', html: `
<p>Pilier <b>inchangé mais profondément modernisé</b> en ITIL 5. Les Quatre Dimensions garantissent une approche <b>holistique</b>. Enjeu pour l'examen : <b>négliger l'une des quatre dimensions conduit inévitablement à un échec de la création de valeur.</b> Chacune intègre désormais nativement l'IA et l'automatisation.</p>
<div class="grid4">
<div><b>1. Organisations et personnes</b><br><small>Organizations and people</small></div>
<div><b>2. Information et technologie</b><br><small>Information and technology</small></div>
<div><b>3. Partenaires et fournisseurs</b><br><small>Partners and suppliers</small></div>
<div><b>4. Flux de valeur et processus</b><br><small>Value streams and processes</small></div>
</div>
<p>Ces 4 dimensions sont influencées et limitées par des <b>facteurs externes</b> résumés par l'acronyme <b>PESTLE</b> : <b>P</b>olitique, <b>É</b>conomique, <b>S</b>ocial, <b>T</b>echnologique, <b>L</b>égal, <b>E</b>nvironnemental (durabilité numérique).</p>`,
      retenir: ['4 dimensions, toutes indispensables : en négliger une = échec de la valeur.', 'PESTLE = facteurs externes.'] },
    { id: 'B3-1', title: 'Dimension 1 : Organisations et personnes', html: `
<p>Capital humain et structurel. Trois piliers :</p>
<ul>
<li><b>Rôles, responsabilités et structures</b> : <b>équipes produits pluridisciplinaires (Product Teams)</b>, fin des silos ; lignes de communication claires.</li>
<li><b>Culture d'entreprise</b> : climat de confiance et collaboration (partage, transparence, droit à l'erreur) ; alignement sur les objectifs communs.</li>
<li><b>Compétences à l'ère de l'IA : le modèle 6C</b> : Creation (concevoir des offres enrichies), Curation (gérer la qualité des données, <i>garbage in, garbage out</i>), Clarification (traduire un besoin en instructions claires, ingénierie de prompt), Cognition (critiquer et valider les analyses des algorithmes), Communication (empathie, écoute), Coordination (orchestrer des équipes hybrides humains + agents IA).</li>
</ul>
<p class="rule">À retenir pour l'examen : si une question mentionne <b>la formation des employés, le leadership, la culture d'équipe, la définition des postes, les compétences ou la gestion du changement humain</b>, la réponse est la dimension <b>Organisations et personnes</b>.</p>`,
      retenir: ['Mots-clés : formation, leadership, culture, postes, compétences, changement humain.', 'Le modèle 6C décrit les compétences humaines à l\'ère de l\'IA.'] },
    { id: 'B3-2', title: 'Dimension 2 : Information et technologie', html: `
<p>Franchit un cap : pilier central de l'architecture « AI-native ». Englobe les informations nécessaires à la valeur, les technologies de support et surtout la <b>gouvernance de l'IA, des AIOps et de l'automatisation</b>.</p>
<ul>
<li><b>Volet Information</b> : qualité et pertinence des données (éviter les hallucinations), conformité et sécurité (RGPD, chiffrement), gestion des connaissances (Knowledge Management).</li>
<li><b>Volet Technologie</b> : architectures modernes (Cloud, microservices, IoT, API) ; outils de gestion et de surveillance (ticketing nouvelle génération, workflows automatisés, supervision).</li>
<li><b>Gouvernance de l'IA</b> (focus majeur) : <b>éthique et transparence</b> (pas de boîte noire, expliquer la décision) ; <b>responsabilité humaine préservée</b> (règle d'or : l'<i>Accountability</i> finale reste humaine, Service Owners et management IT) ; <b>gestion de la dérive des modèles (Model Drift)</b> par l'observabilité.</li>
<li><b>Automatisation et AIOps</b> : passage du <b>réactif au prédictif</b> (analyse en continu des signaux faibles) ; <b>orchestration automatisée</b> des flux de bout en bout (provisionnement cloud, accès utilisateurs).</li>
</ul>
<p class="rule">À retenir : si une question mentionne <b>les bases de données, l'infrastructure cloud, la sécurité des informations, les outils d'IA, l'AIOps ou les politiques de contrôle éthique d'un algorithme</b>, la réponse est <b>Information et technologie</b>.</p>`,
      retenir: ['Mots-clés : données, cloud, sécurité, outils IA, AIOps, éthique algorithmique.', 'Règle d\'or : la responsabilité finale reste humaine.', 'Le modèle 6C (capacités IA) est rattaché à cette dimension.'] },
    { id: 'B3-3', title: 'Dimension 3 : Partenaires et fournisseurs', html: `
<p>Relations avec les autres entreprises impliquées dans la conception, le développement, le déploiement et l'exploitation. Aucune entreprise ne maîtrise toutes les technologies en interne : la valeur repose sur l'orchestration d'un <b>écosystème de partenaires interconnectés</b>.</p>
<ul>
<li><b>Fournisseur (Supplier)</b> vs <b>Partenaire (Partner)</b> : le fournisseur a une relation commerciale et transactionnelle (relation Basique ou Coopérative), livre un produit standardisé, risques non partagés (ex. : fournisseur d'accès internet). Le partenaire a une relation stratégique et collaborative (relation Collaborative), objectifs communs, risques partagés, co-conception (ex. : agence qui co-crée votre moteur d'IA).</li>
<li><b>Impact de l'IA : les Digital Product Vendors</b> : dépendance technologique (LLM d'OpenAI, Anthropic, Microsoft…), risques de verrouillage (<i>vendor lock-in</i>), gouvernance des contrats (transparence des données, clauses de sortie).</li>
<li><b>Transition vers les XLA</b> : le donneur d'ordre exige des fournisseurs un engagement sur l'expérience utilisateur, pas seulement sur des indicateurs matériels.</li>
<li><b>Stratégie d'approvisionnement</b> (<i>make</i> vs <i>buy</i>) selon : expertise stratégique, flexibilité, coût et vélocité (<i>time-to-market</i>).</li>
</ul>
<p class="rule">À retenir : si une question mentionne <b>les contrats de sous-traitance, les tiers externes, les éditeurs de logiciels, l'intégration d'API tierces, l'outsourcing ou les risques liés à un fournisseur</b>, la réponse est <b>Partenaires et fournisseurs</b>.</p>`,
      retenir: ['Supplier = transactionnel, risques non partagés ; Partner = stratégique, risques partagés.', 'Mots-clés : sous-traitance, tiers, éditeurs, API tierces, outsourcing, lock-in.'] },
    { id: 'B3-4', title: 'Dimension 4 : Flux de valeur et processus', html: `
<p>Squelette opérationnel : comment les parties de l'entreprise coordonnent leurs actions pour transformer une idée, une opportunité ou une demande en valeur réelle. Encadre la cohabitation humains / systèmes automatisés.</p>
<h4>Processus vs flux de valeur (distinction exigée à l'examen)</h4>
<ul>
<li><b>Processus (Process)</b> : suite d'activités logiques, de procédures et de règles qui transforment des entrées en livrables (<i>Outputs</i>). Standardisé, répétitif, confiné à un objectif précis (ex. : gestion des changements, réinitialisation de mot de passe).</li>
<li><b>Flux de valeur (Value Stream)</b> : combinaison sur mesure d'activités (du PSLM) et de processus, connectée de bout en bout pour répondre à une demande client spécifique (<i>Outcome</i>). Traverse souvent plusieurs départements (ex. : « créer et mettre en production une nouvelle application mobile »).</li>
</ul>
<h4>Cartographie des flux de valeur (Value Stream Mapping)</h4>
<p>Éliminer le gaspillage et accélérer le <i>time-to-market</i> : <b>élimination des activités sans valeur ajoutée</b> (validations inutiles, tâches redondantes, attentes) et <b>automatisation intelligente</b> (déléguer les étapes répétitives à des algorithmes ou AIOps).</p>
<h4>Impact de l'IA</h4>
<p><b>Flux hybrides</b> (un chatbot qualifie l'incident, un moteur IA analyse le risque, un humain valide) et <b>agilité des processus</b> (adaptatifs, alignés sur le CI/CD).</p>
<h4>Exemple : « Un utilisateur signale une panne critique sur l'application bancaire »</h4>
<ol><li>Entrée : clic sur « Signaler un bug ».</li><li>Processus IA : l'AIOps détecte l'origine de la panne dans les logs (<i>Exploiter</i>).</li><li>Processus humain : l'ingénieur d'astreinte est alerté avec la solution suggérée (<i>Supporter</i>).</li><li>Processus DevOps : correctif codé, testé et déployé en 15 minutes (<i>Construire → Transitionner</i>).</li><li>Sortie / valeur : l'application fonctionne, l'utilisateur peut faire son virement (<i>Outcome</i>).</li></ol>
<p class="rule">À retenir : si une question mentionne <b>la cartographie des étapes de travail, l'organisation séquentielle des activités, l'efficacité des procédures, la réduction du gaspillage ou l'enchaînement des tâches de bout en bout</b>, la réponse est <b>Flux de valeur et processus</b>.</p>`,
      retenir: ['Processus → Output (standardisé, répétitif) ; Flux de valeur → Outcome (bout en bout, sur mesure).', 'Mots-clés : cartographie, séquence, procédures, gaspillage, bout en bout.'] }
    ] },
  /* ---------- B4 SVS ---------- */
  { id: 'B4', title: 'Partie 4 : Le Système de Valeur des Services (SVS) et ses composants', weight: '40 % de l\'examen',
    sections: [
    { id: 'B4-1', title: 'Vue d\'ensemble de la structure du SVS', html: `
<p>Le <b>Système de valeur des services (SVS, Service Value System)</b> est l'architecture globale d'ITIL 5 : comment toutes les composantes d'une organisation fonctionnent ensemble, comme un système intégré, pour transformer les opportunités et la demande en valeur. Il brise les silos et permet une agilité maximale.</p>
<div class="svs">
<div class="svs-in">Opportunité / Demande</div>
<div class="svs-core">
<div class="ring">Principes directeurs (Guiding Principles)</div>
<div class="ring">Gouvernance (Governance)</div>
<div class="ring core">Chaîne de valeur (Product &amp; Service Value Chain / PSLM)</div>
<div class="ring">Pratiques (Management Practices)</div>
<div class="ring">Amélioration continue (Continual Improvement)</div>
</div>
<div class="svs-out">Valeur</div>
</div>
<h4>Entrées : opportunité et demande</h4>
<ul><li><b>Opportunité</b> : options ou possibilités d'apporter de la valeur (ex. : nouvelle technologie d'IA générative applicable au métier).</li><li><b>Demande</b> : besoin ou désir explicite des clients internes ou externes (ex. : « je veux un accès à cette application »).</li></ul>
<h4>Sortie : la valeur</h4>
<p>Le SVS ne crée pas la valeur unilatéralement : elle est <b>co-créée</b> avec le client lorsqu'il utilise le produit stabilisé (bénéfices perçus, utilité, garantie, expérience).</p>
<h4>À retenir pour l'examen</h4>
<ul><li><b>Flexibilité</b> : le SVS n'est pas rigide ; chaque organisation le configure selon sa taille, sa culture, ses technologies.</li><li><b>Interconnexion</b> : les composants ne fonctionnent pas isolément (une pratique dans la chaîne de valeur respecte les principes directeurs et s'aligne sur la gouvernance).</li></ul>
<h4>Les 5 composants internes</h4>
<ol>
<li><b>Principes directeurs</b> : 7 repères philosophiques et décisionnels.</li>
<li><b>Gouvernance</b> : mécanismes par lesquels l'organisation est dirigée, évaluée et contrôlée (règles strictes sur conformité des données et éthique de l'IA).</li>
<li><b>Chaîne de valeur des services</b> : modèle opérationnel central, matérialisé par le <b>PSLM</b> (8 activités).</li>
<li><b>Pratiques</b> : boîtes à outils, <b>34 pratiques</b>.</li>
<li><b>Amélioration continue</b> : activité omniprésente à tous les niveaux.</li>
</ol>`,
      retenir: ['SVS : entrée = opportunité/demande ; sortie = valeur co-créée.', '5 composants : Principes directeurs, Gouvernance, Chaîne de valeur (PSLM), Pratiques, Amélioration continue.', 'Flexible et interconnecté.'] },
    { id: 'B4-2', title: 'Les 7 principes directeurs (Guiding Principles)', html: `
<p>Premier des 5 composants. <b>Recommandations universelles et immuables</b> qui guident les décisions et actions d'une organisation, quels que soient ses objectifs, sa stratégie, son management ou ses technologies.</p>
<table><thead><tr><th>Principe</th><th>Signification</th><th>Application dans le SVS</th></tr></thead><tbody>
<tr><td><b>1. Privilégier la valeur</b><br><small>Focus on value</small></td><td>Tout ce que fait l'organisation doit être lié à la valeur apportée aux parties prenantes (clients, utilisateurs, sponsors).</td><td>Filtre pour la gouvernance et les pratiques : une automatisation qui détruit la DX n'apporte pas de valeur.</td></tr>
<tr><td><b>2. Commencer là où vous êtes</b><br><small>Start where you are</small></td><td>Ne pas tout rejeter pour reconstruire de zéro ; analyser l'existant objectivement et s'appuyer dessus.</td><td>Mesurer l'efficacité des scripts et bases existants avant de modifier un flux ou d'implémenter un outil d'AIOps.</td></tr>
<tr><td><b>3. Progresser par itérations avec retours</b><br><small>Progress iteratively with feedback</small></td><td>Découper les grands projets en étapes simples ; recueillir des commentaires fréquents.</td><td>Moteur de l'amélioration continue : tester un agent IA sur un petit échantillon, collecter les retours, affiner.</td></tr>
<tr><td><b>4. Collaborer et promouvoir la visibilité</b><br><small>Collaborate and promote visibility</small></td><td>Supprimer les silos ; travailler de manière ouverte et transparente.</td><td>Pratiques et chaîne de valeur transversales ; tableaux de bord visibles (Kanban) entre business, Dev et Ops.</td></tr>
<tr><td><b>5. Penser et travailler de façon holistique</b><br><small>Think and work holistically</small></td><td>Aucun produit, service ou département ne fonctionne isolément.</td><td>Équilibrer l'impact sur les Quatre Dimensions : un outil d'IA sans transformation de la culture et des procédures n'a aucun sens.</td></tr>
<tr><td><b>6. Privilégier la simplicité et le pragmatisme</b><br><small>Keep it simple and practical</small></td><td>Nombre minimal d'étapes ; éliminer tout ce qui ne produit aucune valeur.</td><td>Évite la « paralysie par l'analyse » ; parcours simples et sans frictions dans la chaîne de valeur.</td></tr>
<tr><td><b>7. Optimiser et automatiser</b><br><small>Optimize and automate</small></td><td>Rendre les ressources aussi efficaces que possible <b>avant</b> de confier le travail à la technologie ; l'humain n'intervient que là où il apporte une réelle valeur.</td><td>Cœur des AIOps : automatiser les tâches répétitives (routage des incidents) pour libérer du temps pour l'amélioration continue.</td></tr>
</tbody></table>
<p class="rule">Les principes ne sont pas des règles isolées : ils forment un <b>système interconnecté</b>. Automatiser (7) se fait sous une gouvernance éthique, pour une réelle valeur (1), sans complexifier le système (6).</p>`,
      retenir: ['7 principes : valeur, commencer là où vous êtes, itérations avec retours, collaborer/visibilité, holistique, simplicité, optimiser et automatiser.', 'Optimiser AVANT d\'automatiser.', 'Les principes forment un système interconnecté.'] },
    { id: 'B4-3', title: 'La gouvernance et la gouvernance de l\'IA (modèle 6C)', html: `
<p>Deuxième composant : le système par lequel une organisation est <b>dirigée, évaluée et contrôlée</b>. ITIL 5 repositionne la gouvernance comme un <b>mécanisme d'orientation intégré dans le flux de travail</b> (plus une barrière administrative) : des limites claires à l'intérieur desquelles équipes agiles et systèmes d'IA opèrent de manière <b>autonome, rapide et responsable</b>.</p>
<h4>Les 3 activités clés de la gouvernance</h4>
<ol>
<li><b>Évaluer (Evaluate)</b> : examiner régulièrement l'organisation, sa stratégie, ses performances et les évolutions technologiques (IA) par rapport aux besoins des parties prenantes.</li>
<li><b>Diriger (Direct)</b> : définir la direction stratégique par des politiques, des objectifs et des contraintes (conformité, chartes de sécurité).</li>
<li><b>Contrôler (Monitor)</b> : surveiller la performance des produits et la conformité des pratiques par rapport aux directives, pour s'assurer que la valeur promise est co-créée.</li>
</ol>
<h4>Gouvernance de l'IA : trois règles d'or</h4>
<ul>
<li><b>La responsabilité reste humaine (Accountability)</b> : une IA peut exécuter ou automatiser, mais l'être humain reste le seul responsable légal et opérationnel des résultats.</li>
<li><b>Transparence et explicabilité</b> : pas de boîte noire ; auditer la provenance des données (Curation) et expliquer chaque décision automatisée.</li>
<li><b>Conformité aux régulations</b> : AI Act européen, RGPD ; protéger la confidentialité, éviter l'envoi de données confidentielles sur des serveurs tiers.</li>
</ul>
<h4>Le modèle 6C (ITIL AI Capability Model)</h4>
<p>Innovation majeure d'ITIL V5, issue du livre blanc sur la gouvernance de l'IA (module d'extension <i>ITIL® AI Governance</i>). Classifie fonctionnellement les capacités de l'IA pour concevoir un profil de risque, des contrôles et une gouvernance humaine adaptés. Rattaché à la dimension <b>Information et Technologie</b>.</p>
<table><thead><tr><th>Capacité</th><th>Rôle fonctionnel</th><th>Focus et risques pour la gouvernance</th></tr></thead><tbody>
<tr><td><b>1. Création (Creation)</b></td><td>Générer du contenu neuf : scripts, résumés d'incidents, post-mortem, documentation.</td><td>Précision des données, revue humaine, propriété intellectuelle, hallucinations.</td></tr>
<tr><td><b>2. Curation (Curation)</b></td><td>Organiser, trier et filtrer l'information : corrélation d'alertes, nettoyage de données.</td><td>Biais algorithmiques, suppression accidentelle de données critiques, qualité des données.</td></tr>
<tr><td><b>3. Clarification (Clarification)</b></td><td>Expliquer et simplifier la complexité : traduire le jargon technique pour clients et direction.</td><td>Transparence, droit à l'explication, véracité.</td></tr>
<tr><td><b>4. Cognition (Cognition)</b></td><td>Reconnaître des patterns et prédire : détection proactive d'anomalies, sévérité d'une panne, cause racine.</td><td>Validation des modèles, dégradation dans le temps, taux d'erreur acceptable.</td></tr>
<tr><td><b>5. Communication (Communication)</b></td><td>Interagir naturellement avec les humains : agents virtuels, chatbots de premier niveau, notifications.</td><td>Courtoisie, éthique, obligation d'informer l'usager qu'il parle à une IA, bascule vers un humain.</td></tr>
<tr><td><b>6. Coordination (Coordination)</b></td><td>Orchestrer et exécuter des flux : routage et affectation des tickets, déclenchement de runbooks.</td><td>Périmètre d'autonomie de la machine, auditabilité, mécanismes pour stopper une automatisation.</td></tr>
</tbody></table>
<p>Pourquoi ce modèle ? Une <b>gouvernance sur-mesure</b> (on ne gouverne pas une IA de Curation comme une IA de Coordination qui coupe un serveur) et des <b>cas d'usage combinés</b> (un chatbot utilise Communication + Cognition + Création).</p>
<p class="rule">Gouvernance et management doivent <b>partager les mêmes principes directeurs et les mêmes objectifs</b>. La gouvernance donne les ordres (politiques, conformité, budget) ; les pratiques lui renvoient des données d'audit et de performance.</p>`,
      retenir: ['Gouvernance : Évaluer, Diriger, Contrôler.', '3 règles d\'or IA : responsabilité humaine, transparence/explicabilité, conformité.', '6C : Creation, Curation, Clarification, Cognition, Communication, Coordination (dimension Information & Technologie).'] },
    { id: 'B4-4', title: 'La chaîne de valeur des services (modèle PSLM)', html: `
<p>Troisième composant. Historiquement <i>Service Value Chain (SVC)</i> à 6 activités en ITIL 4, renommée <b>ITIL Value Chain</b> et matérialisée par le <b>PSLM</b> en <b>8 activités interconnectées</b>, aligné sur DevOps, le Cloud et l'IA.</p>
<div class="chain">
<span>Demande du marché / besoins</span><span class="arr">→</span>
<span>1. Découvrir</span><span class="arr">→</span><span>2. Concevoir</span><span class="arr">→</span><span>3. Acquérir</span><span class="arr">→</span><span>4. Construire</span><span class="arr">→</span><span>5. Transitionner</span><span class="arr">→</span><span>6. Opérer</span><span class="arr">→</span><span>7. Livrer</span><span class="arr">→</span><span>8. Supporter</span><span class="arr">→</span><span>Valeur co-créée</span>
</div>
<p class="loop">↺ Boucle de rétroaction continue (Feedback Loop) : Supporter → Découvrir / Concevoir</p>
<ul>
<li><b>Entrée (Input)</b> : la demande, l'opportunité d'innovation ou un besoin métier entrant dans Découvrir.</li>
<li><b>Flux séquentiel (1 à 8)</b> : le produit progresse de l'idée à son exécution technique.</li>
<li><b>Boucle de rétroaction</b> : l'élément le plus important du schéma ; les données de Supporter (incidents récurrents, retours, faiblesses) sont réinjectées dans Découvrir pour la version suivante.</li>
<li><b>Sortie (Output)</b> : la valeur, co-créée tout au long du cycle.</li>
</ul>
<h4>Quelles pratiques interagissent avec chaque activité du PSLM ?</h4>
<table><thead><tr><th>Activité</th><th>Pratiques prioritaires</th></tr></thead><tbody>
<tr><td>1. Découvrir</td><td>Gestion des relations (capter la demande) ; Gestion de la stratégie (aligner les opportunités).</td></tr>
<tr><td>2. Concevoir</td><td>Gestion des niveaux de service (concevoir les XLA) ; Sécurité de l'information (<i>Security by Design</i>) ; Gestion des architectures.</td></tr>
<tr><td>3. Acquérir</td><td>Gestion des fournisseurs ; Gestion des actifs informatiques (ITAM).</td></tr>
<tr><td>4. Construire</td><td>Développement et gestion des logiciels ; Gestion des versions (Release).</td></tr>
<tr><td>5. Transitionner</td><td>Habilitation des changements ; Gestion des déploiements ; Gestion des configurations (SACM).</td></tr>
<tr><td>6. Opérer</td><td>Pilotage et gestion des événements (Monitoring / AIOps) ; Gestion des capacités et performances.</td></tr>
<tr><td>7. Livrer</td><td>Gestion des demandes de services ; Gestion des niveaux de service (mesurer l'XLA vécu).</td></tr>
<tr><td>8. Supporter</td><td>Centre de services ; Gestion des incidents ; Gestion des problèmes.</td></tr>
</tbody></table>
<p>Deux pratiques <b>omniprésentes (cross-functional)</b> infusent les 8 étapes : l'<b>Amélioration continue</b> et la <b>Gestion des connaissances</b>.</p>`,
      retenir: ['PSLM = chaîne de valeur ITIL 5, 8 activités, cycle vivant avec feedback loop.', 'Supporter mobilise Service Desk + Incidents + Problèmes ; Transitionner = Changements + Déploiements + SACM.', 'Omniprésentes : Amélioration continue et Gestion des connaissances.'] },
    { id: 'B4-5', title: 'Les pratiques au sein du SVS : infusion et activation', html: `
<p>Quatrième composant. Les pratiques sont des ensembles de ressources organisationnelles (humaines, techniques, partenaires, processus) permettant d'accomplir un travail. En V5 elles sont <b>« AI-driven »</b> et adaptées aux produits numériques. Trois catégories demeurent : pratiques de gestion générale, de gestion des services, de gestion technique.</p>
<p>L'examen n'interroge plus sur les détails mécaniques des pratiques (0 %), mais sur la manière dont elles <b>infusent et activent</b> les 5 composants : elles <b>infusent</b> (apportent expertise, ressources, processus) et <b>activent</b> (mettent en mouvement la théorie pour produire de la valeur).</p>
<table><thead><tr><th>Composant</th><th>Rôle principal</th><th>Synergie avec les pratiques</th></tr></thead><tbody>
<tr><td>1. Principes directeurs</td><td>Culture &amp; décisions</td><td>Guident l'attitude et l'application de chaque pratique (ex. : Déploiements infuse des pipelines CI/CD pour « Optimiser et automatiser » ; SLM rend « Privilégier la valeur » mesurable via les XLA).</td></tr>
<tr><td>2. Gouvernance</td><td>Contrôle &amp; stratégie</td><td>Alimentée par les pratiques stratégiques (Risques, Portefeuille, Financière) ; les pratiques appliquent les politiques (Risques, Financière, SACM).</td></tr>
<tr><td>3. Modèle PSLM</td><td>Modèle opérationnel (8 étapes)</td><td>Les pratiques s'y combinent pour exécuter les flux de travail (ex. : Supporter = Service Desk + Incidents + AIOps ; Construire = Architectures + Développement logiciel).</td></tr>
<tr><td>4. Pratiques ITIL</td><td>Capacités de l'organisation</td><td>S'infusent mutuellement (Développement logiciel ↔ ITAM) ; l'IA accélère leur exécution par des déclencheurs prédictifs.</td></tr>
<tr><td>5. Amélioration continue</td><td>Évolution &amp; résilience</td><td>Chaque pratique a son sous-processus d'amélioration (Problèmes → analyses de cause racine) ; la pratique Amélioration continue offre le modèle structuré (registre CIR).</td></tr>
</tbody></table>
<h4>Comment une pratique moderne (AIOps / gestion de l'IA) s'insère dans le SVS</h4>
<ul>
<li><b>Dans le PSLM</b> : Découvrir &amp; Concevoir (prédire les besoins), Opérer &amp; Livrer (surveiller en temps réel, corréler les événements), Supporter (résolution prédictive ou automatisée).</li>
<li><b>Dans la gouvernance</b> : IA responsable, éthique, transparente et sécurisée ; indicateurs et tableaux de bord pour auditer les modèles.</li>
<li><b>Dans les principes directeurs</b> : incarne « Optimiser et automatiser », respecte « Privilégier la valeur » (ne jamais dégrader l'XLA), pousse « Collaborer et promouvoir la visibilité ».</li>
<li><b>Dans les pratiques</b> : flux orchestrés par l'IA (pré-qualification des tickets, évaluation instantanée du risque d'un changement).</li>
<li><b>Dans l'amélioration continue</b> : système apprenant qui identifie les faiblesses récurrentes.</li>
</ul>
<p class="rule">En résumé (40 % des points sur le SVS) : <b>le SVS est le corps humain, les composants sont les organes, les pratiques sont le système nerveux.</b> L'AIOps n'est pas « une pratique de plus » : c'est la capacité qui fait passer d'un SVS statique à un SVS <b>dynamique et adaptatif</b>.</p>`,
      retenir: ['Les pratiques infusent (ressources) et activent (mettent en mouvement) les 5 composants.', 'Image : SVS = corps, composants = organes, pratiques = système nerveux.', '3 catégories : gestion générale, gestion des services, gestion technique.'] },
    { id: 'B4-6', title: 'Pratiques en interaction avec la gouvernance et les principes directeurs', html: `
<h4>Pratiques interagissant avec la gouvernance</h4>
<table><thead><tr><th>Famille</th><th>Pratiques</th><th>Rôle</th></tr></thead><tbody>
<tr><td><b>Stratégiques (le pilotage)</b></td><td>Gestion de la stratégie ; Gestion du portefeuille ; Gestion financière des services</td><td>Décliner la vision en objectifs ; décider quels produits financer ou arrêter ; transparence des coûts, budgets et ROI.</td></tr>
<tr><td><b>Conformité et maîtrise des risques (le contrôle)</b></td><td>Gestion des risques ; Gestion de la sécurité de l'information</td><td>Appétence au risque ; confidentialité, intégrité, disponibilité (RGPD, ISO 27001).</td></tr>
<tr><td><b>Gouvernance de l'IA (modèle 6C)</b></td><td>Pratiques de gestion de l'IA</td><td>Indicateurs sur les dérives algorithmiques, cybersécurité des modèles, décisions automatisées éthiques et conformes.</td></tr>
<tr><td><b>Relationnelles et de mesure (la surveillance)</b></td><td>Gestion des relations ; Gestion des niveaux de service</td><td>Alignement sur les besoins des parties prenantes ; tableaux de bord et métriques XLA.</td></tr>
</tbody></table>
<h4>Pratiques illustrant chaque principe directeur</h4>
<table><thead><tr><th>Principe</th><th>Pratiques en interaction</th><th>Activation</th></tr></thead><tbody>
<tr><td>1. Privilégier la valeur</td><td>SLM, Gestion des relations</td><td>Indicateurs XLA ; l'IA analyse en temps réel la perception de la valeur.</td></tr>
<tr><td>2. Commencer là où vous êtes</td><td>SACM, ITAM</td><td>Inventaire et cartographie de l'existant (CMDB) pour conserver et optimiser.</td></tr>
<tr><td>3. Itérations avec retours</td><td>Développement logiciel, Gestion des versions</td><td>Agile et DevOps : petites fonctionnalités itératives, feedback immédiat.</td></tr>
<tr><td>4. Collaborer / visibilité</td><td>Centre de services, Gestion des connaissances</td><td>Centralisation des demandes ; information partagée, non gardée secrète.</td></tr>
<tr><td>5. Holistique</td><td>Gestion des architectures, Gestion des risques</td><td>Un nouvel outil s'intègre sans casser les briques existantes.</td></tr>
<tr><td>6. Simplicité et pragmatisme</td><td>Habilitation des changements</td><td>Suppression des comités d'approbation inutiles pour les changements mineurs.</td></tr>
<tr><td>7. Optimiser et automatiser</td><td>Pilotage et gestion des événements (AIOps / observabilité)</td><td>Machine Learning pour surveiller, trier les tickets, déclencher la remédiation automatique.</td></tr>
</tbody></table>`,
      retenir: ['Gouvernance ← Stratégie, Portefeuille, Financière (pilotage) ; Risques, Sécurité (contrôle) ; Relations, SLM (surveillance).', 'Commencer là où vous êtes ↔ SACM / ITAM ; Simplicité ↔ Habilitation des changements ; Automatiser ↔ AIOps.'] },
    { id: 'B4-7', title: 'L\'amélioration continue (Continual Improvement)', html: `
<p>Cinquième composant et pilier fondamental : à la fois <b>composant global du SVS</b> et <b>pratique de gestion</b> prioritaire. Veille à ce que le système reste dynamique, agile et performant face au marché, aux technologies et à l'IA. Elle s'applique de manière holistique aux autres composants du SVS, aux produits livrés, aux compétences, aux relations fournisseurs et aux outils.</p>
<h4>Le modèle structuré en 7 étapes</h4>
<ol class="steps">
<li><b>Quelle est la vision ?</b> (alignement avec la stratégie de la gouvernance)</li>
<li><b>Où en sommes-nous aujourd'hui ?</b> (mesures de l'état actuel basées sur la data)</li>
<li><b>Où voulons-nous être ?</b> (objectifs cibles, jalons)</li>
<li><b>Comment y parvenir ?</b> (plan d'action)</li>
<li><b>Agir</b> (exécution via les flux de valeur du PSLM)</li>
<li><b>Y sommes-nous parvenus ?</b> (mesure et validation de la valeur co-créée)</li>
<li><b>Comment maintenir l'élan ?</b> (ancrage du changement, réinjection dans la boucle)</li>
</ol>
<h4>L'intégration de la data et de l'IA (nouveauté V5)</h4>
<p>Plus seulement des revues humaines trimestrielles : l'IA prédictive et le Machine Learning analysent en continu les performances et les retours (XLA) pour proposer automatiquement des opportunités d'optimisation. <b>Règle d'or : toutes les décisions d'amélioration reposent sur des données exactes et soigneusement analysées</b> (<i>data-driven</i>).</p>
<h4>Les pratiques qui interagissent avec l'amélioration continue</h4>
<ul>
<li><b>Pratiques d'alimentation (détectent les faiblesses, étape 2)</b> : Gestion des problèmes (causes racines → requêtes dans le <b>CIR, Continual Improvement Register</b>), Pilotage et gestion des événements (AIOps), Gestion des niveaux de service (écart XLA).</li>
<li><b>Pratiques d'exécution (étapes 4 et 5)</b> : Habilitation des changements, Gestion des déploiements et des versions.</li>
<li><b>Pratiques de pérennisation (étape 7)</b> : Gestion des connaissances, Gestion du portefeuille.</li>
</ul>
<p class="rule">Distinction fondamentale pour l'examen : l'amélioration continue se manifeste sous <b>trois formes</b> : (1) le <b>composant interne du SVS</b> (structure globale et modèle 7 étapes), (2) l'<b>état d'esprit (culture)</b> de chaque collaborateur, (3) la <b>pratique de gestion</b> (boîte à outils opérationnelle avec le registre CIR).</p>`,
      retenir: ['7 étapes : vision ? où sommes-nous ? où voulons-nous être ? comment ? agir ; y sommes-nous ? maintenir l\'élan ?', '3 formes : composant du SVS, état d\'esprit, pratique (registre CIR).', 'Décisions data-driven.'] }
    ] },
  /* ---------- B5 PRATIQUES ---------- */
  { id: 'B5', title: 'Partie 5 : Les pratiques de management fondamentales', weight: 'But des pratiques (pas de par cœur)',
    sections: [
    { id: 'B5-1', title: 'Les 10 pratiques fondamentales (priorité haute)', html: `
<p>ITIL 5 conserve les <b>34 pratiques</b> d'ITIL 4 en les réorganisant. PeopleCert les classe par niveau de priorité. Pour les 10 fondamentales, il faut maîtriser le <b>but exact</b> et les <b>concepts clés</b>.</p>
<table><thead><tr><th>Pratique</th><th>But (Purpose)</th></tr></thead><tbody>
<tr><td><b>Gestion des incidents</b><br><small>Incident Management</small></td><td>Restaurer le fonctionnement normal des services le plus rapidement possible en minimisant l'impact négatif sur l'activité.</td></tr>
<tr><td><b>Gestion des problèmes</b><br><small>Problem Management</small></td><td>Réduire la probabilité et l'impact des incidents en identifiant leurs causes réelles et potentielles, et en gérant les solutions de contournement.</td></tr>
<tr><td><b>Habilitation des changements</b><br><small>Change Enablement</small></td><td>Maximiser le nombre de changements réussis en s'assurant que les risques sont correctement évalués et autorisés.</td></tr>
<tr><td><b>Centre de services</b><br><small>Service Desk</small></td><td>Fournir un point de contact unique et efficace pour capturer la demande d'assistance ou les requêtes des utilisateurs.</td></tr>
<tr><td><b>Gestion des niveaux de service</b><br><small>Service Level Management</small></td><td>Définir des objectifs clairs et basés sur la performance, tout en mesurant l'expérience vécue réelle via les métriques XLA.</td></tr>
<tr><td><b>Gestion des demandes de service</b><br><small>Service Request Management</small></td><td>Prendre en charge la qualité convenue des services en traitant efficacement toutes les demandes prédéfinies et initiées par les utilisateurs.</td></tr>
<tr><td><b>Amélioration continue</b><br><small>Continual Improvement</small></td><td>Aligner les pratiques et services sur l'évolution constante des besoins métiers par l'identification récurrente d'optimisations.</td></tr>
<tr><td><b>Gestion des connaissances</b><br><small>Knowledge Management</small></td><td>Maintenir et améliorer l'utilisation efficace, efficiente et pratique des informations et du savoir.</td></tr>
<tr><td><b>Pilotage et gestion des événements</b><br><small>Monitoring &amp; Event Management</small></td><td>Observer systématiquement les composants et services, et enregistrer les changements d'état significatifs en s'appuyant nativement sur l'AIOps.</td></tr>
<tr><td><b>Gestion des relations</b><br><small>Relationship Management</small></td><td>Établir et approfondir les liens entre l'organisation, ses clients, ses partenaires et les autres parties prenantes pour maximiser la co-création de valeur.</td></tr>
</tbody></table>`,
      retenir: ['10 fondamentales : Incidents, Problèmes, Changements, Service Desk, SLM, Demandes, Amélioration continue, Connaissances, Événements, Relations.', 'Connaître le but exact de chacune.'] },
    { id: 'B5-2', title: 'Les 8 pratiques secondaires et les 16 autres', html: `
<p>Pour ces <b>8 pratiques (priorité moyenne)</b>, l'examen exige simplement d'en comprendre le <b>but principal</b> :</p>
<ol>
<li><b>Gestion des versions</b> (Release Management) : assembler les composants testés en un package prêt à être déployé.</li>
<li><b>Gestion des déploiements</b> (Deployment Management) : déplacer le code et les composants vers l'environnement réel.</li>
<li><b>Gestion des configurations</b> (Service Configuration Management, SACM) : cartographie du système, enregistrement des liens logiques (CMDB).</li>
<li><b>Gestion des actifs informatiques</b> (IT Asset Management, ITAM) : tracer et allouer licences et composants.</li>
<li><b>Gestion de la sécurité de l'information</b> (Information Security Management) : confidentialité, intégrité, disponibilité.</li>
<li><b>Gestion de la disponibilité</b> (Availability Management).</li>
<li><b>Gestion de la continuité des services</b> (Service Continuity Management).</li>
<li><b>Gestion des fournisseurs</b> (Supplier Management) : négocier et contractualiser avec les tiers.</li>
</ol>
<p class="rule">Note pour l'examen : pour les <b>16 autres pratiques</b> du catalogue, il suffit d'en connaître le nom et une définition rapide (ex. : Gestion de la stratégie, Gestion du portefeuille, Gestion financière des services, Gestion des risques, Gestion des architectures, Développement et gestion des logiciels, Gestion des capacités et performances…).</p>
<h4>Cadres connexes</h4>
<p>ITIL 5 s'articule avec <b>DevOps</b> (CI/CD, Build et Transition automatisés), <b>Agile</b> (itérations, feedback) et <b>PRINCE2®</b> (gestion de projet) ; le PSLM s'aligne aussi sur le <b>SRE</b> (Site Reliability Engineering).</p>`,
      retenir: ['8 secondaires : Versions, Déploiements, SACM, ITAM, Sécurité, Disponibilité, Continuité, Fournisseurs.', '16 autres : nom + définition rapide.', 'Cadres connexes : DevOps, Agile, PRINCE2, SRE.'] }
    ] },
  /* ---------- B6 EXAMEN ---------- */
  { id: 'B6', title: 'Partie 6 : Mises en situation et préparation à l\'examen', weight: 'Méthode',
    sections: [
    { id: 'B6-1', title: 'Format de l\'examen et stratégie', html: `
<table><tbody>
<tr><th>Format</th><td>Questionnaire à choix multiples (QCM) de <b>40 questions</b>, 1 bonne réponse parmi 4.</td></tr>
<tr><th>Durée</th><td><b>60 minutes</b> (majorée à 75 ou 90 minutes si le français n'est pas votre langue maternelle).</td></tr>
<tr><th>Seuil de réussite</th><td><b>65 %</b>, soit <b>26 bonnes réponses sur 40</b>.</td></tr>
<tr><th>Organisme</th><td>PeopleCert.</td></tr>
<tr><th>Note CPF (France)</th><td>Le parcours peut intégrer une épreuve complémentaire (mise en situation écrite de 2 h + soutenance orale) en plus du QCM.</td></tr>
</tbody></table>
<h4>Mises en situation</h4>

{ id: 'T0', title: 'Les fondamentaux (révision intensive)', file: 'Flashcards_les_fondamentaux_V1.xlsx', cards: [
['FC-01','Module 1 : Concepts clés DPSM','Quelle différence distingue un Produit numérique d\'un Service numérique dans ITIL® 5 ?','Le produit numérique est l\'actif configuré (logiciel, plateforme, API, données) que l\'organisation conçoit, construit et fait évoluer : c\'est le « quoi ». Le service numérique est le moyen de co-créer de la valeur en mettant ce produit à disposition d\'un consommateur, avec le support, l\'expérience et les engagements associés : c\'est le « comment la valeur est rendue ». ITIL 5 unifie leur gestion (DPSM) : on ne sépare plus l\'infrastructure/logiciel du service rendu aux utilisateurs.'],
['FC-02','Module 1 : Concepts clés DPSM','Quels sont les 4 piliers qui déterminent la valeur perçue d\'un produit ou service numérique en V5 ?','Utilité (fit for purpose : ce que fait le produit), Garantie (fit for use : disponibilité, sécurité, continuité, capacité), Expérience (DX : réponse émotionnelle, cognitive et pratique de l\'utilisateur) et Durabilité (respect des exigences environnementales, sociales et économiques de long terme). Les deux derniers sont nouveaux ou fortement renforcés en V5. Les quatre sont indissociables.'],
['FC-03','Module 1 : Concepts clés DPSM','Quel rôle définit les exigences et assume la responsabilité des résultats (outcomes) de la consommation d\'un service ?','Le Client (Customer). Il définit les exigences du service et assume la responsabilité des résultats et des budgets. À distinguer de l\'Utilisateur (qui interagit au quotidien avec le service) et du Sponsor (qui autorise le budget). Ces trois rôles composent le Consommateur de services.'],
['FC-04','Module 1 : Concepts clés DPSM','Quelle différence oppose un Livrable (Output) à un Résultat (Outcome) ?','L\'Output est le résultat tangible ou intangible d\'une activité (ex. : un logiciel installé, un serveur déployé). L\'Outcome est le résultat obtenu pour une partie prenante grâce à ces livrables (ex. : l\'augmentation des ventes rendue possible par le logiciel). La valeur se juge sur les outcomes, pas sur les outputs. Règle d\'examen : ne jamais les confondre.'],
['FC-05','Module 2 : 4 Dimensions & PESTLE','Quelles sont les 4 dimensions de la gestion des produits et services numériques ?','1. Organisations et personnes ; 2. Information et technologie ; 3. Partenaires et fournisseurs ; 4. Flux de valeur et processus. Elles garantissent une approche holistique : négliger l\'une d\'elles conduit à un échec de la création de valeur. Elles sont influencées par les facteurs externes PESTLE.'],
['FC-06','Module 2 : 4 Dimensions & PESTLE','Que signifie l\'acronyme PESTLE et quel est son rôle dans ITIL® 5 ?','Politique, Économique, Social, Technologique, Légal, Environnemental. PESTLE regroupe les facteurs externes que l\'organisation ne contrôle pas mais qui influencent et limitent les 4 dimensions (ex. : une nouvelle loi sur les données, une crise économique, des exigences de durabilité numérique). Il sert à analyser le contexte avant de configurer le système de valeur.'],
['FC-07','Module 2 : 4 Dimensions & PESTLE','Dans quelle dimension classe-t-on l\'intégration d\'un modèle d\'IA générative, les bases de connaissances et les outils d\'observabilité ?','Dans la dimension Information et technologie. Elle couvre les informations nécessaires à la valeur (données, connaissances), les technologies de support (cloud, API, outils de supervision et d\'observabilité) et, en V5, la gouvernance de l\'IA, des AIOps et de l\'automatisation.'],
['FC-08','Module 3 : Cycle de vie (8 activités)','Quelles sont les 8 activités du Cycle de Vie des Produits et Services dans ITIL® 5 ?','Découvrir (Discover), Concevoir (Design), Acquérir (Acquire), Construire (Build), Transitionner (Transition), Exploiter (Operate), Livrer (Deliver), Soutenir/Supporter (Support). Elles forment le PSLM (Product and Service Lifecycle Management), qui remplace la chaîne de valeur à 6 activités d\'ITIL 4.'],
['FC-09','Module 3 : Cycle de vie (8 activités)','Quelle différence oppose les activités Acquérir et Construire ?','Acquérir consiste à se procurer, louer ou allouer les ressources et composants nécessaires (serveurs cloud, licences, API de tiers) : on obtient quelque chose qui existe. Construire consiste à développer, assembler, configurer et tester la solution (code, intégration, CI/CD) : on crée et on valide techniquement le produit avant la production.'],
['FC-10','Module 3 : Cycle de vie (8 activités)','Quelle différence oppose les activités Transitionner et Livrer ?','Transitionner déploie le produit ou service dans l\'environnement réel avec un minimum de perturbations (gestion des versions, conduite du changement, intégration des fournisseurs) : le produit arrive en production. Livrer fournit concrètement le service aux utilisateurs finaux et concrétise la promesse de valeur (traitement des demandes, exécution des fonctionnalités, pilotage de la satisfaction via les XLA) : la valeur est rendue au quotidien.'],
['FC-11','Module 3 : Cycle de vie (8 activités)','Le cycle de vie en 8 activités d\'ITIL® 5 doit-il être exécuté de façon strictement séquentielle ?','Non. Les 8 activités ne forment pas une suite séquentielle obligatoire : ce sont des blocs modulaires (« stepping stones ») que l\'organisation combine pour créer ses flux de valeur. Le modèle est circulaire et itératif : les retours de Soutenir sont réinjectés dans Découvrir et Concevoir (boucle de rétroaction), comme dans les approches agiles et DevOps.'],
['FC-12','Module 4 : ITIL Value System & Pratiques','Quelles sont les entrées, les 5 composants centraux et la sortie de l\'ITIL Value System (ITIL VS) ?','Entrées : l\'Opportunité et la Demande. Cinq composants : les Principes directeurs, la Gouvernance, la Chaîne de valeur (modèle PSLM en 8 activités), les Pratiques (34) et l\'Amélioration continue. Sortie : la Valeur, co-créée avec le consommateur.'],
['FC-13','Module 4 : ITIL Value System & Pratiques','Quelle différence distingue l\'Observabilité de la Surveillance traditionnelle (Monitoring) ?','Le Monitoring surveille des indicateurs prédéfinis et déclenche des alertes sur des seuils connus : il répond aux questions que l\'on a anticipées. L\'Observabilité permet de comprendre l\'état interne d\'un système complexe à partir de ses sorties (logs, métriques, traces corrélées) et de répondre à des questions que l\'on n\'avait pas prévues. Elle est la base des AIOps et du passage du réactif au prédictif.'],
['FC-14','Module 4 : ITIL Value System & Pratiques','Quel est le rôle d\'un budget d\'erreur (Error Budget) dans l\'approche SRE intégrée à ITIL® 5 ?','Le budget d\'erreur est la marge d\'indisponibilité ou d\'erreur tolérée sur une période, dérivée de l\'objectif de niveau de service (ex. : 99,9 % de disponibilité = 0,1 % de budget d\'erreur). Tant que le budget n\'est pas consommé, l\'équipe peut déployer et innover rapidement ; s\'il est épuisé, la priorité passe à la fiabilité. Il arbitre objectivement entre vitesse de changement et stabilité, en cohérence avec « Privilégier la valeur » et « Optimiser et automatiser ».'],
['FC-15','Module 4 : ITIL Value System & Pratiques','Quelle différence oppose un Incident, un Problème et une Erreur connue (Known Error) ?','L\'Incident est un événement qui altère ou dégrade un service ; on le traite en temps réel pour rétablir le service. Le Problème est la recherche de la cause inconnue d\'un ou plusieurs incidents (back office). L\'Erreur connue est un problème dont la cause est connue et pour lequel une solution (temporaire ou définitive) est identifiée mais pas encore mise en œuvre ; le problème n\'est fermé qu\'après la solution définitive.'],
['FC-16','Module 4 : ITIL Value System & Pratiques','Quels sont les 3 types de changements dans la pratique Habilitation des changements ?','Le changement Standard (pré-autorisé, faible risque, procédure documentée et testée), le changement Normal (nécessite une évaluation complète et une autorisation, proportionnées au risque) et le changement Urgent (exception pour limiter un impact métier ; autorisé par une instance appropriée comme l\'ECAB ; retour arrière toujours prévu et testé).'],
['FC-17','Module 5 : Value Stream Mapping & Complexité','Quelle différence distingue un Flux de valeur principal (Core) d\'un Flux de valeur de soutien (Enabling) ?','Le flux de valeur principal (Core) crée directement de la valeur pour le consommateur externe : il répond à une demande client (ex. : « résoudre un incident majeur », « mettre en production une application mobile »). Le flux de valeur de soutien (Enabling) permet aux flux principaux de fonctionner sans livrer directement de valeur au client (ex. : recrutement, gestion des accès, gestion des fournisseurs). Les deux doivent être cartographiés et optimisés.'],
['FC-18','Module 5 : Value Stream Mapping & Complexité','Que mesure l\'Efficience de flux (Flow Efficiency) dans le Value Stream Mapping ?','Flow Efficiency = temps de traitement actif (Process Time) ÷ délai de bout en bout (Lead Time), exprimé en pourcentage. Elle mesure la part du délai total pendant laquelle le travail est réellement traité, par opposition aux temps d\'attente. Une efficience faible (souvent 10 à 20 %) révèle que l\'essentiel du délai est du gaspillage (attentes, files, validations).'],
['FC-19','Module 5 : Value Stream Mapping & Complexité','Selon la Pensée complexe (Complexity Thinking), comment doit-on agir face à une situation complexe (relations de cause à effet imprévisibles) ?','Sonder, détecter, répondre : mener des expérimentations sûres (safe-to-fail), observer les résultats émergents, puis amplifier ce qui fonctionne et stopper ce qui échoue. On n\'impose pas de solution a priori ; on progresse par itérations avec retours, car la relation de cause à effet n\'est compréhensible qu\'après coup.'],
['FC-20','Module 6 : ITIL & Intelligence Artificielle','Quelle différence fondamentale distingue l\'IA Générative (GenAI) de l\'IA Agentique (Agentic AI) ?','L\'IA Générative produit du contenu nouveau (texte, code, résumés, images) en réponse à une sollicitation : elle propose, l\'humain décide et agit. L\'IA Agentique poursuit un objectif de manière autonome en planifiant et en exécutant des actions enchaînées (ouvrir un ticket, exécuter un runbook, redémarrer un service) avec peu ou pas d\'intervention humaine. L\'IA agentique exige donc un périmètre d\'autonomie défini, une auditabilité des actions et un mécanisme d\'arrêt (capacité Coordination du modèle 6C).'],
['FC-21','Module 6 : ITIL & Intelligence Artificielle','Qui porte la responsabilité finale (Accountability) d\'une décision prise ou automatisée par un système d\'IA ?','Toujours un être humain : les propriétaires de services (Service Owners) et le management de l\'IT restent légalement et opérationnellement responsables des résultats. L\'IA peut proposer ou automatiser une action, mais la responsabilité ne se délègue ni à la machine ni au fournisseur du modèle. C\'est la première règle d\'or de la gouvernance de l\'IA dans ITIL 5.'],
['FC-22','Module 6 : ITIL & Intelligence Artificielle','Qu\'est-ce que la dérive d\'un modèle (Model Drift) dans la gouvernance de l\'IA ?','C\'est la dégradation progressive d\'un modèle d\'IA au fil du temps : il perd en précision ou adopte des biais parce que les données réelles s\'éloignent de celles de son entraînement. ITIL 5 impose de la surveiller par l\'observabilité (suivi continu des performances, taux d\'erreur acceptable, ré-entraînement ou retrait du modèle) : la gestion des risques IA ne s\'arrête pas à la mise en production.'],
['FC-23','Module 7 : ITIL & Autres Référentiels','Comment ITIL® 5 et DevOps se complètent-ils ?','DevOps apporte la culture et les pratiques d\'ingénierie (collaboration Dev/Ops, automatisation CI/CD, livraison fréquente, mesure) ; ITIL 5 apporte le cadre de gestion de la valeur de bout en bout (SVS, principes directeurs, gouvernance, pratiques comme l\'habilitation des changements, les incidents, l\'amélioration continue). Le PSLM en 8 activités est aligné sur les cycles DevOps et SRE : ITIL 5 encadre et donne du sens, DevOps exécute vite et bien. Ils ne s\'opposent pas, ils s\'intègrent.'],
['FC-24','Module 7 : ITIL & Autres Référentiels','Quelle est la différence principale entre le périmètre de PRINCE2® et celui d\'ITIL® 5 ?','PRINCE2 est une méthode de gestion de projet : un effort temporaire, avec un début et une fin, pour livrer des produits (outputs) définis dans un cas d\'affaires. ITIL 5 est un cadre de gestion des produits et services numériques tout au long de leur cycle de vie, en continu, centré sur la co-création de valeur (outcomes). Le projet PRINCE2 livre ; ITIL 5 exploite, soutient et améliore en permanence. Les deux se rejoignent à l\'activité Transitionner.']
]},
{ id: 'T1', title: 'Termes et définitions clés (28 cartes)', file: 'Flashcards_Termes_Definitions_Cles_ITIL5_v1.xlsx', cards: [
['01','Module 1 - DPSM','Produit numérique (Digital Product)','Actif numérique configuré (application, plateforme, API, données) conçu, construit et amélioré par une organisation pour permettre la création de valeur. Il est géré de bout en bout par une équipe produit, de la découverte au support. ITIL 5 passe du « service » au « produit numérique » pour s\'adresser directement aux Product Teams.'],
['02','Module 1 - DPSM','Service numérique (Digital Service)','Moyen de co-créer de la valeur en mettant un produit numérique à disposition d\'un consommateur, avec les engagements (SLA/XLA), le support et l\'expérience associés. Le service rend le produit utilisable et utile dans le contexte du consommateur.'],
['03','Module 1 - DPSM','Valeur (Value)','Importance, utilité ou bénéfices perçus d\'un produit ou d\'un service. Elle n\'est pas fixe : elle dépend entièrement de la perception du consommateur et elle est co-créée par la collaboration active entre fournisseur et consommateur.'],
['04','Module 1 - DPSM','Offre de services (Service Offering)','Description formelle d\'un ou plusieurs services, conçue pour répondre aux besoins d\'un groupe cible de consommateurs. Elle combine des biens (fournis), un accès à des ressources et des actions de service (support), avec leurs conditions. En V5, l\'offre doit répondre aux quatre piliers : utilité, garantie, expérience, durabilité.'],
['05','Module 1 - DPSM','Utilité (Utility) vs Garantie (Warranty)','Utilité = fit for purpose : ce que fait le produit, la fonctionnalité qui répond au besoin (ex. : réserver une voiture). Garantie = fit for use : la manière dont il fonctionne, l\'assurance que les niveaux de performance sont tenus (disponibilité, sécurité, continuité, capacité). Les deux sont nécessaires à la valeur.'],
['06','Module 1 - DPSM','Expérience et Durabilité (Pilier V5)','Expérience (DX) : réponse émotionnelle, cognitive et pratique de l\'utilisateur face à la technologie ; le service doit être aussi agréable et fluide que fonctionnel (mesurée par les XLA). Durabilité : assurance que le produit respecte et continuera de respecter les exigences environnementales, sociales et économiques de long terme. Ces deux piliers complètent utilité et garantie en V5.'],
['07','Module 1 - DPSM','Livrable (Output) vs Résultat (Outcome)','Output : résultat tangible ou intangible d\'une activité (logiciel installé, serveur déployé). Outcome : résultat obtenu par une partie prenante grâce aux livrables (ventes en hausse, décisions plus rapides). La valeur se mesure aux outcomes.'],
['08','Module 1 - DPSM','Client, Utilisateur et Sponsor','Trois rôles du consommateur de services. Client : définit les exigences et porte la responsabilité des résultats et des budgets. Utilisateur : interagit concrètement et quotidiennement avec le service. Sponsor : autorise le budget. Une même personne peut cumuler plusieurs rôles.'],
['09','Module 2 - 4 Dimensions','Les 4 Dimensions de la gestion des produits et services','Organisations et personnes ; Information et technologie ; Partenaires et fournisseurs ; Flux de valeur et processus. Approche holistique obligatoire : négliger une dimension fait échouer la création de valeur. Chacune intègre nativement l\'IA en V5.'],
['10','Module 2 - 4 Dimensions','Analyse PESTLE','Analyse des facteurs externes Politiques, Économiques, Sociaux, Technologiques, Légaux et Environnementaux qui influencent et contraignent les 4 dimensions sans être maîtrisables par l\'organisation.'],
['11','Module 3 - Cycle de Vie','Les 8 activités du Cycle de Vie ITIL 5','Découvrir, Concevoir, Acquérir, Construire, Transitionner, Exploiter, Livrer, Soutenir (PSLM). Blocs modulaires, non séquentiels, organisés en cycle avec boucle de rétroaction de Soutenir vers Découvrir.'],
['12','Module 3 - Cycle de Vie','Découvrir (Discover) vs Concevoir (Design)','Découvrir : explorer, identifier et prioriser opportunités, besoins et demandes ; valider qu\'un besoin réel existe (stratégie produit, roadmap). Concevoir : créer les plans, architectures et spécifications une fois le besoin validé, en intégrant utilité, garantie, durabilité et DX. On ne conçoit pas sans avoir découvert.'],
['13','Module 3 - Cycle de Vie','Acquérir (Acquire) vs Construire (Build)','Acquérir : obtenir ce qui existe (ressources cloud, licences, API de tiers). Construire : développer, assembler, configurer et tester la solution (DevOps, CI/CD).'],
['14','Module 3 - Cycle de Vie','Transitionner (Transition) vs Livrer (Deliver)','Transitionner : déployer en environnement réel avec un minimum de perturbations (versions, conduite du changement). Livrer : fournir effectivement le service aux utilisateurs et concrétiser la valeur au quotidien (demandes, XLA).'],
['15','Module 3 - Cycle de Vie','Exploiter (Operate) vs Soutenir (Support)','Exploiter : assurer la stabilité, la performance et la fiabilité des composants techniques (surveillance, maintenance, AIOps) ; c\'est l\'infrastructure qui tourne. Soutenir : restaurer le fonctionnement normal pour les utilisateurs en cas d\'anomalie (incidents, problèmes, écoute des retours) ; c\'est l\'aide aux personnes.'],
['16','Module 4 - ITIL VS','Système de Valeur ITIL (ITIL Value System)','Architecture globale décrivant comment toutes les composantes de l\'organisation fonctionnent ensemble pour transformer opportunité et demande en valeur. Cinq composants : principes directeurs, gouvernance, chaîne de valeur (PSLM), pratiques, amélioration continue. Flexible et interconnecté.'],
['17','Module 4 - ITIL VS','Gouvernance (Triade EDM)','Système par lequel l\'organisation est dirigée, évaluée et contrôlée, exercé par trois activités : Évaluer (Evaluate), Diriger (Direct), Contrôler/Surveiller (Monitor). En V5 elle intègre la gouvernance de l\'IA : responsabilité humaine, transparence, conformité.'],
['18','Module 4 - ITIL VS','Observabilité vs Surveillance (Monitoring)','Monitoring : alertes sur des seuils et indicateurs prédéfinis (questions anticipées). Observabilité : comprendre l\'état interne d\'un système à partir de logs, métriques et traces corrélés, pour répondre à des questions imprévues ; fondement des AIOps.'],
['19','Module 4 - ITIL VS','Ingénierie de la fiabilité des sites (SRE) & Error Budget','SRE : approche d\'ingénierie qui applique des pratiques logicielles à l\'exploitation pour garantir la fiabilité (automatisation, objectifs de niveau de service, observabilité). Error Budget : marge d\'erreur tolérée dérivée de l\'objectif de fiabilité ; tant qu\'elle n\'est pas consommée, on peut innover vite ; épuisée, on priorise la stabilité.'],
['20','Module 4 - ITIL VS','Incident, Problème et Erreur connue','Incident : événement qui dégrade un service (rétablir vite). Problème : cause inconnue d\'incidents (analyser). Erreur connue : problème à cause connue avec solution identifiée non encore mise en œuvre.'],
['21','Module 4 - ITIL VS','Types de changements (Habilitation)','Standard (pré-autorisé, faible risque, procédure établie), Normal (évaluation et autorisation proportionnées au risque), Urgent (exception, autorisée par l\'ECAB, retour arrière testé).'],
['22','Module 5 - VSM','Flux de valeur Principal (Core) vs Soutien (Enabling)','Core : crée directement de la valeur pour le consommateur (répond à une demande client). Enabling : permet aux flux principaux de fonctionner sans livrer directement de valeur au client (RH, achats, gestion des accès).'],
['23','Module 5 - VSM','Lead Time, Process Time et Flow Efficiency','Lead Time : délai total de bout en bout, de la demande à la livraison. Process Time : temps de travail actif réellement passé sur l\'élément. Flow Efficiency = Process Time ÷ Lead Time (%) : part du délai qui est du travail utile ; le reste est de l\'attente à éliminer.'],
['24','Module 5 - VSM','Pensée complexe (Complexity Thinking)','Approche reconnaissant que tous les contextes ne se gèrent pas de la même façon : Clair (bonnes pratiques, standardiser), Compliqué (expertise, analyser), Complexe (expérimenter, sonder-détecter-répondre), Chaotique (agir d\'abord pour stabiliser). ITIL 5 l\'intègre pour adapter la gestion des flux de valeur au niveau d\'incertitude.'],
['25','Module 6 - ITIL & IA','IA Générative (GenAI) vs IA Agentique (Agentic AI)','GenAI : produit du contenu nouveau sur sollicitation, l\'humain décide. Agentic AI : poursuit un objectif de façon autonome en planifiant et exécutant des actions enchaînées ; nécessite périmètre d\'autonomie, auditabilité et mécanisme d\'arrêt.'],
['26','Module 6 - ITIL & IA','Gouvernance de l\'IA & Accountability','Cadre ITIL 5 (modèle 6C, trois règles d\'or) : la responsabilité finale reste humaine (Service Owners, management), les décisions doivent être transparentes et explicables, l\'usage doit être conforme aux régulations (AI Act, RGPD). L\'IA exécute ; l\'humain répond des résultats.'],
['27','Module 6 - ITIL & IA','Dérive d\'un modèle (Model Drift)','Perte progressive de précision ou apparition de biais d\'un modèle d\'IA lorsque les données réelles s\'éloignent de ses données d\'entraînement. Prévention : observabilité continue des performances, seuils d\'erreur acceptables, ré-entraînement ou retrait.'],
['28','Module 7 - Référentiels','Articulation ITIL 5, DevOps et PRINCE2','PRINCE2 pilote le projet (temporaire, livre des produits selon un cas d\'affaires) ; DevOps fournit la culture et l\'automatisation pour construire et déployer vite et sûrement ; ITIL 5 gère la valeur de bout en bout et en continu (SVS, pratiques, amélioration continue). Ils se complètent : ITIL 5 ne remplace ni l\'un ni l\'autre.']
]},
{ id: 'T2', title: 'Module 2 : Les 4 Dimensions & PESTLE', file: 'Flashcards_4_Dimensions_Gestion_ITIL5_Foundation_V1.xlsx', cards: [
['FC-4D-01','Vue d\'ensemble','Quelles sont les 4 dimensions de la gestion des produits et services numériques dans ITIL® 5 ?','Organisations et personnes ; Information et technologie ; Partenaires et fournisseurs ; Flux de valeur et processus. Pilier inchangé depuis ITIL 4 mais profondément modernisé : chaque dimension intègre désormais nativement les impacts de l\'IA et de l\'automatisation.'],
['FC-4D-02','Équilibre holistique','Pourquoi les 4 dimensions doivent-elles être considérées de manière équilibrée et holistique ?','Parce qu\'elles sont interdépendantes : un produit n\'a de valeur que si les personnes, les informations et technologies, les partenaires et les flux de travail sont alignés ensemble. Négliger l\'une d\'elles (ex. : technologie sans compétences, flux sans gouvernance des fournisseurs) conduit inévitablement à un échec de la création de valeur. C\'est l\'application du principe « Penser et travailler de façon holistique ».'],
['FC-4D-03','Positionnement','Comment les 4 dimensions se positionnent-elles par rapport au Système de Valeur ITIL (ITIL VS) ?','Elles ne sont pas un composant du SVS (qui en compte cinq : principes, gouvernance, chaîne de valeur, pratiques, amélioration continue). Elles sont les quatre perspectives à appliquer à chaque composant et à chaque activité du SVS pour garantir une approche globale. Les pratiques fournissent aux activités de la chaîne de valeur les ressources des 4 dimensions.'],
['FC-4D-04','Dimension 1 : Organisations & personnes','Quel est l\'objectif principal de la dimension « Organisations et personnes » ?','S\'assurer que le capital humain et structurel soutient efficacement la co-création de valeur : rôles, responsabilités et structures claires (équipes produits pluridisciplinaires, lignes de communication), culture de confiance et de collaboration alignée sur les objectifs communs, et compétences adaptées à l\'ère de l\'IA (modèle 6C).'],
['FC-4D-05','Dimension 1 : Silos','Quel risque majeur la dimension « Organisations et personnes » cherche-t-elle à éliminer ?','Les silos organisationnels : équipe réseau d\'un côté, développeurs de l\'autre, chacun optimisant sa partie sans vision de bout en bout. ITIL 5 privilégie des Product Teams unifiées possédant toutes les compétences pour gérer un produit de la découverte au support, avec des lignes de communication qui évitent les goulots d\'étranglement décisionnels.'],
['FC-4D-06','Dimension 1 : Culture & Compétences','Pourquoi les compétences techniques seules ne suffisent-elles pas dans la dimension « Organisations et personnes » ?','Parce que la technologie la plus avancée ne sert à rien si la culture humaine ne suit pas : il faut un climat de confiance, de transparence et de droit à l\'erreur, l\'alignement de chacun sur la valeur client, et des compétences relationnelles et de jugement (modèle 6C : clarification des besoins, cognition critique face aux algorithmes, communication empathique, coordination d\'équipes hybrides humains/IA).'],
['FC-4D-07','Dimension 2 : Information & technologie','Que couvre précisément la dimension « Information et technologie » dans ITIL® 5 ?','Deux volets plus un focus. Information : qualité et pertinence des données, conformité et sécurité (RGPD, chiffrement), gestion des connaissances. Technologie : architectures modernes (cloud, microservices, IoT, API), outils de gestion et de surveillance (ticketing, workflows automatisés, observabilité). Focus V5 : gouvernance de l\'IA, des AIOps et de l\'automatisation (éthique, responsabilité humaine, dérive des modèles).'],
['FC-4D-08','Dimension 2 : Critères technologiques','Quels facteurs guident le choix d\'une technologie dans la dimension « Information et technologie » ?','Sa compatibilité avec l\'architecture et la culture existantes (commencer là où l\'on est), sa capacité à créer de la valeur et à améliorer l\'expérience, sa sécurité et sa conformité réglementaire, sa maintenabilité et son observabilité, le risque de dépendance au fournisseur, son coût et son impact sur la durabilité, et, pour l\'IA, l\'existence d\'une gouvernance adaptée (modèle 6C).'],
['FC-4D-09','Dimension 2 : Gestion des informations','Quelles questions clés régissent la gestion de l\'information dans cette dimension ?','Quelles informations sont nécessaires pour créer de la valeur ? Sont-elles fiables, nettoyées et structurées (éviter le « garbage in, garbage out ») ? Comment sont-elles protégées (confidentialité, intégrité, disponibilité) et conformes (RGPD) ? Qui y a accès et à quelles conditions ? Comment le savoir est-il documenté et partagé (gestion des connaissances) ? Peut-on auditer les données qui alimentent les algorithmes ?'],
