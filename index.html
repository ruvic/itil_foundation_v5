<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9d1d2a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a222e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ITIL 5">
<meta name="description" content="Révision et préparation à l'examen ITIL 5 Foundation : cours, quiz, flashcards, examens blancs.">
<title>Révision ITIL 5 Foundation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout : barre latérale de navigation à gauche (modules › chapitres), contenu à droite ; une colonne sur mobile.
   Palette : encre bleu-nuit, fond gris-bleu froid, accent grenat (couleur du support de formation), vert/ambre/rouge sémantiques. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#e9edf2; --line:#d5dbe3;
  --fg:#1b2537; --muted:#5b6778; --accent:#9d1d2a; --accent-fg:#ffffff; --accent-soft:#f6e6e8;
  --ok:#1f7a4d; --ok-soft:#dff3e8; --warn:#9a6b00; --warn-soft:#fbf0cf; --bad:#b3261e; --bad-soft:#fbe3e1;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-head:"Sora","IBM Plex Sans",system-ui,sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(27,37,55,.06),0 4px 14px rgba(27,37,55,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121821; --surface:#1a222e; --surface2:#232d3b; --line:#33404f;
  --fg:#e7ecf3; --muted:#9aa7b8; --accent:#e06470; --accent-fg:#1a0d0f; --accent-soft:#3a1f24;
  --ok:#5fcf8f; --ok-soft:#173224; --warn:#e6b84a; --warn-soft:#3a2f12; --bad:#ff7b72; --bad-soft:#3e1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121821; --surface:#1a222e; --surface2:#232d3b; --line:#33404f;
  --fg:#e7ecf3; --muted:#9aa7b8; --accent:#e06470; --accent-fg:#1a0d0f; --accent-soft:#3a1f24;
  --ok:#5fcf8f; --ok-soft:#173224; --warn:#e6b84a; --warn-soft:#3a2f12; --bad:#ff7b72; --bad-soft:#3e1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15.5px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.2;text-wrap:balance;margin:0 0 .5em}
h1{font-size:1.6rem}h2{font-size:1.3rem}h3{font-size:1.1rem}h4{font-size:1rem;margin-top:1.2em}
p{margin:.5em 0 .9em}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--font-head);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;min-width:0}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:.8rem;font-weight:800;flex:none}
.brand small{display:block;font-weight:400;font-size:.72rem;color:var(--muted);font-family:var(--font-body)}
.top nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.top nav::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px;font-weight:600;font-size:.88rem;white-space:nowrap}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.tab:hover{color:var(--fg)}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.menu-btn{display:none}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 30px;overflow-y:auto;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));height:calc(100vh - 52px - env(safe-area-inset-top,0px));align-self:start}
.side .mod{margin-bottom:14px}
.side .mod > .mt{font-family:var(--font-head);font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.side .ch{border:0;background:transparent;color:var(--fg);width:100%;text-align:left;padding:7px 8px;border-radius:7px;font-size:.88rem;display:flex;gap:8px;align-items:center}
.side .ch:hover{background:var(--surface2)}
.side .ch.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .ch .pct{margin-left:auto;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.side .ch .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.side .ch .dot.part{background:var(--warn)}.side .ch .dot.done{background:var(--ok)}
.main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:900px;margin:0 auto}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:calc(52px + env(safe-area-inset-top,0px)) auto 0 0;width:min(300px,85vw);transform:translateX(-105%);transition:transform .2s;z-index:8;box-shadow:var(--shadow);height:auto}
  .side.open{transform:none}
  .menu-btn{display:grid}
  .top nav{display:none}
  .bottom{display:flex}
}
.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;gap:2px;z-index:9}
.bottom::-webkit-scrollbar{display:none}
.bottom .tab{flex:1;min-width:0}
.bottom .tab{font-size:.72rem;padding:5px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom .tab svg{width:20px;height:20px}
@media (max-width:860px){
  .main{padding-bottom:96px;padding-block-start:14px}
  h1{font-size:1.35rem}h2{font-size:1.15rem}
  body{font-size:15px}
  .card{padding:13px 14px}
  .stat b{font-size:1.4rem}
  .brand{font-size:.95rem}.brand small{font-size:.68rem}
  .top{padding-block:6px}
  .list .item{padding:9px 10px;gap:8px}
  .num{width:28px}
  .lesson table{font-size:.84rem}.lesson th,.lesson td{padding:5px 6px}
  .sec-nav .btn{flex:1;justify-content:center;text-align:center;font-size:.82rem}
  .choice{padding:9px 10px}
  .qnav button{width:28px;height:26px;font-size:.7rem}
  .score-big{font-size:2.4rem}
  .retenir{padding:10px 12px}
  .row > .btn{flex-grow:0}
  .top .brand{margin-right:auto}
  .install-btn{display:inline-flex}
}
.bottom .tab.on{color:var(--accent)}
.bottom .tab{color:var(--muted);background:transparent}
.install-btn{display:none}

.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-head);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar i.ok{background:var(--ok)}.bar i.warn{background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:8px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 10px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.list .item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;color:var(--fg);width:100%}
.list .item:hover{background:var(--surface2)}
.list .item .t{flex:1;min-width:0}
.list .item .t small{display:block;color:var(--muted);font-size:.78rem}
.num{font-family:var(--font-head);font-weight:700;color:var(--muted);font-size:.8rem;width:34px;flex:none;font-variant-numeric:tabular-nums}

/* Cours */
.lesson table{border-collapse:collapse;width:100%;font-size:.9rem;margin:.6em 0 1em}
.lesson .tblwrap{overflow-x:auto}
.lesson th,.lesson td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
.lesson th{background:var(--surface2);font-weight:600}
.lesson dl{margin:.4em 0 1em}.lesson dt{font-weight:700;margin-top:.7em}.lesson dd{margin:.2em 0 0 0}
.lesson ul,.lesson ol{padding-left:1.3em;margin:.4em 0 .9em}.lesson li{margin:.25em 0}
.lesson .box{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface2)}
.lesson .box h4{margin-top:.2em}
.lesson .box.ok{border-color:var(--ok);background:var(--ok-soft)}.lesson .box.ko{border-color:var(--bad);background:var(--bad-soft)}
.lesson .cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:.6em 0 1em}
.lesson .rule{border-left:4px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:0 8px 8px 0}
.lesson .formula{font-family:var(--font-head);font-weight:700;text-align:center;font-size:1.1rem;padding:8px;background:var(--surface2);border-radius:8px}
.lesson .steps li{margin:.4em 0}
.lesson .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:.6em 0 1em}
.lesson .grid4 > div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface2);text-align:center}
.lesson .flow3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:.6em 0 1em;text-align:center}
.lesson .flow3 > div{border:1px solid var(--line);border-radius:8px;padding:10px;font-weight:600;background:var(--surface2)}
.lesson .flow3 small{font-weight:400;color:var(--muted)}
.lesson .svs{display:flex;flex-direction:column;gap:8px;align-items:center;margin:.6em 0 1em}
.lesson .svs-in,.lesson .svs-out{border:2px solid var(--accent);color:var(--accent);border-radius:99px;padding:6px 18px;font-weight:700}
.lesson .svs-core{width:100%;max-width:520px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface2);display:flex;flex-direction:column;gap:6px}
.lesson .ring{text-align:center;padding:7px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:.9rem}
.lesson .ring.core{background:var(--accent);color:var(--accent-fg);font-weight:700;border-color:var(--accent)}
.lesson .chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:.6em 0 .3em}
.lesson .chain span{padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:.85rem;font-weight:600}
.lesson .chain .arr{border:0;background:none;color:var(--muted);padding:0}
.lesson .loop{color:var(--accent);font-weight:600;font-size:.9rem}
.retenir{margin-top:22px;border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--radius);padding:12px 16px}
.retenir h4{margin:0 0 6px;color:var(--ok)}
.retenir ul{margin:0;padding-left:1.2em}
.sec-nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.mastery{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.mastery .btn.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.mastery .btn.on.rev{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.btn.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}.btn.on.rev{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}.btn.on.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}

/* Quiz */
.q{margin-bottom:14px}
.q .qt{font-weight:600;margin-bottom:10px}
.choices{display:flex;flex-direction:column;gap:7px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 12px;border-radius:8px;display:flex;gap:10px;align-items:flex-start}
.choice:hover{background:var(--surface2)}
.choice .k{font-weight:700;color:var(--muted);flex:none;width:18px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.explain{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface2);font-size:.92rem}
.explain.ok{background:var(--ok-soft)}.explain.ko{background:var(--bad-soft)}
.explain a{font-weight:600}
.progress-line{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px;font-variant-numeric:tabular-nums}
.timer{font-family:var(--font-head);font-weight:700;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.qnav button{width:32px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:.78rem;font-variant-numeric:tabular-nums}
.qnav button.ans{background:var(--surface2)}.qnav button.cur{border-color:var(--accent);color:var(--accent);font-weight:700}.qnav button.flag{border-color:var(--warn);background:var(--warn-soft)}
.qnav button.good{background:var(--ok-soft);border-color:var(--ok)}.qnav button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.score-big{font-family:var(--font-head);font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}
.result-grid .card{padding:10px 12px}

/* Flashcards */
.fc{perspective:1000px;min-height:220px}
.fc .inner{position:relative;width:100%;min-height:220px;transition:transform .4s;transform-style:preserve-3d}
.fc.flip .inner{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.fc .face.back{transform:rotateY(180deg);background:var(--surface2)}
.fc .face .txt{font-size:1.05rem}
.fc .face.front .txt{font-family:var(--font-head);font-weight:700;font-size:1.25rem}
@media (prefers-reduced-motion:reduce){.fc .inner{transition:none}}

/* Matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:6px}
.mt-item{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 10px;border-radius:8px;text-align:left;font-size:.88rem;min-height:44px}
.mt-item.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt-item.done{border-color:var(--ok);background:var(--ok-soft);opacity:.85}
.mt-item.err{border-color:var(--bad);background:var(--bad-soft)}

/* Glossaire */
.glist dt{font-weight:700;margin-top:12px}.glist dt small{font-weight:400;color:var(--muted)}
.glist dd{margin:2px 0 0}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
.alpha{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.alpha button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;width:30px;height:28px;font-size:.78rem}
.alpha button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* Synthèses */
.cheat{columns:2;column-gap:20px}
@media (max-width:700px){.cheat{columns:1}}
.cheat .card{break-inside:avoid;margin-bottom:14px}
.cheat ul{padding-left:1.1em;margin:.3em 0}.cheat li{margin:.15em 0;font-size:.9rem}

/* Chart */
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;box-shadow:var(--shadow)}
input[type=date],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
textarea{width:100%;min-height:90px;font:inherit;font-size:.8rem;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.weak li{margin:.3em 0}
.kbd{font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}

.more{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:9;display:flex;flex-direction:column}
.more .tab{text-align:left;padding:11px 12px;font-size:.95rem;border-radius:8px}
.more .tab.on{background:var(--accent-soft);color:var(--accent)}
@media (min-width:861px){.more{display:none!important}.bottom{display:none!important}}
.bottom .tab.more-on{color:var(--accent)}

</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<header class="top">
  <button class="icon-btn menu-btn" aria-label="Ouvrir le sommaire">☰</button>
  <a class="brand" href="#home" style="text-decoration:none;color:inherit"><span class="mark">5</span><span>ITIL 5 Foundation<small>Préparation à l'examen</small></span></a>
  <nav aria-label="Navigation principale">
    <button class="tab" data-view="home">Accueil</button>
    <button class="tab" data-view="cours">Cours</button>
    <button class="tab" data-view="entrainement">Entraînement</button>
    <button class="tab" data-view="examen">Examen blanc</button>
    <button class="tab" data-view="formateur">Flashcards formateur</button>
    <button class="tab" data-view="glossaire">Glossaire</button>

<script>
/* ===== MODULE A : LES PRATIQUES ITIL 5 ===== */
const MODULE_A = {
  id: 'A', code: 'Module A', title: 'Les Pratiques ITIL 5',
  intro: 'Six pratiques de gestion des services étudiées en détail : objectifs, terminologie, acteurs et points de vigilance. Ce module se révise en premier, avant la démarche ITIL 5 Foundation.',
  chapters: [
  /* ---------- A1 CHANGEMENTS ---------- */
  { id: 'A1', title: 'La pratique gestion des changements', en: 'Change Enablement',
    sections: [
    { id: 'A1-1', title: 'Objectifs et tâches', html: `
<p>La <b>mission</b> de la pratique gestion des changements est de <b>maximiser les succès de la mise en œuvre des changements</b> sur les produits et les services. Elle garantit que tous les changements sont <b>enregistrés, évalués, autorisés, priorisés</b> et que leur réalisation, leur intégration et leur déploiement suivent une procédure définie.</p>
<h4>Les tâches de la pratique</h4>
<ul>
<li>S'assurer que les procédures et méthodes utilisées pour traiter les changements sont efficaces, voire efficientes.</li>
<li>S'assurer que les modifications apportées aux éléments de configuration (CI) lors d'un changement sont bien enregistrées dans la base de données appropriée.</li>
<li>Répondre aux évolutions exprimées par les besoins des clients en minimisant les risques d'interruption de services et en maximisant la valeur fournie.</li>
<li>Tenir un <b>planning complet</b> de tous les changements en cours ou futurs.</li>
</ul>`,
      retenir: ['Mission : maximiser le succès des changements, pas les bloquer.', 'Tout changement est enregistré, évalué, autorisé, priorisé.', 'La pratique tient le planning des changements.'] },
    { id: 'A1-2', title: 'Périmètre de la pratique', html: `
<p>Le périmètre doit être <b>défini explicitement</b> (en mentionnant aussi ce qui n'en fait pas partie). Il est propre à chaque organisation.</p>
<div class="cols2">
<div class="box ok"><h4>Il couvre</h4><ul><li>Toute modification, ajout ou retrait d'un <b>élément de configuration</b> tout au long de son cycle de vie, qu'il soit en interne ou chez un fournisseur externe.</li></ul></div>
<div class="box ko"><h4>Il ne couvre pas</h4><ul><li>Les changements d'activités ou d'organisation métier.</li><li>Les changements au niveau opérationnel liés à du consommable (ex. : changement de cartouche d'encre).</li></ul></div>
</div>`,
      retenir: ['Le périmètre est propre à chaque organisation et doit être explicite.', 'Exclus : changements métier et consommables.'] },
    { id: 'A1-3', title: 'Terminologie : changement, RFC et types de changements', html: `
<dl>
<dt>Changement</dt><dd>Au sens ITIL, une modification d'un ou plusieurs <b>éléments de configuration (CI, Configuration Item)</b> composant le système d'information ou d'un ou plusieurs services fournis par ce SI. Modification = ajout, modification d'attributs ou retrait de CI. Un changement a un impact direct ou indirect sur un ou plusieurs services.</dd>
<dt>Demande de changement (RFC, Request For Change)</dt><dd>Formalisation d'une modification d'un ou plusieurs CI. <b>Tout changement doit être formalisé par une RFC.</b></dd>
</dl>
<h4>Les trois types de changement</h4>
<table><thead><tr><th>Type</th><th>Caractéristiques</th></tr></thead><tbody>
<tr><td><b>Normal</b></td><td>Nécessite une <b>évaluation complète et une autorisation</b> avant réalisation. Ni standard ni urgent. Évaluation et suivi plus ou moins importants selon les risques, la complexité et l'effort.</td></tr>
<tr><td><b>Standard</b></td><td><b>Pré-autorisé</b>, suit des procédures prédéfinies. Actions connues, documentées, déjà réalisées et testées. Risques faibles et maîtrisés, ressources et coûts connus. Seule une validation budgétaire est nécessaire. Souvent associé aux <i>modèles de changements</i>.</td></tr>
<tr><td><b>Urgent</b></td><td>Demande une réaction plus rapide que prévu pour limiter les impacts sur le métier. <b>L'urgence n'est pas la normalité, c'est l'exception.</b> Demandée par l'émetteur de la RFC mais validée/autorisée par une instance appropriée. Court-circuite certaines procédures (documentation après mise en service, tests minimisés) mais <b>doit toujours prévoir et tester le retour arrière</b>.</td></tr>
</tbody></table>`,
      retenir: ['Changement = modification de CI ; RFC = sa formalisation (obligatoire).', 'Standard = pré-autorisé, faible risque ; Normal = évaluation complète ; Urgent = exception, retour arrière obligatoire.'] },
    { id: 'A1-4', title: 'Acteurs et instances', html: `
<h4>a. Le gestionnaire des changements</h4>
<p>Acteur principal de la pratique. Il écrit les procédures qui supportent le contrôle des changements selon leur type et intervient au quotidien. Dans les grandes structures, il y a souvent <b>plusieurs gestionnaires</b> (par métier, par famille de services). Il assure le rôle de <b>secrétaire du CAB</b> : il le prépare, identifie et convoque les participants, anime la réunion, enregistre les décisions et diffuse le compte rendu.</p>
<p>Ce rôle exige une <b>légitimité</b> dans l'entreprise : savoir poser les bonnes questions, pouvoir dire NON. Il est responsable de la décision d'accepter ou de refuser le changement. Il détient les plannings des changements et est garant de leur mise à jour.</p>
<h4>b. Le CAB (Change Advisory Board)</h4>
<p>Instance qui <b>donne un avis</b> au gestionnaire des changements dans l'évaluation et la planification. Il se réunit régulièrement (souvent hebdomadaire ou bimensuel) pour traiter les changements <b>normaux significatifs et majeurs</b>. Les informations sont distribuées <b>avant</b> la réunion : le CAB n'est pas une réunion de prise de connaissance, mais d'expression d'avis.</p>
<div class="cols2">
<div class="box"><h4>Membres permanents</h4><ul><li>Le gestionnaire des changements (secrétaire)</li><li>Un représentant de la pratique gestion des mises en production</li><li>Le propriétaire du service concerné</li></ul></div>
<div class="box"><h4>Membres occasionnels (selon la nature du changement)</h4><ul><li>Experts techniques</li><li>Représentant du centre de services</li><li>Gestionnaire des problèmes</li><li>Gestionnaire capacité et/ou sécurité</li><li>Fournisseurs internes (Études, Développement)</li><li>Sous-traitants</li><li>Le client lui-même</li></ul></div>
</div>
<h4>c. L'ECAB (Emergency CAB)</h4>
<p>Instance qui <b>autorise le traitement d'un changement en mode urgent</b> : qualifie les changements urgents (fort impact métier, risques) pour autoriser exceptionnellement une mise en œuvre plus rapide. Convoqué à la demande, membres variables. Souvent synonyme d'<b>astreinte managériale</b> ; dans beaucoup d'entreprises, réduit au seul manager d'astreinte.</p>
<h4>d. Les autres instances</h4>
<p>Pour un changement <b>majeur</b> (fort impact sur le SI ou le fonctionnement de l'entreprise), le CAB n'est pas adapté : l'évaluation et l'autorisation remontent à des instances Direction (comité de Direction informatique, comité stratégique, comité exécutif).</p>
<h4>e. L'escalade des instances</h4>
<p>Escalade recommandée en fonction du <b>risque et des coûts</b> : gestionnaire des changements (changements simples : standards et normaux mineurs) → CAB (décision collégiale) → comités de direction (changements significatifs ou majeurs).</p>`,
      retenir: ['Le gestionnaire des changements décide et est secrétaire du CAB.', 'CAB = avis sur les changements normaux significatifs/majeurs ; ECAB = autorise les urgents.', 'Escalade : gestionnaire → CAB → comités de direction, selon risque et coût.'] },
    { id: 'A1-5', title: 'Points de vigilance', html: `
<p>Les points de vigilance sont les difficultés rencontrées lors de l'implémentation de la pratique.</p>
<h4>La résistance au changement</h4>
<p>Cette pratique a une mission qui généralement n'existe pas au sein de l'entité informatique : il faut convaincre les collaborateurs de sa nécessité et des bénéfices sur la qualité du service rendu. C'est <b>l'accompagnement au changement</b>.</p>
<p>Il est difficile que des groupes très différents aient le même niveau de compréhension. L'organisation doit définir sa <b>politique de risque</b> : être premier sur le marché (décisions rapides, tests moins rigoureux) ou privilégier la stabilité des services opérationnels ? La pratique doit <b>favoriser le changement, pas le geler</b> : le tout doit rester maîtrisé. Il faut <b>mesurer</b> de façon adéquate et continue, et s'appuyer sur ces mesures pour améliorer le processus.</p>`,
      retenir: ['La pratique favorise le changement sous contrôle ; elle ne le gèle pas.', 'Accompagnement au changement et mesure continue sont indispensables.'] }
    ] },
  /* ---------- A2 INCIDENTS ---------- */
  { id: 'A2', title: 'La pratique gestion des incidents', en: 'Incident Management',
    sections: [
    { id: 'A2-1', title: 'Les deux objectifs', html: `
<p>La pratique a <b>deux objectifs distincts</b> qu'il ne faut surtout pas confondre, car la finalité n'est pas la même :</p>
<div class="cols2">
<div class="box"><h4>a. Rétablir le service</h4><p>Ne veut pas dire trouver <i>la</i> solution, mais remettre en marche le service dans un état dit normal (ou standard). Trouver une solution, voire un <b>palliatif</b>. Rétablir dans les délais contractuels est un <b>engagement de résultat</b> auprès du client.</p></div>
<div class="box"><h4>b. Minimiser l'impact</h4><p>Minimiser les conséquences de l'incident pour les utilisateurs. C'est un <b>engagement de moyens</b> : le département informatique fera au mieux suivant ses ressources (<i>best effort</i>).</p></div>
</div>`,
      retenir: ['Rétablir le service = engagement de résultat.', 'Minimiser l\'impact = engagement de moyens (best effort).'] },
    { id: 'A2-2', title: 'Terminologie : incident, priorité, incident majeur, ticket', html: `
<dl>
<dt>Événement</dt><dd>Fait détectable qui arrive sur l'infrastructure du SI.</dd>
<dt>Incident</dt><dd>Événement qui <b>altère ou dégrade un service rendu</b> à un utilisateur. Tous les incidents ont pour origine un événement, mais tous les événements ne créent pas un incident. Un incident ne peut survenir que lorsque le service est <b>opérationnel en production</b> (sinon c'est une anomalie). Détecté par un utilisateur (centre de services) ou par les outils de supervision.</dd>
</dl>
<h4>b. Impact, urgence, priorité</h4>
<p>Codifier un incident, c'est déterminer sa <b>priorité</b>, conjonction de deux notions :</p>
<ul>
<li><b>Impact</b> : effet de l'incident sur l'utilisation du service (perte d'exploitation, nombre d'utilisateurs bloqués, non-respect de dispositions légales…). Échelle 1 à 3 ou 1 à 5 (1 Élevé, 3 ou 5 Faible).</li>
<li><b>Urgence</b> : temps dont dispose l'informatique pour rétablir le service avant que les effets ne se fassent sentir. Ex. : serveur de paie en panne le 3 du mois = urgence moindre que le 25 du mois. Même échelle.</li>
</ul>
<p class="formula">Priorité = Impact × Urgence</p>
<p>La priorité identifie l'importance relative des incidents et permet d'affecter les ressources.</p>
<h4>c. Incident majeur</h4>
<p>Fort impact sur les branches métier ou l'entreprise. <b>Hors grille de codification</b>, priorité plus élevée que P1. Traité par une procédure de <b>« crise »</b> avec cellule de crise. Communication externe spécifique.</p>
<h4>d. Ticket d'incident</h4>
<p>Tout incident doit être enregistré dans une base de données via un ticket (heure, date, contexte, effet, escalades, résolution, clôture…). Un outil est fortement recommandé.</p>`,
      retenir: ['Priorité = Impact + Urgence (conjonction).', 'Incident majeur : hors grille, au-dessus de P1, procédure de crise.', 'Tout événement n\'est pas un incident ; tout incident vient d\'un événement.'] },
    { id: 'A2-3', title: 'Les quatre états d\'un service', html: `
<table><thead><tr><th>État</th><th>Définition</th><th>Exemple (ferme de 5 serveurs)</th></tr></thead><tbody>
<tr><td><b>Nominal</b></td><td>Fonctionne comme conçu / architecturé (<i>designed</i>).</td><td>Les 5 serveurs sont opérationnels.</td></tr>
<tr><td><b>Normal</b> (ou standard)</td><td>Conforme à l'accord de niveau de service (SLA).</td><td>1 serveur en panne, performances non dégradées, utilisateurs ne s'en aperçoivent pas.</td></tr>
<tr><td><b>Dégradé</b></td><td>Qualité en dessous du SLA.</td><td>3 serveurs en panne, application plus lente ; les utilisateurs s'en aperçoivent.</td></tr>
<tr><td><b>Arrêté</b></td><td>Le service ne fonctionne pas.</td><td>—</td></tr>
</tbody></table>
<p>Autre définition de l'incident : <b>un incident survient lorsqu'un service passe de l'état nominal ou normal à l'état dégradé ou arrêté.</b></p>`,
      retenir: ['4 états : Nominal, Normal, Dégradé, Arrêté.', 'Incident = passage de nominal/normal vers dégradé/arrêté.'] },
    { id: 'A2-4', title: 'Gestion des escalades', html: `
<p>Les incidents sont diagnostiqués et résolus par différentes organisations selon leur complexité : les utilisateurs eux-mêmes → le <b>centre de services (Service Desk)</b>, niveau 1 → les groupes support de niveau 2 et 3.</p>
<p>Deux types d'escalade, <b>indépendants</b> et gérés séparément :</p>
<div class="cols2">
<div class="box"><h4>Escalade fonctionnelle</h4><p>Une équipe est dans l'incapacité de réaliser le traitement (diagnostic ou rétablissement) : elle <b>transfère</b> l'incident à une équipe de niveau d'expertise plus élevé, ou de même niveau mais d'un autre domaine.</p></div>
<div class="box"><h4>Escalade hiérarchique</h4><p>Permet d'<b>alerter la hiérarchie</b> (le management) sur une situation particulière : incident majeur potentiel, fort impact métier, blocage dû à un manque de ressources.</p></div>
</div>`,
      retenir: ['Fonctionnelle = transfert à une autre équipe (expertise).', 'Hiérarchique = alerter le management.'] }
    ] },
  /* ---------- A3 PROBLEMES ---------- */
  { id: 'A3', title: 'La pratique gestion des problèmes', en: 'Problem Management',
    sections: [
    { id: 'A3-1', title: 'Les quatre objectifs', html: `
<ol>
<li><b>Faire diminuer le nombre d'incidents</b> : objectif principal, auquel Direction, clients et utilisateurs sont sensibles. L'indicateur de réduction du nombre d'incidents est l'indicateur d'<b>efficacité</b> de la pratique.</li>
<li><b>Prévenir l'apparition de nouveaux incidents et problèmes</b> : corollaire, orienté anticipation et proactivité (<b>efficience</b>).</li>
<li><b>Minimiser l'impact des incidents</b> : la base des erreurs connues informe le centre de services et les acteurs de la gestion des incidents pour restaurer plus rapidement.</li>
<li><b>Optimiser l'efficacité des équipes support</b> : le plus difficile, car il regarde les dysfonctionnements globaux des équipes support et du centre de services.</li>
</ol>`,
      retenir: ['Objectif n°1 : réduire le nombre d\'incidents (indicateur d\'efficacité).', 'La prévention est l\'axe proactif de la pratique.'] },
    { id: 'A3-2', title: 'Terminologie : problème, erreur connue, solution temporaire', html: `
<dl>
<dt>Problème</dt><dd>Situation où l'on recherche la <b>cause inconnue</b> d'un ou plusieurs incidents. La gestion des incidents traite en temps réel (<i>front line</i>) ; la gestion des problèmes traite plus tard les causes (<i>back office</i>). <b>Il n'y a pas de problème sans au préalable au minimum un incident</b>, mais tous les incidents ne génèrent pas un problème. On ouvre un problème en cas d'<b>incidents récurrents</b> (la récurrence commence à deux !) ou dans un contexte d'<b>incident majeur</b> (même si la récurrence est à un).</dd>
<dt>Erreur connue</dt><dd>Problème dont on <b>connaît la cause</b> et dont on a identifié une solution temporaire ou définitive, <b>pas encore mise en œuvre</b>. On ne ferme pas le problème au passage en erreur connue : on attend la solution définitive. La <b>base des erreurs connues</b>, sous la responsabilité des groupes de support, est mise à disposition du centre de services.</dd>
<dt>Solution temporaire</dt><dd>Solution qui réduit ou élimine l'impact d'un incident ou d'un problème lorsqu'une solution définitive n'est pas disponible.</dd>
</dl>`,
      retenir: ['Problème = cause inconnue ; Erreur connue = cause connue + solution identifiée non mise en œuvre.', 'Pas de problème sans incident ; récurrence dès 2 ; incident majeur ⇒ problème systématique.', 'Le problème se ferme à la solution définitive, pas au passage en erreur connue.'] }
    ] },
  /* ---------- A4 DEMANDES DE SERVICES ---------- */
  { id: 'A4', title: 'La pratique gestion des demandes de services', en: 'Service Request Management',
    sections: [
    { id: 'A4-1', title: 'Objectifs', html: `
<p>Mission : répondre à toutes les sollicitations des utilisateurs, <b>définies au préalable</b>, de la manière la plus simple possible. Quatre objectifs très visibles, orientés relation utilisateurs :</p>
<ul>
<li>Fournir un <b>canal privilégié</b> aux utilisateurs pour émettre et traiter leurs commandes vers l'informatique.</li>
<li>Fournir de l'<b>assistance</b> sur l'utilisation des services.</li>
<li>Effectuer les <b>approvisionnements</b> des composants standards des services.</li>
<li>Fournir un canal pour faire remonter les <b>plaintes</b> des utilisateurs vers la Direction informatique.</li>
</ul>`,
      retenir: ['4 objectifs : canal de commandes, assistance, approvisionnements, plaintes.'] },
    { id: 'A4-2', title: 'Terminologie et automatisation', html: `
<dl>
<dt>Demande de service</dt><dd>Sollicitation d'un utilisateur dans un <b>cadre prédéfini</b> (catalogue des demandes). Englobe toute sollicitation <b>qui n'est pas un incident</b>. Action limitée dans le temps, à faible risque, généralement traitée par une seule personne, à faible coût. Prend son sens s'il y a une vraie fréquence. Souvent appelée « demande de petits travaux ».</dd>
<dt>Catalogue des demandes de services</dt><dd>Base du bon fonctionnement de la pratique. Détaille les demandes avec leur <b>coût</b> (ou unité d'œuvre) et leur <b>délai</b> de réalisation, et identifie les <b>profils autorisés</b> à demander. Sa diffusion et sa promotion sont un enjeu majeur.</dd>
</dl>
<h4>Automatisation</h4>
<p>ITIL 5 recommande une implémentation <b>la plus automatisée possible</b> pour être efficiente : cela diminue la charge du centre de services. Exemple : un <b>portail</b> avec le catalogue des demandes en ligne.</p>`,
      retenir: ['Demande de service = sollicitation prédéfinie qui n\'est pas un incident.', 'Le catalogue indique coût, délai et profils autorisés.', 'Automatiser au maximum (portail en ligne).'] }
    ] },
  /* ---------- A5 CENTRE DE SERVICES ---------- */
  { id: 'A5', title: 'La pratique centre de services', en: 'Service Desk',
    sections: [
    { id: 'A5-1', title: 'Objectifs et enjeux', html: `
<p>Le centre de services est le <b>point de contact unique</b> entre les utilisateurs et le département informatique. Relation <b>bidirectionnelle</b> : les utilisateurs appellent, et l'informatique passe par lui pour informer les utilisateurs. « Unique » du point de vue des utilisateurs : un utilisateur n'a qu'un seul centre de services en face de lui (il peut en exister plusieurs).</p>
<p>Mission : <b>servir les utilisateurs et les satisfaire</b> (satisfaction utilisateur ≠ satisfaction client). Il est la <b>vitrine</b> du département informatique, la partie visible de l'iceberg.</p>
<h4>Deux objectifs principaux</h4>
<ul><li>Répondre aux questions et demandes dans les délais définis et contractuels.</li><li>Restaurer le service dans un état normal le plus rapidement possible dans les délais contractuels.</li></ul>
<p>Il assure le <b>niveau 1 de support</b> (investigation, diagnostic initial) et gère les escalades vers les niveaux 2 et 3. Il est le point de coordination des groupes support.</p>
<h4>Enjeux</h4>
<p>Des utilisateurs bloqués, non informés, qui ne savent pas quand le service sera rétabli → mécontentement et production qui s'arrête. Des réponses rapides et compréhensibles apportent un gain de productivité. Le centre de services <b>centralise</b> les informations sur les appels : il amène la <b>vision des utilisateurs</b> et a un rôle proactif pour remonter ces informations vers les études et développements.</p>`,
      retenir: ['Point de contact unique (du point de vue de l\'utilisateur), bidirectionnel.', 'Vitrine de l\'informatique, niveau 1 de support, coordination des escalades.'] },
    { id: 'A5-2', title: 'Les tâches de la pratique', html: `
<ol>
<li><b>Prise en compte de l'appel</b> (téléphone, e-mail, ou tickets ouverts par les utilisateurs eux-mêmes).</li>
<li><b>Enregistrement des informations</b> : identité, numéro de contrat, objet de la demande.</li>
<li><b>Catégorisation</b> : incident ou requête (demande de service).</li>
<li><b>Codification</b> : évaluer la priorité et en déduire le délai contractuel.</li>
<li><b>Investigation et diagnostic</b> : réelle valeur ajoutée, premier niveau de support.</li>
<li><b>Réponse à l'utilisateur</b> : restauration du service (incident) ou exécution de la requête.</li>
<li><b>Gestion de l'escalade</b> vers niveaux 2 et 3.</li>
<li><b>Suivi de l'appel</b> : informer l'utilisateur de l'avancement.</li>
<li><b>Clôture de tous les appels</b>, même escaladés : le centre de services doit être averti des travaux des groupes support pour clôturer administrativement.</li>
<li><b>Gestion des enquêtes de satisfaction</b> des utilisateurs.</li>

    { id: 'B1-0', title: 'Objectifs de la formation', html: `
<p>La formation <b>ITIL® 5 Foundation</b> (lancée en 2026, publiée par <b>PeopleCert</b>) initie les professionnels de l'ITSM à la gestion moderne des <b>produits et services numériques</b>, en intégrant l'<b>intelligence artificielle</b>, l'<b>automatisation</b> et les environnements <b>DevOps</b>. <b>Aucun prérequis.</b></p>
<h4>Objectifs pédagogiques</h4>
<ol>
<li><b>Maîtriser les fondamentaux de l'ITSM moderne</b> : notions clés (valeur, offres, coûts, risques), langage universel.</li>
<li><b>Intégrer l'IA et l'automatisation</b> : impact de l'IA native, gouvernance de l'IA.</li>
<li><b>Découvrir le modèle opérationnel et la co-création de valeur</b> : SVS, Quatre Dimensions, flux de valeur.</li>
<li><b>Faire le lien avec les autres frameworks agiles</b> : DevOps, PRINCE2.</li>
<li><b>Réussir la certification</b> : QCM de <b>40 questions</b>, <b>60 minutes</b>, score de <b>65 %</b> requis.</li>
</ol>
<p>Public : professionnels de l'IT, managers / DSI / chefs de projet, toute personne impliquée dans la co-création de valeur.</p>`,

    { id: 'B1-1', title: 'ITIL 4 vs ITIL 5 : les 4 apports majeurs', html: `
<p>L'évolution d'ITIL 4 vers ITIL 5 est une <b>extension modernisée</b> (pas un rejet des acquis) pour une économie « digital-first » et la révolution de l'IA.</p>
<table><thead><tr><th>Domaine</th><th>ITIL 4 (2019)</th><th>ITIL 5 (2026)</th></tr></thead><tbody>
<tr><td>Périmètre &amp; focus</td><td>Gestion des services informatiques (IT Service Management)</td><td>Gestion des <b>produits et services numériques</b> (Digital Product &amp; Service Management)</td></tr>
<tr><td>Modèle opérationnel</td><td>Chaîne de valeur des services (SVC) en <b>6 activités</b></td><td>Modèle de cycle de vie des produits et services (<b>PSLM</b>) étendu à <b>8 activités</b></td></tr>
<tr><td>Intelligence artificielle</td><td>Évoquée superficiellement</td><td>Étendue à l'<b>Expérience Numérique (DX)</b> complète via les <b>XLA</b></td></tr>
<tr><td>Approche pédagogique</td><td>Forte mémorisation des processus et des 34 pratiques</td><td>Suppression du par cœur au profit de la <b>pensée systémique, de la stratégie et de la gestion des flux</b></td></tr>
</tbody></table>
<h4>Les 4 apports majeurs</h4>

<li><b>Un modèle opérationnel plus fluide et itératif (PSLM)</b> : Découvrir → Concevoir → Acquérir → Construire → Transitionner → Exploiter → Livrer → Supporter, aligné sur DevOps (CI/CD) et le SRE.</li>

<h4>Évolution des priorités à l'examen</h4>

    { id: 'B1-2', title: 'Les enjeux des organisations accélérées par l\'IA', html: `
<p>L'examen n'attend pas des compétences de codeur en IA, mais une vision claire de <b>comment l'IA transforme la gouvernance, les flux de travail et la création de valeur</b>. Cinq enjeux :</p>

<tr><td><b>5. Bascule vers l'Expérience Numérique (DX)</b> : chatbots mal configurés.</td><td>L'IA doit personnaliser et fluidifier l'expérience ; piloter par les <b>XLA</b> (frustration ou adhésion réelle), plus seulement par les SLA.</td></tr>

<h4>Étude de cas : assistant virtuel IA dans une entreprise de services financiers</h4>
<p>Pour respecter la gouvernance ITIL 5, l'organisation structure son approche à travers les <b>4 Dimensions</b> :</p>

<li><b>Flux de valeur et processus</b> : flux hybride (l'IA fait le premier niveau en 10 s), boucle d'amélioration continue hebdomadaire, indicateurs XLA (taux de frustration).</li>
</ul>`,
