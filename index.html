['FC-4D-10','Dimension 3 : Partenaires & fournisseurs','Que couvre la dimension « Partenaires et fournisseurs » ?','Les relations avec toutes les organisations externes impliquées dans la conception, le développement, le déploiement et l\'exploitation des produits et services : fournisseurs (relation transactionnelle, risques non partagés) et partenaires (relation stratégique et collaborative, risques partagés), contrats et gouvernance associés, et en V5 les Digital Product Vendors (fournisseurs de LLM, API, briques logicielles) avec les risques de dépendance et de lock-in.'],
['FC-4D-11','Dimension 3 : Stratégie d\'externalisation','Quels facteurs influencent le choix de recourir à des partenaires ou fournisseurs externes ?','L\'expertise stratégique (faut-il garder le contrôle absolu, par exemple sur ses algorithmes d\'IA ?), la flexibilité (capacité à changer rapidement de fournisseur), le coût et la vélocité (time-to-market d\'un composant standardisé), ainsi que la culture de l\'organisation, les contraintes réglementaires et la gestion du risque de verrouillage (vendor lock-in).'],
['FC-4D-12','Dimension 3 : Intégration des tiers','Qu\'est-ce que l\'intégration et la gestion des services (SIAM) dans le cadre des partenaires et fournisseurs ?','Le SIAM (Service Integration and Management) est une approche où une fonction d\'intégrateur (interne ou externe) coordonne de bout en bout les multiples fournisseurs d\'une organisation pour qu\'ils fonctionnent comme un service unique : gouvernance commune, flux de valeur traversant les tiers, indicateurs partagés (SLA/XLA), gestion des interfaces et des responsabilités. Il évite que le client final subisse la fragmentation entre prestataires.'],
['FC-4D-13','Dimension 4 : Flux de valeur & processus','Quel est l\'objet de la dimension « Flux de valeur et processus » ?','Définir comment les différentes parties de l\'organisation coordonnent leurs activités pour transformer une idée, une opportunité ou une demande en valeur réelle : c\'est le squelette opérationnel. Elle couvre la cartographie des flux (VSM), l\'élimination du gaspillage, l\'automatisation intelligente et, en V5, la cohabitation des humains et des systèmes d\'IA dans des flux hybrides et des processus agiles.'],
['FC-4D-14','Dimension 4 : Flux de valeur vs Processus','Quelle différence oppose un « Flux de valeur » (Value Stream) à un « Processus » ?','Le processus est une suite standardisée et répétitive d\'activités qui transforme des entrées en livrables (outputs), confinée à un objectif précis (ex. : réinitialisation de mot de passe). Le flux de valeur est une combinaison sur mesure d\'activités du PSLM et de processus, connectée de bout en bout, souvent à travers plusieurs départements, pour répondre à une demande client et produire un outcome (ex. : créer et mettre en production une application mobile).'],
['FC-4D-15','Facteurs externes : PESTLE','Que signifie l\'acronyme PESTLE et quel est son lien avec les 4 dimensions ?','Politique, Économique, Social, Technologique, Légal, Environnemental. Ce sont les facteurs externes qui influencent et limitent les 4 dimensions : les dimensions ne vivent pas en vase clos et l\'organisation doit en tenir compte lorsqu\'elle configure son système de valeur.'],
['FC-4D-16','PESTLE : Politique & Légal','Quelle différence distingue un facteur Politique d\'un facteur Légal dans PESTLE ?','Le facteur Politique concerne les orientations et décisions des pouvoirs publics ou des instances dirigeantes (politiques industrielles, souveraineté numérique, tensions géopolitiques, politique interne de l\'entreprise) : il crée un contexte d\'incertitude ou d\'opportunité. Le facteur Légal concerne les obligations juridiques contraignantes en vigueur (RGPD, AI Act, droit du travail, contrats) auxquelles l\'organisation doit se conformer sous peine de sanction.'],
['FC-4D-17','PESTLE : Économique & Social','Comment les facteurs Économiques et Sociaux impactent-ils les 4 dimensions ?','Économiques (inflation, coût de l\'énergie et du cloud, budgets, taux de change) : ils contraignent les investissements technologiques, les choix make-or-buy avec les partenaires et les arbitrages entre automatisation et personnel. Sociaux (attentes des utilisateurs, télétravail, pénurie de compétences, confiance envers l\'IA) : ils influencent la culture et les compétences (Organisations et personnes), l\'expérience attendue (DX) et l\'acceptabilité des flux automatisés.'],
['FC-4D-18','PESTLE : Technologique & Environnemental','Comment le facteur Environnemental (PESTLE) s\'articule-t-il avec ITIL® 5 ?','Via le pilier Durabilité (Sustainability) de la valeur : le produit doit respecter dans la durée les exigences environnementales (empreinte carbone du cloud et des modèles d\'IA, sobriété numérique, cycle de vie du matériel), sociales et économiques. Le facteur environnemental contraint les choix technologiques et de partenaires (hébergeurs, fournisseurs d\'IA) et entre dans les critères de conception (activité Concevoir).'],
['FC-4D-19','Mise en situation 1 (Piège)','Une organisation achète une plateforme IA de pointe, mais ses équipes refusent de l\'utiliser faute de formation et de clarté sur les rôles. Quelle dimension a été négligée ?','La dimension Organisations et personnes : formation, compétences (modèle 6C), définition des rôles et conduite du changement humain ont été ignorées. La technologie seule (dimension Information et technologie) ne crée pas de valeur ; c\'est le piège classique de l\'approche non holistique.'],
['FC-4D-20','Mise en situation 2 (Piège)','Une entreprise externalise son support cloud mais ne définit aucun indicateur de performance ni mécanisme de gouvernance avec le prestataire. Quelle dimension est défaillante ?','La dimension Partenaires et fournisseurs : l\'externalisation exige des contrats avec SLA/XLA, une gouvernance de la relation, la gestion des risques fournisseur (dépendance, clauses de sortie) et une intégration dans les flux de valeur. Sans cela, l\'organisation perd la maîtrise de la valeur livrée à ses utilisateurs.']
]},
{ id: 'T3', title: 'Module 3 : Cycle de vie en 8 activités', file: 'Flashcards_Module3_Cycle_Vie_8_Activites_ITIL5_v1.xlsx', cards: [
['C01','Vue d\'ensemble','Quelles sont les 8 activités du Cycle de Vie des Produits et Services dans ITIL® 5 ?','Découvrir (Discover), Concevoir (Design), Acquérir (Acquire), Construire (Build), Transitionner (Transition), Exploiter (Operate), Livrer (Deliver), Soutenir (Support). Ensemble, elles forment le modèle PSLM qui remplace la chaîne de valeur à 6 activités d\'ITIL 4.'],
['C02','Logique du cycle','Le cycle de vie en 8 activités doit-il être exécuté de façon strictement linéaire (de 1 à 8) ?','Non. Les activités sont des blocs modulaires combinables en flux de valeur ; le modèle est circulaire et itératif. Les données de Soutenir (incidents récurrents, retours utilisateurs) sont réinjectées dans Découvrir et Concevoir pour les versions suivantes : c\'est la boucle de rétroaction, l\'élément le plus important du schéma.'],
['C03','Découvrir','Quel est le but officiel de l\'activité Découvrir (Discover) ?','Explorer, identifier et prioriser les opportunités, les besoins des clients et les demandes du marché. C\'est là que naissent la stratégie produit et la roadmap : on comprend le contexte business avant d\'engager des ressources. Nouvelle en V5, elle garantit qu\'aucun produit n\'est conçu sans validation préalable de la valeur.'],
['C04','Concevoir','Quel est le but officiel de l\'activité Concevoir (Design) ?','Créer les plans, architectures et spécifications du produit ou service, en intégrant dès le départ les critères d\'utilité, de garantie, de durabilité et d\'expérience numérique (DX), ainsi que la sécurité (security by design).'],
['C05','Acquérir','Quel est le but officiel de l\'activité Acquérir (Acquire) ?','Se procurer, louer ou allouer les ressources et composants nécessaires : achat de serveurs cloud, obtention de licences, contractualisation d\'API auprès de fournisseurs de produits tiers.'],
['C06','Construire','Quel est le but officiel de l\'activité Construire (Build) ?','Développer, assembler, configurer et tester la solution technologique. Fortement ancrée dans les pratiques modernes (DevOps, CI/CD, automatisation), elle s\'assure que le produit est prêt et validé techniquement avant d\'entrer en production.'],
['C07','Transitionner','Quel est le but officiel de l\'activité Transitionner (Transition) ?','Déployer le produit ou le service vers l\'environnement réel (live) avec un minimum de perturbations : gestion des versions, conduite du changement pour les utilisateurs, intégration opérationnelle des nouveaux fournisseurs.'],
['C08','Exploiter','Quel est le but officiel de l\'activité Exploiter (Operate) ?','Assurer la stabilité, la performance et la fiabilité au quotidien selon les cibles définies : surveillance continue des infrastructures et de la sécurité, exécution des tâches de maintenance courante, notamment via les outils d\'AIOps.'],
['C09','Livrer','Quel est le but officiel de l\'activité Livrer (Deliver) ?','Fournir les services numériques aux utilisateurs finaux et concrétiser la promesse de valeur : traitement des demandes de services, exécution des fonctionnalités de l\'offre, pilotage de la satisfaction globale via les XLA.'],
['C10','Soutenir','Quel est le but officiel de l\'activité Soutenir (Support) ?','Restaurer le fonctionnement normal des produits et services en cas d\'anomalie : gestion des incidents, résolution des problèmes complexes, écoute des retours utilisateurs. Les apprentissages du support alimentent directement une nouvelle phase de découverte.'],
['C11','Piège : Acquérir vs Construire','Quelle différence oppose Acquérir (Acquire) à Construire (Build) ?','Acquérir obtient des composants existants (acheter, louer, allouer : cloud, licences, API). Construire crée et valide la solution (coder, assembler, configurer, tester). Souscrire une API externe = Acquérir ; développer le module soi-même = Construire.'],
['C12','Piège : Transitionner vs Livrer','Quelle différence oppose Transitionner (Transition) à Livrer (Deliver) ?','Transitionner met le produit en production (déploiement technique, versions, conduite du changement) ; le produit est « live » mais pas forcément utilisé. Livrer rend le service effectivement disponible et consommé par les utilisateurs et matérialise la valeur (demandes, fonctionnalités, satisfaction XLA).'],
['C13','Piège : Exploiter vs Soutenir','Quelle différence oppose Exploiter (Operate) à Soutenir (Support) ?','Exploiter concerne la technique : faire tourner l\'infrastructure et les plateformes de façon stable et performante (surveillance, capacité, maintenance, AIOps). Soutenir concerne les personnes : aider les utilisateurs et restaurer le service quand ils rencontrent une anomalie (incidents, problèmes, feedback). Les serveurs peuvent « tourner normalement » (Exploiter OK) alors qu\'un utilisateur est bloqué (Soutenir).'],
['C14','Piège : Découvrir vs Concevoir','Quelle différence oppose Découvrir (Discover) à Concevoir (Design) ?','Découvrir répond à « faut-il faire quelque chose, et quoi ? » : explorer les besoins, valider la valeur et l\'opportunité, prioriser. Concevoir répond à « comment le faire ? » : plans, architecture, spécifications. On ne spécifie pas avant d\'avoir validé le besoin.'],
['C15','Mise en situation 1','Une équipe produit observe les usages terrain et mène des ateliers d\'idéation pour vérifier s\'il existe un besoin réel avant de rédiger des spécifications. Quelle activité est menée ?','Découvrir (Discover) : exploration des besoins et validation de l\'opportunité avant toute conception.'],
['C16','Mise en situation 2','Plutôt que de coder un module de paiement, une équipe souscrit une API externe prête à l\'emploi auprès d\'un prestataire. Quelle activité est exécutée ?','Acquérir (Acquire) : on se procure un composant existant auprès d\'un fournisseur de produit (Product Vendor) au lieu de le construire.'],
['C17','Mise en situation 3','Une nouvelle version d\'un portail client a été déployée en production, mais reste fermée en attendant l\'activation commerciale. Quelle activité est achevée et laquelle suit ?','Transitionner (Transition) est achevée : le déploiement en environnement réel est fait. L\'activité suivante est Livrer (Deliver) : l\'ouverture du service aux utilisateurs concrétisera la valeur.'],
['C18','Mise en situation 4','Un utilisateur contacte le helpdesk car il ne parvient pas à exporter son relevé PDF alors que les serveurs tournent normalement. Quelle activité intervient ?','Soutenir (Support) : restaurer le fonctionnement normal pour l\'utilisateur (gestion des incidents via le centre de services), même si l\'infrastructure est techniquement saine (Exploiter n\'est pas en cause).'],
['C19','Mise en situation 5','Une équipe SRE ajuste automatiquement la capacité des serveurs cloud la nuit pour absorber un pic de trafic sans interruption. Quelle activité est exécutée ?','Exploiter (Operate) : assurer stabilité et performance au quotidien par la surveillance et l\'automatisation (gestion des capacités, AIOps).'],
['C20','Boucle continue','Comment les retours collectés lors de l\'activité Soutenir (Support) alimentent-ils le reste du cycle de vie ?','Les incidents récurrents, retours utilisateurs et faiblesses opérationnelles observés en Soutenir sont réinjectés dans Découvrir (nouvelles priorités, roadmap) et Concevoir (corrections d\'architecture, améliorations d\'expérience) pour la version suivante du produit. Cette boucle de rétroaction alimente l\'amélioration continue et fait du PSLM un système vivant plutôt qu\'une séquence fermée.']
]},
{ id: 'T4', title: 'Module 4 : Système de Valeur ITIL (ITIL VS)', file: 'Flashcards_Module4_Systeme_Valeur_ITIL5_v1.xlsx', cards: [
['M4-01','ITIL Value System (ITIL VS)','Quel est l\'objectif central du Système de Valeur ITIL (ITIL Value System — ITIL VS) ?','Décrire comment toutes les composantes et activités d\'une organisation fonctionnent ensemble, comme un système intégré, pour transformer les opportunités et la demande en valeur co-créée. Il brise les silos et permet une agilité maximale à l\'ère de l\'IA et des produits numériques.'],
['M4-02','Entrées et Sortie de l\'ITIL VS','Quelles sont les deux entrées et l\'unique sortie du Système de Valeur ITIL (ITIL VS) ?','Entrées : l\'Opportunité (options d\'innovation ou de création de valeur, ex. : une nouvelle technologie d\'IA générative) et la Demande (besoin explicite des consommateurs). Sortie : la Valeur, co-créée avec le client lorsqu\'il utilise le produit stabilisé.'],
['M4-03','Les 5 composants de l\'ITIL VS','Citez les 5 composants centraux qui composent le Système de Valeur ITIL (ITIL VS).','1. Les Principes directeurs (7) ; 2. La Gouvernance ; 3. La Chaîne de valeur, matérialisée par le modèle PSLM en 8 activités ; 4. Les Pratiques (34) ; 5. L\'Amélioration continue.'],
['M4-04','Lutte contre les silos','Comment l\'architecture de l\'ITIL Value System lutte-t-elle contre les silos organisationnels ?','En faisant fonctionner les composants de manière interconnectée et non isolée : les pratiques et la chaîne de valeur sont transversales, les principes directeurs (collaborer et promouvoir la visibilité, penser holistiquement) s\'appliquent à tous, la gouvernance est intégrée au flux de travail, et les flux de valeur traversent les départements pour répondre à une demande client de bout en bout. Chaque organisation configure son SVS selon sa taille et sa culture.'],
['M4-05','Gouvernance (Triade EDM)','Par quelles trois activités l\'organe directeur exerce-t-il la Gouvernance dans l\'ITIL VS ?','Évaluer (Evaluate) : examiner régulièrement l\'organisation, sa stratégie, ses performances et les évolutions technologiques par rapport aux besoins des parties prenantes. Diriger (Direct) : définir la direction stratégique par des politiques, des objectifs et des contraintes. Contrôler/Surveiller (Monitor) : surveiller la performance et la conformité des pratiques aux directives pour s\'assurer que la valeur promise est co-créée.'],
['M4-06','Place des 4 Dimensions','Les 4 Dimensions font-elles partie des 5 composants internes de l\'ITIL Value System ?','Non. Les 4 Dimensions (Organisations et personnes, Information et technologie, Partenaires et fournisseurs, Flux de valeur et processus) sont un pilier distinct : des perspectives à appliquer à l\'ensemble du SVS. Les 5 composants sont : principes directeurs, gouvernance, chaîne de valeur, pratiques, amélioration continue.'],
['M4-07','Amélioration continue','Qui est responsable de l\'Amélioration continue au sein de l\'ITIL Value System ?','Tout le monde, à tous les niveaux : c\'est un état d\'esprit (culture) attendu de chaque collaborateur, un composant global du SVS porté par la gouvernance et le management, et une pratique de gestion dédiée (avec le registre CIR) qui fournit le modèle en 7 étapes. Les pratiques techniques exécutent les améliorations ; la direction en fixe la vision et les moyens.'],
['M4-08','Principes Directeurs','Qu\'est-ce qu\'un principe directeur (Guiding Principle) dans ITIL® 5 ?','Une recommandation universelle et immuable qui guide les décisions et les actions d\'une organisation en toutes circonstances, quels que soient ses objectifs, sa stratégie, son type de management ou ses technologies. Les sept principes forment un système interconnecté et s\'appliquent ensemble.'],
['M4-09','Les 7 Principes Directeurs','Citez les 7 Principes Directeurs d\'ITIL®.','1. Privilégier la valeur ; 2. Commencer là où vous êtes ; 3. Progresser par itérations avec retours ; 4. Collaborer et promouvoir la visibilité ; 5. Penser et travailler de façon holistique ; 6. Privilégier la simplicité et le pragmatisme ; 7. Optimiser et automatiser.'],
['M4-10','Optimiser et automatiser','Quelle erreur majeure le principe « Optimiser et automatiser » permet-il d\'éviter ?','Automatiser un processus inefficace ou mal conçu : on ne ferait qu\'accélérer le gaspillage et figer les défauts dans la technologie. Il faut d\'abord rendre les ressources humaines et matérielles aussi efficaces que possible (optimiser), puis confier à la technologie les tâches répétitives, en réservant l\'intervention humaine là où elle apporte une réelle valeur. L\'automatisation ne doit jamais dégrader la valeur ou l\'expérience (lien avec « Privilégier la valeur »).'],
['M4-11','Commencer là où l\'on se trouve','Que recommande le principe « Commencer là où l\'on se trouve » face à un processus existant jugé imparfait ?','Ne pas le rejeter pour tout reconstruire de zéro : analyser l\'existant objectivement (mesures, observation directe), conserver ce qui fonctionne et s\'appuyer dessus pour s\'améliorer. Concrètement, on mesure l\'efficacité des scripts, bases (CMDB via SACM/ITAM) et procédures en place avant d\'implémenter un nouvel outil.'],
['M4-12','Observabilité vs Monitoring','Quelle différence distingue l\'Observabilité (Observability) de la Surveillance traditionnelle (Monitoring) ?','Le Monitoring collecte des métriques prédéfinies et alerte sur des seuils connus : il répond aux questions anticipées. L\'Observabilité permet de déduire l\'état interne d\'un système distribué à partir de ses sorties (logs, métriques, traces corrélés) et d\'investiguer des problèmes inconnus. Elle alimente les AIOps (corrélation d\'événements, détection d\'anomalies, résolution prédictive) et le passage du réactif au prédictif.'],
['M4-13','SRE et Budget d\'erreur','Quel est le rôle d\'un budget d\'erreur (Error Budget) dans l\'approche SRE intégrée au Module 4 ?','Il quantifie la marge d\'erreur acceptable dérivée d\'un objectif de fiabilité (ex. : 99,9 % = 0,1 % de temps d\'indisponibilité toléré). Il sert d\'arbitre objectif entre vitesse d\'innovation et stabilité : tant que le budget reste disponible, les équipes déploient librement ; quand il est consommé, les déploiements ralentissent au profit de la fiabilité. Il aligne Dev et Ops sur un indicateur commun, en cohérence avec la gouvernance et les XLA.'],
['M4-14','CI/CD dans l\'ITIL VS','Comment l\'intégration et la livraison continues (CI/CD) renforcent-elles le Système de Valeur ITIL® 5 ?','Elles automatisent et fiabilisent les activités Construire et Transitionner du PSLM (tests automatiques, déploiements fréquents et réversibles), incarnent les principes « Progresser par itérations avec retours » et « Optimiser et automatiser », réduisent les risques des changements (changements standards automatisés, habilitation simplifiée) et accélèrent la boucle de rétroaction vers Découvrir. Les pratiques Déploiements et Développement logiciel infusent ces pipelines dans le SVS.'],
['M4-15','Incident vs Problème','Quelle différence oppose le but de la Gestion des incidents à celui de la Gestion des problèmes ?','Gestion des incidents : restaurer le fonctionnement normal du service le plus rapidement possible en minimisant l\'impact (temps réel, front line, au besoin par un palliatif). Gestion des problèmes : réduire la probabilité et l\'impact des incidents en identifiant leurs causes réelles et potentielles et en gérant les solutions de contournement (back office, analyse). Pas de problème sans incident préalable, mais tout incident ne génère pas un problème.'],
['M4-16','Erreur connue (Known Error)','À quel moment précis un problème devient-il une Erreur connue (Known Error) ?','Lorsque la cause racine du problème a été identifiée et qu\'une solution (temporaire ou définitive) a été trouvée, mais n\'a pas encore été mise en œuvre. L\'erreur connue est documentée dans la base des erreurs connues (KEDB) mise à disposition du centre de services. Le problème reste ouvert jusqu\'à la solution définitive.'],
['M4-17','Contournement (Workaround)','Qu\'est-ce qu\'un contournement (Workaround) ?','Une solution temporaire qui réduit ou élimine l\'impact d\'un incident ou d\'un problème lorsque la solution définitive n\'est pas encore disponible. Elle permet de rétablir le service (objectif de la gestion des incidents) sans corriger la cause ; elle est documentée dans l\'erreur connue pour être réutilisée par le centre de services.'],
['M4-18','Demandes de services','Quelle différence distingue une Demande de service d\'un Incident ?','L\'incident est une dégradation ou une interruption non planifiée d\'un service : il faut rétablir. La demande de service est une sollicitation prédéfinie de l\'utilisateur dans le cadre du catalogue (accès, installation, information), à faible risque et faible coût, qui n\'est pas une panne : il faut exécuter. La catégorisation au centre de services distingue les deux dès la prise d\'appel.'],
['M4-19','Les 3 types de changements','Distinguez les 3 types de changements de la pratique Habilitation des changements.','Standard : pré-autorisé, faible risque, actions connues, documentées et testées, procédure prédéfinie (souvent automatisée), seule une validation budgétaire éventuelle. Normal : nécessite une évaluation et une autorisation proportionnées au risque, à la complexité et à l\'effort (gestionnaire des changements, puis CAB pour les significatifs, comités de direction pour les majeurs). Urgent : exception pour limiter un impact métier, autorisée par une instance dédiée (ECAB), certaines étapes allégées mais retour arrière obligatoirement prévu et testé.'],
['M4-20','Registre CIR','À quoi sert le Registre d\'amélioration continue (Continual Improvement Register — CIR) ?','À enregistrer, prioriser et suivre toutes les idées et initiatives d\'amélioration identifiées dans l\'organisation (par la gestion des problèmes, l\'AIOps, les écarts XLA, les retours utilisateurs). Il est l\'outil opérationnel de la pratique Amélioration continue : il rend les opportunités visibles, évite de les perdre et permet d\'alimenter le modèle en 7 étapes avec des données factuelles.']
]},
{ id: 'T5', title: 'Module 5 : Value Stream Mapping & Pensée complexe', file: 'Flashcards_Module5_VSM_et_Pensee_Complexe_ITIL5_v1.xlsx', cards: [
['M5-01','Flux de valeur','Qu\'est-ce qu\'un flux de valeur (Value Stream) dans ITIL® 5 ?','Une combinaison spécifique d\'activités de la chaîne de valeur (modèle PSLM) et de processus, connectée de bout en bout, qui trace un chemin précis pour répondre à une demande client et produire un résultat (outcome). Il traverse souvent plusieurs départements (ex. : « résoudre un incident majeur », « créer et mettre en production une application mobile »).'],
['M5-02','Chaîne vs Flux','Quelle différence distingue la Chaîne de valeur des services d\'un Flux de valeur ?','La chaîne de valeur est le modèle opérationnel générique et unique de l\'organisation : les 8 activités du PSLM, disponibles comme blocs. Le flux de valeur est une instance concrète, sur mesure, qui combine certaines de ces activités et des processus pour un cas précis. Une chaîne, de nombreux flux.'],
['M5-03','Types de flux','Quelle différence oppose un Flux de valeur principal (Core) à un Flux de valeur de soutien (Enabling) ?','Core : il délivre directement de la valeur au consommateur externe (répond à une demande client). Enabling : il rend possibles les flux principaux sans livrer directement de valeur au client (recrutement, gestion des accès, achats, gestion des fournisseurs). Les deux doivent être cartographiés ; l\'optimisation d\'un flux de soutien accélère les flux principaux.'],
['M5-04','Objectif VSM','Quel est le but principal du Value Stream Mapping (VSM) dans ITIL® 5 ?','Visualiser le flux de bout en bout tel qu\'il est réellement, pour identifier et éliminer les activités sans valeur ajoutée (validations inutiles, tâches redondantes, attentes), réduire les délais (time-to-market) et repérer les étapes répétitives à automatiser intelligemment (AIOps). C\'est un outil d\'amélioration continue centré sur la valeur pour le client.'],
['M5-05','Horizons VSM','Quels sont les trois états ou horizons typiques d\'une démarche Value Stream Mapping ?','1. L\'état actuel (Current State) : cartographie honnête du flux tel qu\'il fonctionne aujourd\'hui, avec ses mesures. 2. L\'état futur (Future State) : flux cible après élimination du gaspillage et automatisation. 3. L\'état idéal (Ideal State) : vision à long terme sans contraintes actuelles, qui oriente les itérations successives. On progresse de l\'actuel vers le futur par itérations avec retours.'],
['M5-06','Lead Time','Que mesure le Lead Time (délai de bout en bout) dans un flux de valeur ?','Le temps total écoulé entre l\'entrée d\'une demande dans le flux et la livraison du résultat au client, temps d\'attente inclus. C\'est le délai perçu par le consommateur (ex. : de la demande d\'accès à l\'accès effectif).'],
['M5-07','Cycle Time','Que mesure le Process Time (ou Cycle Time actif) dans le VSM ?','Le temps de travail effectif réellement consacré à l\'élément à chaque étape, hors files d\'attente et interruptions. Sa somme sur le flux, comparée au Lead Time, révèle la part de travail utile.'],
['M5-08','Wait Time','Pourquoi la réduction du Wait Time (temps d\'attente) est-elle prioritaire en VSM ?','Parce que dans la plupart des flux, l\'attente (files, validations, transferts entre équipes, dépendances) représente la majorité du Lead Time, bien plus que le travail actif. Réduire les attentes améliore immédiatement le délai client et l\'efficience de flux, sans demander aux équipes de « travailler plus vite ». C\'est le gaspillage le plus rentable à traiter.'],
['M5-09','Flow Efficiency','Comment calcule-t-on l\'Efficience de flux (Flow Efficiency) ?','Flow Efficiency (%) = Process Time total ÷ Lead Time total × 100. Exemple : 4 heures de travail actif sur un délai de 5 jours (40 h ouvrées) = 10 % d\'efficience : 90 % du délai est de l\'attente.'],
['M5-10','%C&A','Que mesure l\'indicateur %C&A (Percent Complete and Accurate) en VSM ?','Le pourcentage de travail reçu par une étape qui est complet et correct, utilisable sans retouche ni demande d\'information complémentaire. Un %C&A faible révèle des reprises (rework) et des boucles de correction, sources majeures de délai et de gaspillage ; la qualité dès la conception (shift-left) l\'améliore.'],
['M5-11','WIP','Pourquoi limiter le travail en cours (WIP — Work In Progress) accélère-t-il un flux de valeur ?','Parce que plus il y a d\'éléments en cours simultanément, plus chacun attend (loi de Little : Lead Time = WIP ÷ débit), plus les changements de contexte et les files s\'allongent. Limiter le WIP force à terminer avant de commencer, réduit les attentes, rend les goulots visibles et raccourcit le délai de livraison. C\'est le principe des tableaux Kanban cités pour « Collaborer et promouvoir la visibilité ».'],
['M5-12','Goulot','Que se passe-t-il si l\'on optimise une étape située en amont ou en aval d\'un goulot d\'étranglement sans traiter le goulot lui-même ?','Le débit global du flux ne s\'améliore pas : en amont, on ne fait qu\'accumuler plus de stock devant le goulot (WIP et attente augmentent) ; en aval, l\'étape optimisée reste sous-alimentée. Seule l\'amélioration de la capacité du goulot (ou la réduction de sa charge) augmente le débit du flux entier (théorie des contraintes).'],
['M5-13','Muda','Quels types de gaspillages (Muda) le VSM permet-il de détecter dans les services numériques ?','Les attentes (tickets en file, validations en suspens), les transferts et reprises (rework, informations incomplètes), la surproduction (fonctionnalités non utilisées, rapports que personne ne lit), les traitements inutiles (approbations redondantes, double saisie), les mouvements et déplacements (bascule entre outils, réunions superflues), les stocks (WIP excessif, backlog obsolète), les défauts (incidents, bugs) et les talents sous-utilisés (experts occupés à des tâches automatisables).'],
['M5-14','Pensée complexe','Pourquoi ITIL® 5 intègre-t-il la Pensée complexe (Complexity Thinking) à la gestion des flux de valeur ?','Parce que les écosystèmes numériques (cloud, microservices, IA, partenaires multiples) sont des systèmes complexes où les relations de cause à effet ne sont pas toujours prévisibles. Appliquer partout des bonnes pratiques rigides échoue dans ces contextes. La pensée complexe aide à qualifier chaque situation (claire, compliquée, complexe, chaotique) et à adapter la manière de gérer le flux : standardiser, analyser, expérimenter ou agir d\'urgence.'],
['M5-15','Domaine Clair','Comment gérer un flux de valeur dans un domaine Clair / Simple (relations de cause à effet évidentes) ?','Détecter, catégoriser, répondre : appliquer les bonnes pratiques établies, standardiser et automatiser (changements standards, demandes de service via portail, runbooks). C\'est le domaine privilégié de « Optimiser et automatiser ». Vigilance : ne pas croire qu\'une situation est simple alors qu\'elle a évolué.'],
['M5-16','Domaine Compliqué','Comment gérer une situation dans un domaine Compliqué (plusieurs bonnes réponses possibles nécessitant une expertise) ?','Détecter, analyser, répondre : mobiliser des experts (architectes, spécialistes), analyser les données, comparer les options et choisir une bonne pratique adaptée. La relation de cause à effet existe mais demande de l\'analyse (ex. : diagnostic d\'un problème de performance, choix d\'une architecture).'],
['M5-17','Domaine Complexe','Quelle approche adopter dans un domaine Complexe (système imprévisible, émergent) ?','Sonder, détecter, répondre : lancer des expérimentations sûres (safe-to-fail), par exemple un pilote d\'agent IA sur un petit échantillon d\'utilisateurs, observer ce qui émerge, amplifier ce qui marche, stopper ce qui échoue. C\'est l\'application directe de « Progresser par itérations avec retours » ; les pratiques émergent de l\'expérience plutôt que d\'être prescrites.'],
['M5-18','Domaine Chaotique','Quelle est la priorité immédiate face à une situation Chaotique (urgence critique, aucune relation de cause à effet visible) ?','Agir, détecter, répondre : stabiliser d\'abord (procédure de crise, cellule d\'incident majeur, changement urgent avec retour arrière), sans attendre une analyse complète, puis, une fois la situation ramenée dans un domaine complexe ou compliqué, analyser et tirer les leçons (post-mortem sans blâme).'],
['M5-19','Cartographie','Qui doit participer à un atelier de Value Stream Mapping de l\'état actuel ?','Les représentants de toutes les étapes du flux, de bout en bout : métier et clients ou utilisateurs (la demande et la valeur perçue), équipes produit/développement, exploitation et support, sécurité, partenaires ou fournisseurs impliqués, et un sponsor ayant l\'autorité pour agir. Le flux doit être cartographié par ceux qui le vivent, pas pour eux ; c\'est aussi l\'application de « Collaborer et promouvoir la visibilité ».'],
['M5-20','VSM & IA','Comment le VSM et l\'IA se complètent-ils dans ITIL® 5 ?','Le VSM identifie dans le flux les étapes répétitives, les attentes et les reprises qui peuvent être déléguées à des algorithmes ou à des plateformes d\'AIOps (automatisation intelligente), et définit où l\'humain doit valider (flux hybrides). En retour, l\'IA fournit des données en continu (process mining, analyse des logs, détection des goulots) pour cartographier et mesurer le flux réel plutôt que le flux théorique, et alimente l\'amélioration continue.']
]},
{ id: 'T6', title: 'Module 6 : ITIL et l\'Intelligence Artificielle', file: 'Flashcards_Module6_ITIL_et_IA_ITIL5_v1.xlsx', cards: [
['Carte 01','Typologies d\'IA','Quel est l\'objectif principal de l\'intégration de l\'Intelligence Artificielle dans la gestion des produits et services numériques (DPSM) ?','Accélérer et personnaliser la co-création de valeur : passer d\'une gestion réactive à une gestion prédictive (AIOps), automatiser les tâches répétitives pour libérer les humains vers les activités à valeur ajoutée, fluidifier l\'expérience numérique (DX), tout en restant sous une gouvernance responsable (responsabilité humaine, transparence, conformité). L\'IA n\'est pas un outil externe mais le moteur d\'un SVS dynamique et adaptatif.'],
['Carte 02','Typologies d\'IA','Quelle différence distingue l\'IA Prédictive de l\'IA Générative (GenAI) ?','L\'IA prédictive (machine learning classique) analyse des données historiques pour reconnaître des patterns, classer, scorer ou anticiper (détection d\'anomalies, prévision de pannes, priorisation de tickets) : capacité Cognition du modèle 6C. L\'IA générative produit du contenu nouveau (texte, code, résumés d\'incidents, documentation) à partir d\'une requête : capacité Creation. L\'une prédit, l\'autre crée.'],
['Carte 03','Typologies d\'IA','Quelle différence fondamentale oppose l\'IA Générative (GenAI) à l\'IA Agentique (Agentic AI) ?','La GenAI répond à une sollicitation et produit un contenu ; l\'humain reste dans la boucle pour décider et agir. L\'IA agentique poursuit un objectif de manière autonome : elle planifie, enchaîne des actions (ouvrir un ticket, exécuter un runbook, redémarrer un service) et s\'adapte aux résultats, avec peu ou pas d\'intervention humaine. Elle exige un périmètre d\'autonomie défini, l\'auditabilité des actions et un mécanisme d\'arrêt (capacité Coordination).'],
['Carte 04','Cas d\'usage IA','Citez deux cas d\'usage concrets de l\'IA Générative dans l\'activité Soutenir (Support).','1. Un assistant virtuel de premier niveau qui dialogue avec l\'utilisateur, pré-qualifie l\'incident et propose des solutions issues de la base de connaissances (avec bascule vers un humain). 2. La rédaction automatique des fiches d\'incident, des résumés de résolution et des post-mortems à partir des échanges et des logs, pour alimenter la base des erreurs connues et la gestion des connaissances.'],
['Carte 05','Cas d\'usage IA','Comment s\'illustre l\'IA Agentique dans l\'activité Exploiter (Operate) ?','Par l\'AIOps autonome : un agent surveille en continu l\'infrastructure, détecte un incident naissant, en identifie la cause racine, exécute de lui-même un script de remédiation (redémarrage, bascule, ajustement de capacité cloud) et vérifie le retour à la normale, avant même que l\'utilisateur ne s\'en aperçoive (résolution prédictive). Sous gouvernance : périmètre d\'actions autorisées, journalisation et possibilité d\'arrêt humain.'],
['Carte 06','AIOps & Observabilité','Comment l\'IA renforce-t-elle l\'Observabilité dans le Système de Valeur ITIL® ?','Les systèmes modernes génèrent trop de logs, métriques et traces pour être surveillés par des humains. L\'IA corrèle ces signaux (Curation : réduction du bruit, regroupement d\'alertes), détecte les anomalies et les signaux faibles (Cognition), prédit les pannes et propose des pistes de résolution. L\'observabilité devient prédictive et alimente la gouvernance, l\'amélioration continue et les activités Exploiter, Livrer et Soutenir du PSLM.'],
['Carte 07','Principes Directeurs','Quel principe directeur ITIL® s\'applique impérativement avant d\'intégrer un agent IA dans un flux de valeur ?','« Optimiser et automatiser » : il faut d\'abord optimiser le flux (le cartographier, éliminer le gaspillage, le simplifier) avant de l\'automatiser, sinon on automatise l\'inefficacité. Il s\'applique conjointement avec « Privilégier la valeur » (l\'IA doit apporter une valeur réelle sans dégrader la DX), « Commencer là où vous êtes » (mesurer l\'existant) et « Progresser par itérations avec retours » (pilote sur un petit échantillon).'],
['Carte 08','Gouvernance de l\'IA','Qui porte la responsabilité finale (Accountability) lorsqu\'un système d\'IA prend une décision erronée ou cause un préjudice ?','Un être humain, toujours : les propriétaires de services (Service Owners) et le management de l\'IT restent légalement et opérationnellement responsables des résultats, même si l\'action a été exécutée par une IA. Cette responsabilité ne se délègue ni à la machine ni au fournisseur du modèle. C\'est la première règle d\'or de la gouvernance de l\'IA dans ITIL 5.'],
['Carte 09','Gouvernance de l\'IA','Que signifie le principe Human-in-the-Loop (HITL) dans la gouvernance de l\'IA ?','Qu\'un humain reste impliqué dans la boucle de décision de l\'IA : il valide, corrige ou peut stopper les propositions et actions de l\'algorithme, en particulier pour les décisions à fort impact (changements risqués, données sensibles, relation client délicate). Concrètement : scénarios de bascule vers un conseiller humain, validation humaine dans les flux hybrides, mécanisme d\'arrêt des automatisations. Il garantit la responsabilité humaine et la confiance des utilisateurs.'],
['Carte 10','Risques de l\'IA','Qu\'est-ce que la dérive d\'un modèle (Model Drift) et comment la prévenir ?','La dérive est la dégradation progressive de la précision ou l\'apparition de biais d\'un modèle lorsque les données réelles s\'éloignent de celles de son entraînement (nouveaux usages, nouveaux systèmes, changement de contexte). Prévention : surveillance continue des performances par l\'observabilité (taux d\'erreur, qualité des réponses), seuils d\'alerte, revues humaines régulières, ré-entraînement ou retrait du modèle, et curation continue des données.'],
['Carte 11','Risques de l\'IA','Qu\'appelle-t-on une hallucination dans le contexte de l\'IA Générative et quel contrôle ITIL® 5 permet de la limiter ?','Une hallucination est une réponse fausse ou inventée, mais présentée de façon plausible et assurée par l\'IA générative. Contrôles ITIL 5 : ancrer l\'IA dans la base de connaissances certifiée de l\'entreprise (technique RAG, Retrieval-Augmented Generation), assurer la qualité et la curation des données, imposer une revue humaine des contenus générés (capacité Creation) et exiger la transparence sur les sources.'],
['Carte 12','Éthique & Données','Quelle est la cause principale des biais discriminatoires produits par un système d\'IA ?','La qualité et la représentativité des données d\'entraînement et d\'alimentation : des données historiques elles-mêmes biaisées, incomplètes ou non représentatives sont reproduites et amplifiées par l\'algorithme (« garbage in, garbage out »). D\'où l\'importance de la curation des données (dimension Information et technologie), de la formation des équipes aux biais (dimension Organisations et personnes) et de l\'audit des modèles.'],
['Carte 13','Gouvernance de l\'IA','Pourquoi l\'explicabilité (Explainability) est-elle indispensable dans un cadre gouverné par ITIL® 5 ?','Parce que les algorithmes ne doivent pas être des « boîtes noires » : l\'organisation doit pouvoir auditer la provenance des données et expliquer comment et pourquoi une décision automatisée a été prise. C\'est nécessaire pour la responsabilité humaine (on ne peut répondre de ce qu\'on ne comprend pas), pour la conformité réglementaire (AI Act, RGPD : droit à l\'explication), pour la confiance des utilisateurs (DX) et pour corriger les biais ou dérives. C\'est la deuxième règle d\'or de la gouvernance de l\'IA.'],
['Carte 14','Sécurité des données','Quel risque de sécurité survient lorsqu\'un agent du support copie des données clients sensibles dans un outil d\'IA générative public ?','Une fuite de données confidentielles vers un serveur tiers : violation de la confidentialité et du RGPD, perte de maîtrise des données (elles peuvent servir à entraîner le modèle public), risque juridique et de réputation. Contrôles : filtres et anonymisation avant tout envoi, interdiction des outils non approuvés, outils d\'IA d\'entreprise sous contrat (clauses de non-réutilisation des données), formation des équipes et politique de sécurité de l\'information.'],
['Carte 15','Gouvernance de l\'IA','Qu\'est-ce que le Shadow AI et quel risque pose-t-il à la gouvernance des services ?','Le Shadow AI est l\'usage d\'outils d\'IA par des collaborateurs ou des équipes sans validation ni visibilité de l\'organisation (par analogie avec le shadow IT). Risques : fuite de données sensibles, décisions non auditables, non-conformité réglementaire, hallucinations intégrées dans des livrables, dépendance à des fournisseurs non contractualisés, et impossibilité d\'appliquer la gouvernance de l\'IA (responsabilité, transparence). Réponse : un catalogue d\'outils d\'IA approuvés, des politiques claires et des alternatives sécurisées.'],
['Carte 16','Cycle de vie des risques','La gestion des risques liés à l\'IA s\'arrête-t-elle une fois le modèle déployé en production ?','Non. Les risques évoluent après le déploiement : dérive du modèle, nouveaux biais, changement de contexte, nouvelles menaces de sécurité, évolution de la réglementation. La gestion des risques IA est continue : surveillance par l\'observabilité, revues périodiques, ré-entraînement, tests d\'arrêt, et réinjection des constats dans l\'amélioration continue, conformément au cycle de gouvernance Évaluer, Diriger, Contrôler.'],
['Carte 17','Maturité IA','À quoi servent les modèles de capacité IA (AI Capability Models) dans ITIL® 5 ?','À classifier fonctionnellement ce que fait une IA pour adapter la gouvernance à chaque usage. Le modèle 6C (Creation, Curation, Clarification, Cognition, Communication, Coordination) permet de définir pour chaque capacité un profil de risque, les contrôles nécessaires et le niveau de supervision humaine : on ne gouverne pas une IA qui filtre des alertes comme une IA qui coupe un serveur. Il sert aussi à évaluer la maturité de l\'organisation dans l\'adoption de l\'IA.'],
['Carte 18','Les 4 Dimensions','Quel piège classique d\'examen concerne l\'adoption de l\'IA vis-à-vis des 4 Dimensions ?','Croire que l\'IA ne relève que de la dimension Information et technologie. Une adoption réussie touche les quatre : Organisations et personnes (nouveaux rôles, compétences 6C, culture de responsabilité), Information et technologie (données, RAG, observabilité, gouvernance), Partenaires et fournisseurs (contrats avec les fournisseurs de modèles, lock-in), Flux de valeur et processus (flux hybrides, VSM). Négliger l\'une d\'elles fait échouer la création de valeur.'],
['Carte 19','Les 4 Dimensions','Quels points de vigilance la gouvernance de l\'IA impose-t-elle dans la dimension Partenaires et fournisseurs ?','Des clauses contractuelles strictes (SLA/XLA sur la disponibilité des API et la qualité d\'expérience), la protection de la propriété intellectuelle et des données (interdiction pour le fournisseur d\'entraîner ses modèles avec les données de l\'entreprise), la transparence sur les données partagées, la gestion de la dépendance et du vendor lock-in (plan de secours, réversibilité, bascule rapide vers un autre fournisseur) et la conformité réglementaire du fournisseur.'],
['Carte 20','Durabilité','Quel impact l\'usage intensif de grands modèles d\'IA a-t-il sur le pilier Durabilité d\'ITIL® 5 ?','Un impact significatif : consommation énergétique et empreinte carbone de l\'entraînement et de l\'inférence, consommation d\'eau des centres de données, pression sur le matériel. Le pilier Durabilité impose d\'en tenir compte : choisir des modèles proportionnés au besoin (pas de LLM pour une tâche simple), privilégier des fournisseurs à énergie renouvelable, mesurer et limiter les usages, intégrer ces critères dès l\'activité Concevoir et dans les choix de partenaires. Une IA qui crée de la valeur immédiate mais détruit la durabilité n\'est pas conforme à « Privilégier la valeur ».']
]},
{ id: 'T7', title: 'Module 7 : ITIL, DevOps & PRINCE2', file: 'Flashcards_Module7_ITIL_DevOps_PRINCE2_ITIL5_v1.xlsx', cards: [
['M7-01','Philosophie d\'intégration','Quelle approche ITIL® 5 préconise-t-il vis-à-vis des autres cadres et méthodes (DevOps, PRINCE2®, Agile) ?','Une approche d\'intégration et de complémentarité, pas de remplacement ni d\'exclusion : ITIL 5 fournit le cadre de gestion de la valeur de bout en bout (SVS, principes, gouvernance, pratiques) et s\'articule avec DevOps (ingénierie et automatisation), Agile (itérations), PRINCE2 (projets) et le SRE. Le principe « Commencer là où vous êtes » invite à s\'appuyer sur les cadres déjà en place.'],
['M7-02','Complémentarité ITIL® 5 & DevOps','Comment ITIL® 5 et DevOps se complètent-ils dans un flux de valeur numérique ?','DevOps apporte la collaboration Dev/Ops, les pipelines CI/CD, les déploiements fréquents et la mesure continue ; il accélère surtout les activités Construire, Transitionner et Exploiter du PSLM. ITIL 5 apporte le cadre de valeur (pourquoi et pour qui), la gouvernance, les pratiques (changements, incidents, problèmes, SLM/XLA) et l\'amélioration continue sur l\'ensemble du cycle. DevOps exécute vite ; ITIL 5 garantit que la vitesse crée de la valeur sous contrôle.'],
['M7-03','DevOps & Changements','Comment concilier la fréquence élevée des déploiements DevOps avec l\'Habilitation des changements d\'ITIL® 5 ?','En traitant les déploiements automatisés, testés et réversibles comme des changements standards (pré-autorisés), en évaluant le risque de façon automatisée (IA analysant les déploiements similaires passés), en réservant le CAB aux changements normaux significatifs ou majeurs, et en appliquant « Privilégier la simplicité » : supprimer les comités d\'approbation inutiles. L\'habilitation des changements devient un garde-fou intégré au pipeline, pas une barrière.'],
['M7-04','Culture sans blâme','Quel bénéfice commun tirent ITIL® 5 et DevOps des revues post-incident sans blâme (blameless post-mortems) ?','Une culture de confiance, de transparence et de droit à l\'erreur (dimension Organisations et personnes) où les équipes partagent honnêtement les faits, ce qui permet d\'identifier les vraies causes racines (gestion des problèmes), d\'alimenter l\'amélioration continue (registre CIR) et la gestion des connaissances, et d\'éviter que les problèmes soient cachés. Sans blâme, l\'apprentissage remplace la peur.'],
['M7-05','Acronyme CALMS (DevOps)','Que signifie l\'acronyme CALMS associé à DevOps et comment résonne-t-il avec ITIL® 5 ?','Culture, Automation, Lean, Measurement, Sharing. Culture → dimension Organisations et personnes et « Collaborer et promouvoir la visibilité » ; Automation → « Optimiser et automatiser », AIOps, CI/CD ; Lean → Value Stream Mapping, élimination du gaspillage, « Privilégier la simplicité » ; Measurement → SLA/XLA, observabilité, décisions data-driven de l\'amélioration continue ; Sharing → gestion des connaissances, post-mortems sans blâme. Les deux cadres partagent les mêmes valeurs.'],
['M7-06','Responsabilité produit DevOps','Comment le principe DevOps « You build it, you run it » s\'articule-t-il avec le cycle de vie ITIL® 5 ?','Il rejoint l\'orientation « produit end-to-end » du PSLM et les Product Teams pluridisciplinaires d\'ITIL 5 : la même équipe porte le produit de Découvrir à Soutenir, ce qui supprime les silos entre développement et exploitation et accélère la boucle de rétroaction. ITIL 5 y ajoute la responsabilité (accountability) claire des Service Owners, les pratiques d\'exploitation et de support, et la gouvernance qui encadre cette autonomie.'],
['M7-07','Observabilité & DevOps','Pourquoi l\'observabilité est-elle un pont essentiel entre DevOps et ITIL® 5 ?','Parce qu\'elle fournit les données communes aux deux mondes : les développeurs y voient le comportement de leur code en production, l\'exploitation y détecte les anomalies, la gestion des incidents et des problèmes s\'en nourrit, l\'AIOps l\'exploite pour la résolution prédictive, et l\'amélioration continue y puise ses mesures (étape « Où en sommes-nous ? »). Elle matérialise « Collaborer et promouvoir la visibilité » et le M (Measurement) de CALMS.'],
['M7-08','Périmètre PRINCE2® vs ITIL® 5','Quelle différence fondamentale distingue le périmètre de PRINCE2® de celui d\'ITIL® 5 ?','PRINCE2 gère un projet : un effort temporaire, avec début et fin, un cas d\'affaires, des produits (outputs) à livrer et une organisation projet dissoute à la clôture. ITIL 5 gère les produits et services numériques en continu tout au long de leur cycle de vie, centré sur la co-création de valeur (outcomes), l\'exploitation, le support et l\'amélioration permanente. Le projet livre, le service vit.'],
['M7-09','Business Case & Valeur','Quel lien unit le Cas d\'affaires (Business Case) de PRINCE2® et le principe « Privilégier la valeur » d\'ITIL® 5 ?','Les deux imposent de justifier en permanence qu\'une initiative apporte des bénéfices réels aux parties prenantes : le cas d\'affaires PRINCE2 documente coûts, risques et bénéfices attendus et est réévalué à chaque étape ; « Privilégier la valeur » exige que tout ce que fait l\'organisation soit relié à la valeur perçue. Les bénéfices du cas d\'affaires sont les outcomes qu\'ITIL 5 mesure ensuite, en exploitation, via les XLA et l\'amélioration continue.'],
['M7-10','Transition projet vers opérations','Quel risque survient lorsqu\'un projet PRINCE2® se clôture sans coordination avec l\'activité Transitionner d\'ITIL® 5 ?','Le produit est « jeté par-dessus le mur » : il arrive en production sans que l\'exploitation et le support soient prêts (pas de documentation, pas de surveillance, pas de base de connaissances, pas d\'accord SLA/XLA, pas de formation des utilisateurs), ce qui provoque incidents, insatisfaction et perte des bénéfices attendus. Les outputs sont livrés, mais les outcomes ne sont pas atteints.'],
['M7-11','Critères d\'acceptation opérationnelle','À quel moment les exigences d\'exploitation et de support ITIL® 5 doivent-elles être intégrées dans un projet PRINCE2® ?','Dès le début : lors de l\'initialisation du projet et de la description des produits (critères de qualité et d\'acceptation), c\'est-à-dire pendant les activités Découvrir et Concevoir du PSLM. Exploitabilité, supportabilité, sécurité, observabilité et expérience doivent faire partie des critères d\'acceptation, pas être découvertes à la clôture. C\'est la logique « shift-left » et la qualité dès la conception.'],
['M7-12','Gestion par exception (PRINCE2®)','Comment la « Gestion par exception » de PRINCE2® s\'aligne-t-elle avec la gouvernance d\'ITIL® 5 ?','Dans les deux cas, l\'instance de direction fixe des tolérances et des limites (temps, coût, qualité, risque ; politiques et contraintes de la gouvernance ITIL 5 : Diriger) et laisse les équipes agir en autonomie à l\'intérieur ; elle n\'intervient que lorsqu\'une tolérance risque d\'être dépassée (Évaluer, Contrôler). C\'est exactement le repositionnement de la gouvernance ITIL 5 : un mécanisme d\'orientation intégré au flux, pas une barrière administrative.'],
['M7-13','Focus produit vs service','Comment la notion de « produit » rapproche-t-elle PRINCE2® et ITIL® 5 ?','PRINCE2 est orienté produits : il planifie et contrôle le projet par les produits à livrer (descriptions de produits, critères de qualité). ITIL 5 est passé du « service » au « produit numérique » géré de bout en bout par une équipe produit. Le produit livré par le projet PRINCE2 devient le produit numérique dont ITIL 5 gère le cycle de vie (Transitionner, Exploiter, Livrer, Soutenir) : un vocabulaire et un objet communs facilitent le passage de relais.'],
['M7-14','Piège : Remplacement de cadre','Un directeur affirme que l\'adoption d\'ITIL® 5 impose d\'abandonner PRINCE2® et DevOps. Pourquoi est-ce faux ?','Parce qu\'ITIL 5 est conçu pour s\'intégrer aux autres cadres, pas pour les remplacer : ils ne couvrent pas le même périmètre (PRINCE2 : projets temporaires ; DevOps : culture et ingénierie de livraison ; ITIL 5 : gestion de la valeur des produits et services en continu). Le PSLM est explicitement aligné sur DevOps et le SRE, et le principe « Commencer là où vous êtes » recommande de s\'appuyer sur l\'existant. Abandonner ces cadres détruirait de la valeur.'],
['M7-15','Approche itérative commune','Quel point commun méthodologique unit ITIL® 5, DevOps et PRINCE2® Agile ?','L\'approche itérative et incrémentale avec retours : ITIL 5 par le principe « Progresser par itérations avec retours » et la boucle de rétroaction du PSLM ; DevOps par les livraisons fréquentes et le feedback continu (CI/CD) ; PRINCE2 Agile par les sprints, les releases et le management par étapes avec réévaluation du cas d\'affaires. Tous privilégient de petits incréments validés plutôt qu\'un livrable monolithique.'],
['M7-16','Changement urgent vs Projet','Une faille de sécurité critique exige un correctif immédiat en production. Faut-il lancer un projet PRINCE2® ou un changement urgent ITIL® 5 ?','Un changement urgent ITIL 5 : il s\'agit de limiter rapidement un impact métier, avec autorisation par l\'instance d\'urgence (ECAB), procédures allégées mais retour arrière testé, puis documentation a posteriori. Un projet PRINCE2 (initialisation, plan, étapes) serait trop lent et disproportionné. Une fois la crise traitée, un problème et, si besoin, un projet d\'amélioration structurelle peuvent être lancés.'],
['M7-17','Flux de valeur multi-référentiels','Dans une organisation combinant PRINCE2®, DevOps et ITIL® 5, qui assure la vision de bout en bout du flux de valeur ?','ITIL 5, à travers son système de valeur et la dimension Flux de valeur et processus : le propriétaire du produit ou du service (Service/Product Owner) et la gouvernance ITIL assurent la cohérence de la demande à la valeur, en intégrant le projet PRINCE2 (qui livre un incrément) et les pipelines DevOps (qui construisent et déploient) comme des contributions au flux global. La cartographie des flux (VSM) rend cette vision explicite.'],
['M7-18','Qualité dès la conception','Comment DevOps et ITIL® 5 abordent-ils la qualité et la sécurité des produits numériques ?','Tous deux les intègrent dès l\'amont plutôt qu\'en contrôle final : DevOps par le shift-left (tests automatisés, sécurité dans le pipeline, DevSecOps) ; ITIL 5 par l\'activité Concevoir qui intègre utilité, garantie, durabilité, DX et security by design (pratique Sécurité de l\'information), par les changements standards automatisés et par l\'observabilité en exploitation. La qualité est construite, pas inspectée.'],
['M7-19','Rôle du Comité de pilotage vs Gouvernance ITIL','Quelle différence existe entre le Comité de pilotage (Project Board) de PRINCE2® et la Gouvernance dans l\'ITIL VS ?','Le Comité de pilotage gouverne un projet précis et temporaire : il valide le cas d\'affaires, fixe les tolérances, décide aux limites d\'étapes et se dissout à la clôture. La Gouvernance ITIL 5 est permanente et s\'applique à toute l\'organisation et à tous ses produits et services : elle évalue, dirige et contrôle en continu (stratégie, politiques, conformité, éthique de l\'IA, allocation des ressources). Le comité de pilotage opère à l\'intérieur du cadre fixé par la gouvernance ITIL.'],
['M7-20','Synthèse : Trio gagnant V5','Résumez en une phrase le rôle respectif de PRINCE2®, DevOps et ITIL® 5 dans une entreprise numérique.','PRINCE2 pilote les projets qui créent ou font évoluer les produits (temporaire, cas d\'affaires, livrables), DevOps fournit la culture et l\'automatisation pour les construire et les déployer vite et sûrement, et ITIL 5 gouverne et gère la valeur de ces produits et services de bout en bout et en continu (SVS, pratiques, expérience, amélioration continue, IA responsable).']
]}
];

/* ===== MOTEUR DE L'APPLICATION ===== */
(function(){
'use strict';
const COURSE = [MODULE_A, MODULE_B];
const SECTIONS = []; const CHAPTERS = []; const SEC_BY_ID = {}; const CH_BY_ID = {}; const CH_OF_SEC = {};
COURSE.forEach(m => m.chapters.forEach(ch => { ch.module = m; CHAPTERS.push(ch); CH_BY_ID[ch.id] = ch; ch.sections.forEach(s => { s.chapter = ch; SECTIONS.push(s); SEC_BY_ID[s.id] = s; CH_OF_SEC[s.id] = ch.id; }); }));
const Q = QUESTIONS.map((q, i) => ({ id: 'q' + i, sec: q[0], ch: CH_OF_SEC[q[0]], text: q[1], choices: q[2], answer: q[3], explain: q[4] }));
const TF = TRUEFALSE.map((t, i) => ({ id: 'tf' + i, sec: t[0], ch: CH_OF_SEC[t[0]], text: t[1], answer: t[2], explain: t[3] }));
const EXAMQ = {}; EXAMS.forEach(ex => { ex.items = ex.questions.map((q, i) => { const o = { id: ex.id + '-' + i, sec: q[0], ch: CH_OF_SEC[q[0]], text: q[1], choices: q[2], answer: q[3], explain: q[4] }; EXAMQ[o.id] = o; return o; }); });
const QBYID = {}; Q.forEach(q => QBYID[q.id] = q);
const findQ = id => QBYID[id] || EXAMQ[id];
const CARDS = FLASHCARDS.map((c, i) => ({ id: 'c' + i, ch: c[0], front: c[1], back: c[2] }));
const EXAM_POOLS = [
  { name: 'Concepts clés', n: 12, test: q => /^B2-[1-6]$/.test(q.sec) },
  { name: 'SVS', n: 16, test: q => q.ch === 'B4' && q.sec !== 'B4-4' },
  { name: 'PSLM', n: 4, test: q => q.sec === 'B2-7' || q.sec === 'B4-4' },
  { name: 'Quatre Dimensions', n: 2, test: q => q.ch === 'B3' },
  { name: 'Introduction et IA', n: 2, test: q => q.ch === 'B1' },
  { name: 'Pratiques', n: 4, test: q => q.ch[0] === 'A' || q.ch === 'B5' }
];
const CHEAT_PART = q => { const p = EXAM_POOLS.find(p => p.test(q)); return p ? p.name : 'Autre'; };

/* ---------- état ---------- */
const KEY = 'itil5-prep-v1';
let S = load();
function fresh(){ return { read:{}, mastery:{}, quiz:{}, secquiz:{}, qstats:{}, cards:{}, exams:[], examDate:'', last:'', theme:'', trainer:{} }; }
function load(){ try { const r = localStorage.getItem(KEY); if (r) return Object.assign(fresh(), JSON.parse(r)); } catch(e){} return fresh(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function applyTheme(){ const r = document.documentElement; if (S.theme) r.setAttribute('data-theme', S.theme); else r.removeAttribute('data-theme'); }
applyTheme();

/* ---------- utilitaires ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (arr, n) => shuffle(arr).slice(0, n);
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { try { return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }); } catch(e){ return d; } };
let toastT; function toast(msg){ let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 1800); }

/* progression */
function chapterProgress(ch){ const n = ch.sections.length; const r = ch.sections.filter(s => S.read[s.id]).length; return { read: r, n, pct: pct(r, n) }; }
function chapterBest(chId){ const q = S.quiz[chId]; return q && q.attempts.length ? Math.max(...q.attempts.map(a => pct(a.score, a.total))) : null; }
function chapterLast(chId){ const q = S.quiz[chId]; return q && q.attempts.length ? q.attempts[q.attempts.length - 1] : null; }
function recordAnswer(qid, ok){ const st = S.qstats[qid] || (S.qstats[qid] = { ok: 0, ko: 0 }); ok ? st.ok++ : st.ko++; }
function weakSections(){
  const bySec = {};
  Q.concat(TF).forEach(q => { const st = S.qstats[q.id]; if (!st) return; const b = bySec[q.sec] || (bySec[q.sec] = { ok: 0, ko: 0 }); b.ok += st.ok; b.ko += st.ko; });
  return Object.entries(bySec).map(([id, b]) => ({ id, rate: pct(b.ok, b.ok + b.ko), n: b.ok + b.ko })).filter(x => x.n >= 2 && x.rate < 70).sort((a, b) => a.rate - b.rate).slice(0, 5);
}
function overall(){ const r = SECTIONS.filter(s => S.read[s.id]).length; return { read: r, n: SECTIONS.length, pct: pct(r, SECTIONS.length) }; }
function nextUnread(){ return SECTIONS.find(s => !S.read[s.id]) || SECTIONS[0]; }

/* ---------- routage ---------- */
const VIEWS = { home: renderHome, cours: renderCourse, entrainement: renderTraining, examen: renderExam, formateur: renderTrainer, glossaire: renderGlossary, syntheses: renderCheat, planning: renderPlanner, reglages: renderSettings };
function route(){
  const h = (location.hash || '#home').slice(1);
  let view = h, arg = null;
  const m = h.match(/^(sec|chap|quiz|cards|match|vf|tdeck|tcards)-(.+)$/);
  if (m) { view = m[1]; arg = m[2]; }
  if (view === 'sec' || view === 'chap') { S.last = h; save(); }
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === topViewOf(view)));
  const main = $('#main'); main.innerHTML = '';
  $('.side').classList.remove('open');
  const fn = { sec: renderSection, chap: renderChapter, quiz: renderQuiz, cards: renderCards, match: renderMatch, vf: renderTF, tdeck: renderTrainerDeck, tcards: renderTrainerCards }[view] || VIEWS[view] || renderHome;
  fn(main, arg);
  renderSide(view, arg);
  window.scrollTo({ top: 0 });
}
function topViewOf(v){ if (['tdeck','tcards'].includes(v)) return 'formateur'; if (['sec','chap','cours'].includes(v)) return 'cours'; if (['quiz','cards','match','vf','entrainement'].includes(v)) return 'entrainement'; return v; }
window.addEventListener('hashchange', route);

/* ---------- barre latérale ---------- */
function renderSide(view, arg){
  const curCh = view === 'sec' ? CH_OF_SEC[arg] : view === 'chap' ? arg : view === 'quiz' || view === 'cards' || view === 'match' || view === 'vf' ? arg : null;
  $('.side').innerHTML = COURSE.map(m => `<div class="mod"><div class="mt">${esc(m.code)} · ${esc(m.title)}</div>${m.chapters.map(ch => { const p = chapterProgress(ch); return `<button class="ch ${ch.id === curCh ? 'on' : ''}" data-go="chap-${ch.id}"><span class="dot ${p.pct === 100 ? 'done' : p.pct > 0 ? 'part' : ''}"></span><span style="flex:1;min-width:0">${esc(shortTitle(ch))}</span><span class="pct">${p.read}/${p.n}</span></button>`; }).join('')}</div>`).join('');
}
function shortTitle(ch){ const t = ch.title.replace(/^La pratique /, '').replace(/^Partie (\d) : /, '$1. '); return t.charAt(0).toUpperCase() + t.slice(1); }

/* ---------- ACCUEIL ---------- */
function renderHome(el){
  const o = overall();
  const last = S.last && (S.last.startsWith('sec-') || S.last.startsWith('chap-')) ? S.last : null;
  const nx = nextUnread();
  const weak = weakSections();
  const exams = S.exams;
  const lastExam = exams[exams.length - 1];
  const days = S.examDate ? Math.ceil((new Date(S.examDate) - new Date(today())) / 86400000) : null;
  const mastered = Object.values(S.mastery).filter(v => v === 'ok').length;
  const toReview = Object.values(S.mastery).filter(v => v === 'review').length;
  let reco;
  if (weak.length) { const s = SEC_BY_ID[weak[0].id]; reco = { title: s.title, sub: `${weak[0].rate} % de bonnes réponses sur cette section`, go: 'sec-' + s.id }; }
  else if (toReview) { const id = Object.keys(S.mastery).find(k => S.mastery[k] === 'review'); reco = { title: SEC_BY_ID[id].title, sub: 'Section marquée « à revoir »', go: 'sec-' + id }; }
  else reco = { title: nx.title, sub: S.read[nx.id] ? 'Tout le cours est lu : passez aux examens blancs' : 'Prochaine section non lue', go: 'sec-' + nx.id };
  el.innerHTML = `<div class="wrap">
  <div class="eyebrow">Tableau de bord</div><h1>Préparation ITIL 5 Foundation</h1>
  <div class="row" style="margin-bottom:16px">
    <a class="btn primary" href="#${last || 'sec-' + nx.id}">${last ? 'Reprendre où j\'en étais' : 'Commencer le cours'}</a>
    <a class="btn" href="#examen">Examen blanc</a>
    ${days !== null ? `<span class="pill ${days < 7 ? 'bad' : days < 21 ? 'warn' : 'acc'}">${days > 0 ? 'J-' + days : days === 0 ? 'Examen aujourd\'hui' : 'Examen passé'} · ${fmtDate(S.examDate)}</span>` : `<a class="btn ghost small" href="#planning">Définir la date d'examen</a>`}
  </div>
  <div class="grid c3">
    <div class="card stat"><small>Cours lu</small><b>${o.pct} %</b><div class="bar"><i style="width:${o.pct}%"></i></div><small>${o.read} / ${o.n} sections</small></div>
    <div class="card stat"><small>Sections maîtrisées</small><b>${mastered}</b><small>${toReview} à revoir</small></div>
    <div class="card stat"><small>Dernier examen blanc</small><b>${lastExam ? pct(lastExam.score, lastExam.total) + ' %' : '—'}</b><small>${lastExam ? (pct(lastExam.score, lastExam.total) >= 65 ? 'Réussi' : 'Échec') + ' · ' + fmtDate(lastExam.date) : 'Aucun examen passé'}</small></div>
  </div>
  <div class="grid c2" style="margin-top:14px">
    <div class="card"><div class="eyebrow">Recommandation du jour</div><h3 style="margin-top:6px">${esc(reco.title)}</h3><p class="muted">${esc(reco.sub)}</p><a class="btn small" href="#${reco.go}">Ouvrir la section</a></div>
    <div class="card"><div class="eyebrow">Points faibles détectés</div>${weak.length ? `<ul class="weak" style="padding-left:1.1em;margin:8px 0 0">${weak.map(w => `<li><a href="#sec-${w.id}">${esc(SEC_BY_ID[w.id].title)}</a> <span class="pill bad">${w.rate} %</span></li>`).join('')}</ul>` : `<p class="muted" style="margin-top:8px">Aucun point faible identifié pour l'instant. Les points faibles apparaissent après vos quiz et examens blancs.</p>`}</div>
  </div>
  <h2 style="margin-top:26px">Avancement par chapitre</h2>
  ${COURSE.map(m => `<div class="eyebrow" style="margin:14px 0 6px">${esc(m.code)} · ${esc(m.title)}</div><ul class="list">${m.chapters.map(ch => { const p = chapterProgress(ch); const b = chapterBest(ch.id); return `<li><a class="item" href="#chap-${ch.id}" style="text-decoration:none"><span class="num">${esc(ch.id)}</span><span class="t">${esc(shortTitle(ch))}<small>${p.read}/${p.n} sections lues${b !== null ? ' · meilleur quiz ' + b + ' %' : ''}</small></span><span style="width:110px;flex:none"><span class="bar"><i class="${p.pct === 100 ? 'ok' : ''}" style="width:${p.pct}%"></i></span></span>${b !== null ? `<span class="pill ${b >= 80 ? 'ok' : b >= 65 ? 'warn' : 'bad'}">${b} %</span>` : ''}</a></li>`; }).join('')}</ul>`).join('')}
  ${exams.length ? `<h2 style="margin-top:26px">Progression aux examens blancs</h2><div class="card">${examChart(exams)}</div>` : ''}
  </div>`;
}
function examChart(exams){
  const W = 640, H = 200, px = 36, py = 18, n = exams.length;
  const xs = i => n === 1 ? W / 2 : px + i * (W - 2 * px) / (n - 1);
  const ys = v => H - py - (v / 100) * (H - 2 * py);
  const pts = exams.map((e, i) => [xs(i), ys(pct(e.score, e.total))]);
  const line = pts.map(p => p.join(',')).join(' ');
  const area = `M${pts[0][0]},${H - py} L${line.replace(/ /g, ' L')} L${pts[pts.length - 1][0]},${H - py} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scores des examens blancs">
  ${[0, 25, 50, 65, 75, 100].map(v => `<line x1="${px}" x2="${W - px}" y1="${ys(v)}" y2="${ys(v)}" stroke="${v === 65 ? 'var(--ok)' : 'var(--line)'}" stroke-dasharray="${v === 65 ? '4 3' : ''}"/><text x="${px - 6}" y="${ys(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`).join('')}
  <path d="${area}" fill="var(--accent)" opacity=".12"/>
  <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === n - 1 ? 5 : 3.5}" fill="${pct(exams[i].score, exams[i].total) >= 65 ? 'var(--ok)' : 'var(--bad)'}"/><text x="${p[0]}" y="${p[1] - 9}" font-size="10" text-anchor="middle" fill="var(--fg)">${pct(exams[i].score, exams[i].total)}</text>`).join('')}
  <text x="${W - px}" y="${ys(65) - 4}" font-size="10" text-anchor="end" fill="var(--ok)">seuil 65 %</text>
  </svg><p class="muted" style="margin:6px 0 0;font-size:.82rem">${n} examen${n > 1 ? 's' : ''} blanc${n > 1 ? 's' : ''} · moyenne ${Math.round(exams.reduce((a, e) => a + pct(e.score, e.total), 0) / n)} %</p>`;
}

/* ---------- COURS ---------- */
function renderCourse(el){
  el.innerHTML = `<div class="wrap"><div class="eyebrow">Cours</div><h1>Parcours de révision</h1><p class="muted">Deux modules, à suivre dans l'ordre recommandé : d'abord les pratiques, puis la démarche ITIL 5 Foundation. Chaque chapitre se termine par un quiz.</p>
  ${COURSE.map(m => `<h2 style="margin-top:22px">${esc(m.code)} · ${esc(m.title)}</h2><p class="muted">${esc(m.intro)}</p><ul class="list">${m.chapters.map(ch => { const p = chapterProgress(ch); return `<li><a class="item" href="#chap-${ch.id}" style="text-decoration:none"><span class="num">${esc(ch.id)}</span><span class="t">${esc(ch.title)}<small>${ch.en ? esc(ch.en) + ' · ' : ''}${ch.weight ? esc(ch.weight) + ' · ' : ''}${p.n} sections</small></span><span class="pill ${p.pct === 100 ? 'ok' : p.pct ? 'warn' : ''}">${p.pct} %</span></a></li>`; }).join('')}</ul>`).join('')}</div>`;
}
function renderChapter(el, id){
  const ch = CH_BY_ID[id]; if (!ch) return renderCourse(el);

/* QCM générique : config {title, sub, questions, onDone(score,total,details), backHash, showSecLink} */
function runQuiz(el, cfg){
  const qs = cfg.questions.map(q => { const order = shuffle([0, 1, 2, 3]); return { q, order, sel: null }; });
  let i = 0; const total = qs.length;

    el.innerHTML = `<div class="wrap"><div class="crumbs"><a href="#${cfg.backHash}">← ${esc(cfg.backLabel || 'Retour')}</a></div><div class="eyebrow">${esc(cfg.sub || '')}</div><h2>${esc(cfg.title)}</h2>

    <div class="card q"><div class="qt">${esc(q.text)}</div><div class="choices">${it.order.map((ci, k) => `<button class="choice ${answered ? (ci === q.answer ? 'good' : (k === it.sel ? 'wrong' : '')) : ''}" data-k="${k}" ${answered ? 'disabled' : ''}><span class="k">${'ABCD'[k]}</span><span>${esc(q.choices[ci])}</span></button>`).join('')}</div>
    ${answered ? `<div class="explain ${ok ? 'ok' : 'ko'}"><b>${ok ? 'Bonne réponse.' : 'Mauvaise réponse.'}</b> ${esc(q.explain)} ${cfg.showSecLink !== false ? `<br><a href="#sec-${q.sec}">Relire la section : ${esc(SEC_BY_ID[q.sec].title)}</a>` : ''}</div>` : ''}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn" id="prevq" ${i === 0 ? 'disabled' : ''}>← Précédente</button>${answered ? `<button class="btn primary" id="nextq">${i === total - 1 ? 'Voir le résultat' : 'Question suivante →'}</button>` : '<span class="muted">Choisissez une réponse</span>'}</div></div>`;
    el.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => { it.sel = +b.dataset.k; const good = it.order[it.sel] === q.answer; recordAnswer(q.id, good); save(); render(); }));
    const p = $('#prevq'); if (p) p.addEventListener('click', () => { i--; render(); });

  };

    const score = qs.filter(x => x.sel !== null && x.order[x.sel] === x.q.answer).length;
    const wrong = qs.filter(x => x.sel === null || x.order[x.sel] !== x.q.answer);
    cfg.onDone && cfg.onDone(score, total, qs);

    el.innerHTML = `<div class="wrap"><div class="crumbs"><a href="#${cfg.backHash}">← ${esc(cfg.backLabel || 'Retour')}</a></div><h2>${esc(cfg.title)} : résultat</h2>
    <div class="card" style="text-align:center"><div class="score-big" style="color:${p >= 65 ? 'var(--ok)' : 'var(--bad)'}">${p} %</div><p>${score} bonne${score > 1 ? 's' : ''} réponse${score > 1 ? 's' : ''} sur ${total}${p >= 65 ? ' · seuil de 65 % atteint' : ' · sous le seuil de 65 %'}</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Recommencer</button><a class="btn" href="#${cfg.backHash}">${esc(cfg.backLabel || 'Retour')}</a></div></div>
    ${wrong.length ? `<h3 style="margin-top:22px">Questions à revoir (${wrong.length})</h3>${wrong.map(x => `<div class="card q"><div class="qt">${esc(x.q.text)}</div><p><b>Bonne réponse :</b> ${esc(x.q.choices[x.q.answer])}</p><div class="explain">${esc(x.q.explain)}<br><a href="#sec-${x.q.sec}">Relire : ${esc(SEC_BY_ID[x.q.sec].title)}</a></div></div>`).join('')}` : '<p class="muted" style="margin-top:20px">Sans faute. Bravo !</p>'}</div>`;
    $('#again').addEventListener('click', () => runQuiz(el, cfg));

}
function renderQuiz(el, arg){

/* Flashcards (Leitner : boîtes 0..3, délais 0/1/3/7 jours) */
const BOX_DAYS = [0, 1, 3, 7];
function dueCards(){ const now = Date.now(); return CARDS.filter(c => { const st = S.cards[c.id]; return !st || !st.due || st.due <= now; }); }
function renderCards(el, arg){

/* Associations */
function renderMatch(el, chId){
  const ch = CH_BY_ID[chId]; if (!ch) return renderTraining(el);
  const exs = MATCHING.filter(m => m.chapter === chId); let ei = 0;
  const render = () => {
    if (ei >= exs.length) { el.innerHTML = `<div class="wrap"><div class="crumbs"><a href="#chap-${chId}">← Retour au chapitre</a></div><h2>Associations terminées</h2><div class="card" style="text-align:center"><p>Vous avez complété les ${exs.length} exercice${exs.length > 1 ? 's' : ''} du chapitre.</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Recommencer</button><a class="btn" href="#chap-${chId}">Retour au chapitre</a></div></div></div>`; $('#again').addEventListener('click', () => renderMatch(el, chId)); return; }
    const ex = exs[ei]; const left = shuffle(ex.pairs.map((p, k) => ({ k, t: p[0] }))); const right = shuffle(ex.pairs.map((p, k) => ({ k, t: p[1] })));

    R.forEach(b => b.addEventListener('click', () => { if (!selL || b.classList.contains('done')) return; if (b.dataset.k === selL.dataset.k) { b.classList.add('done'); selL.classList.add('done'); selL.classList.remove('sel'); done.add(b.dataset.k); selL = null; if (done.size === ex.pairs.length) { $('#mstat').textContent = errors ? `Terminé avec ${errors} erreur${errors > 1 ? 's' : ''}.` : 'Terminé sans erreur !'; $('#mnext').innerHTML = `<button class="btn primary" id="mn">${ei === exs.length - 1 ? 'Terminer' : 'Exercice suivant →'}</button>`; $('#mn').addEventListener('click', () => { ei++; render(); }); } } else { errors++; b.classList.add('err'); selL.classList.add('err'); const s = selL; setTimeout(() => { b.classList.remove('err'); s.classList.remove('err'); }, 500); $('#mstat').textContent = 'Ce n\'est pas la bonne association, réessayez.'; } }));
  };
  render();
}

/* ---------- EXAMEN BLANC ---------- */
function buildExam(){
  const used = new Set(); const out = [];
  EXAM_POOLS.forEach(p => { const cand = Q.filter(q => p.test(q) && !used.has(q.id)); pick(cand, p.n).forEach(q => { used.add(q.id); out.push({ q, part: p.name }); }); });
  return shuffle(out);
}
